<style>
:root{
  --bg:#f7f9fd;--card:#ffffff;--ink:#141b2d;--muted:#667085;--line:#e4e8f1;--soft:#eef1f8;
  --star:#ffb020;--ok:#12a36b;--bad:#ef4444;--okbg:#e6f7ef;--badbg:#fdeaea;--pen:#ef4444;--c:#3b6ef5;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.07);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1322;--card:#181f33;--ink:#eef2ff;--muted:#9aa4bf;--line:#2a3350;--soft:#1f2740;--okbg:#10301f;--badbg:#3a1618;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1322;--card:#181f33;--ink:#eef2ff;--muted:#9aa4bf;--line:#2a3350;--soft:#1f2740;--okbg:#10301f;--badbg:#3a1618;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 55%,transparent);outline-offset:2px}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;background:none;border:none;cursor:pointer;padding:2px;white-space:nowrap;letter-spacing:-.01em}
.crumbs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{font-size:.88rem;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.sep{color:var(--muted)}
.sync{font-size:.8rem;font-weight:800;white-space:nowrap;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.sync.off{color:var(--bad)}
.stars{font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#ffd166,#ffb020);color:#3d2a00;border-radius:999px;padding:5px 12px;box-shadow:0 2px 8px rgba(255,176,32,.35)}
@media(max-width:300px){.brand .bt{display:none}}
@media(max-width:560px){.top{flex-wrap:wrap;row-gap:8px;padding:8px 12px}.brand{margin-right:auto}.crumbs{order:5;flex:1 1 100%}
  .crumbs:empty{display:none}.crumb{font-size:.82rem;padding:4px 10px}.stars,.playchip,.sync{padding:5px 10px}}

/* Seite */
.sheet{max-width:780px;margin:0 auto;padding:22px 18px 64px;min-height:calc(100vh - 60px)}
.h1{font-weight:900;font-size:clamp(1.6rem,5.2vw,2.2rem);line-height:1.12;letter-spacing:-.02em;margin:.1em 0 .35em}
.h2{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:1.6em 0 .7em;color:var(--muted)}

      learn:{ table:true, tips:['Zehner-Einmaleins: 7 · 30 ist 7 · 3 Zehner = 21 Zehner = 210.',"Stellen-Einmaleins: 6 · 400 = 24 Hunderter = 2'400.","Geteilt genauso: 3'600 : 9 → 36 Hunderter : 9 = 4 Hunderter = 400."], examples:['7 · 30 = 210',"6 · 400 = 2'400",'280 : 7 = 40'] }},
    { id:'fig1', no:'Thema 5', title:'Figuren 1', de:'Quadrat und Rechteck, Parkette, Spiegelbilder', icon:'🔷', gen:'fig1', lp:'MA.2.A.1',
      learn:{ tips:['Ein Quadrat hat vier gleich lange Seiten und vier rechte Winkel. Ein Rechteck hat vier rechte Winkel, gegenüberliegende Seiten sind gleich lang.','Ein Parkett bedeckt eine Fläche ohne Lücken und ohne Überlappungen.','Eine Figur ist achsensymmetrisch, wenn beide Hälften beim Falten genau aufeinander passen.'], examples:['Achsensymmetrisch: A, H, M, T','Nicht achsensymmetrisch: F, G, R'] }},
    { id:'addsub', no:'Thema 6', title:'Addition und Subtraktion', de:'Mit grossen Zahlen im Kopf und schriftlich rechnen', icon:'➕', gen:'addsub', lp:'MA.1.A.3.d, MA.1.A.3.e',
      learn:{ tips:["Im Kopf mit Tausendern rechnen: 320'000 + 38'000 → 320 T + 38 T = 358 T.",'Schriftlich: Einer unter Einer, Zehner unter Zehner. Beginne rechts, den Übertrag schreibst du klein in die nächste Spalte.',"Überprüfe mit Überschlagen: 4'582 + 3'719 ist etwa 4'600 + 3'700 = 8'300."], examples:["320'000 + 38'000 = 358'000","4'582 + 3'719 = 8'301","7'204 − 2'658 = 4'546"] }},
    { id:'fig2', no:'Thema 7', title:'Figuren 2', de:'Linien, Kreise, vergrössern und verkleinern', icon:'⭕', gen:'fig2', lp:'MA.2.A.1, MA.2.A.2',
      learn:{ tips:['Parallele Linien haben überall den gleichen Abstand und treffen sich nie.','Senkrechte Linien bilden einen rechten Winkel.','Der Radius geht vom Mittelpunkt bis zum Kreisrand. Der Durchmesser ist doppelt so lang wie der Radius.','Vergrössern auf das Doppelte: alle Längen mal 2. Verkleinern auf die Hälfte: alle Längen durch 2.'], examples:['Radius 4 cm → Durchmesser 8 cm','6 cm doppelt so gross → 12 cm'] }},
    { id:'md2', no:'Thema 8', title:'Multiplikation und Division 2', de:'Rechenwege beim Multiplizieren und Dividieren', icon:'➗', gen:'malgeteilt', lp:'MA.1.A.3.e',
      learn:{ tips:["Nullen zuerst weglassen und am Schluss anhängen: 6 · 400 → 6 · 4 = 24 → 2'400.","Zerlegen: 45 · 24 = 40 · 24 + 5 · 24 = 960 + 120 = 1'080.",'Geteilt in Schritten: 231 : 7 → 210 : 7 = 30 und 21 : 7 = 3, zusammen 33.','Du darfst Zwischenschritte auf ein Blatt schreiben.'], examples:["45 · 240 = 10'800",'231 : 7 = 33'] }},
    { id:'sach', no:'Thema 9', title:'Sachrechnen', de:'Einkaufen, Probieren, Würfelspiele', icon:'🛒', gen:'sach', lp:'MA.3.C.2',
      learn:{ tips:['Lies die Aufgabe zweimal. Was ist gegeben, was ist gesucht?','Schreib eine Rechnung dazu und am Schluss einen Antwortsatz.','1 Fr. = 100 Rp.'], examples:['4 Hefte zu 3 Fr. → 4 · 3 = 12 Fr.','50 Fr. − 37 Fr. = 13 Fr. Rückgeld'] }},
    { id:'koerper', no:'Thema 10', title:'Körper und Pläne', de:'Würfel, Quader, Würfelgebäude', icon:'🧊', gen:'koerper', lp:'MA.2.A.1, MA.2.B.1',
      learn:{ tips:['Ein Würfel hat 6 Flächen (alles Quadrate), 12 Kanten und 8 Ecken.','Ein Quader hat auch 6 Flächen, 12 Kanten und 8 Ecken. Seine Flächen sind Rechtecke.','Würfelgebäude zählen: Stockwerk für Stockwerk.'], examples:['Würfel: 6 Flächen, 12 Kanten, 8 Ecken'] }},
    { id:'muster', no:'Thema 11', title:'Muster und Zahlenrätsel', de:'Zahlenfolgen, Zahlenmauern, Zahlenrätsel', icon:'🧱', gen:'muster', lp:'MA.1.B.1',
      learn:{ tips:['Zahlenfolge: Finde die Regel zwischen zwei Nachbarzahlen und wende sie weiter an.','Zahlenmauer: Zwei Steine nebeneinander ergeben zusammen den Stein darüber.','Zahlenrätsel: Rechne rückwärts. Aus «verdoppeln und 7 dazu» wird «7 weg und halbieren».'], examples:['3, 7, 11, 15 → 19','Mauer 5, 8, 2 → 13, 10 → 23'] }},
    { id:'zeit', no:'Thema 12', title:'Uhr und Zeit', de:'Uhr lesen, Zeiteinheiten, Zeitpunkt und Zeitdauer', icon:'⏰', clockGame:true, gen:'zeit', lp:'MA.3.A.2.f',
      learn:{ tips:['Der kurze Zeiger zeigt die Stunden, der lange Zeiger die Minuten.','Steht der lange Zeiger auf der 3, ist es Viertel nach. Auf der 6 ist es halb, auf der 9 Viertel vor.','Am Nachmittag zählst du 12 Stunden dazu: 3 Uhr am Nachmittag ist 15:00.','1 d = 24 h, 1 h = 60 min, 1 min = 60 s','Zeitdauer in Schritten rechnen: von 8:45 bis 9:00 sind es 15 min, dann bis 10:15 noch 75 min. Zusammen 90 min.'], examples:['2 h = 120 min','1 h 15 min = 75 min','8:45 bis 10:15 Uhr = 90 min','9:50 + 25 min = 10:15'] }},
    { id:'brueche', no:'Freiwillig', title:'Brüche', de:'Freiwillig: geht über die Grundanforderungen hinaus', icon:'🍕', gen:'brueche', lp:'MA.1.C.2',
      learn:{ tips:['Ein Viertel (¼) heisst: das Ganze in 4 gleiche Teile teilen und 1 Teil nehmen.','Je grösser die Zahl unten, desto kleiner die Teile: ½ ist grösser als ¼.'], examples:['½ von 20 = 10','¼ von 20 = 5','⅓ von 12 = 4'] }},
    { id:'blitz', no:'Extra', title:'Blitzrechnen', de:'Kopfrechnen fürs ganze Jahr', icon:'⚡', gen:'kopfmix', lp:'MA.1.A.3.d',
      learn:{ table:true, tips:['Jeden Tag ein paar Minuten reichen. Tempo kommt mit der Übung.'], examples:['7 · 8 = 56',"4 · 300 = 1'200",'640 : 8 = 80'] }},
    { id:'begriffe', no:'Extra', title:'Mathe-Wörter', de:'Summe, Differenz, Produkt, Quotient und mehr', icon:'💬', gen:'begriffe', choiceOnly:true, lp:'MA.1.A.1.e, MA.1.A.1.f',
      learn:{ tips:['Plus heisst Addition: Summand + Summand = Summe.','Minus heisst Subtraktion: Das Ergebnis heisst Differenz.','Mal heisst Multiplikation: Faktor · Faktor = Produkt.','Geteilt heisst Division: Das Ergebnis heisst Quotient.','Was beim Teilen übrig bleibt, heisst Rest: 17 : 5 = 3 Rest 2.','Eine Quadratzahl ist eine Zahl mal sich selbst: 7 · 7 = 49.'] }}
  ]}]},
  { grade:5, books:[ { id:'ma5', name:'Lehrplan 21', units:[
    { id:"zahl", no:"Thema 1", title:"Zahlen bis 1 Million und darüber", de:"Stellenwerte, ordnen, zählen in Schritten", icon:"🔢", gen:"zahl5", lp:"MA.1.A.1.f, MA.1.A.2.e, MA.1.C.2.e", learn:{"tips": ["Stellenwerte: Mio (Millionen), HT, ZT, T, H, Z, E. Eine Million = 1'000'000 = 1000 Tausender.", "Grosse Zahlen schreibst du in Dreiergruppen mit Apostroph: 2'345'678.", "Vergleichen: zuerst die Anzahl Stellen, dann von links Ziffer für Ziffer.", "Beim Zählen in Schritten verändert sich nur eine Stelle, ausser es gibt einen Übertrag."], "examples": ["4 HT + 3 ZT + 5 T = 435'000", "990'000 + 10'000 = 1'000'000", "1 Milliarde = 1000 Millionen"]} },
    { id:"runden", no:"Thema 2", title:"Runden und Überschlagen", de:"Auf Zehner, Hunderter, Tausender runden und schätzen", icon:"🎯", gen:"runden5", lp:"MA.1.A.2.f, MA.1.A.4.f", learn:{"tips": ["Schau auf die Ziffer rechts von der Rundungsstelle: 0 bis 4 abrunden, 5 bis 9 aufrunden.", "Runde 34'567 auf Tausender: Die Hunderterziffer ist 5 → aufrunden → 35'000.", "Überschlagen heisst: zuerst runden, dann im Kopf rechnen. So merkst du, ob ein Ergebnis stimmen kann."], "examples": ["2'462 ≈ 2'000 (auf Tausender)", "58 · 31 ≈ 60 · 30 = 1'800", "4'812 + 3'190 ≈ 5'000 + 3'000 = 8'000"]} },
    { id:"teiler", no:"Thema 3", title:"Teiler und Vielfache", de:"Teilbarkeit, Teiler und Vielfache bestimmen", icon:"➗", gen:"teiler5", lp:"MA.1.A.4.f, MA.1.C.2.f", learn:{"tips": ["Vielfache von 6: 6, 12, 18, 24, … (die Einmaleins-Reihe).", "Teiler von 12: 1, 2, 3, 4, 6, 12. Jede Zahl ist durch 1 und durch sich selbst teilbar.", "Durch 2 teilbar: letzte Ziffer gerade. Durch 5: letzte Ziffer 0 oder 5. Durch 10: letzte Ziffer 0.", "Durch 3 teilbar, wenn die Quersumme durch 3 teilbar ist: 471 → 4 + 7 + 1 = 12."], "examples": ["Teiler von 18: 1, 2, 3, 6, 9, 18", "345 ist durch 5 teilbar", "Quersumme von 252 = 9 → durch 9 teilbar"]} },
    { id:"kopf", no:"Thema 4", title:"Kopfrechnen und Rechenvorteile", de:"Geschickt rechnen bis 4 Wertziffern", icon:"🧠", gen:"kopf5", lp:"MA.1.A.3.d, MA.1.A.4.e", learn:{"tips": ["Mit Hundertern rechnen wie mit Einern: 4'800 + 3'700 = 48 H + 37 H = 85 H = 8'500.", "Rechenvorteil: 25 · 36 = 25 · 4 · 9 = 100 · 9 = 900.", "Verdoppeln und Halbieren: 50 · 48 = 100 · 24 = 2'400.", "Umkehraufgabe zur Kontrolle: 640 : 8 = 80, denn 80 · 8 = 640."], "examples": ["6'300 − 2'800 = 3'500", "25 · 48 = 1'200", "2'400 : 6 = 400"]} },
    { id:"mult", no:"Thema 5", title:"Multiplizieren mit grösseren Zahlen", de:"Malkreuz, eigene Rechenwege und Überschlag", icon:"✖️", gen:"mult5", lp:"MA.1.A.3.e, MA.1.B.2.e", learn:{"tips": ["Zerlege eine Zahl: 34 · 26 = 34 · 20 + 34 · 6 = 680 + 204 = 884.", "Malkreuz: Zerlege beide Zahlen in Zehner und Einer und rechne alle Teile.", "Mach zuerst einen Überschlag: 34 · 26 ≈ 30 · 30 = 900. Das Ergebnis muss in der Nähe liegen."], "examples": ["47 · 12 = 470 + 94 = 564", "213 · 4 = 852", "Überschlag 312 · 48 ≈ 300 · 50 = 15'000"]} },
    { id:"div", no:"Thema 6", title:"Dividieren", de:"Durch einstellige Zahlen teilen, mit und ohne Rest", icon:"➗", gen:"div5", lp:"MA.1.A.3.e, MA.1.B.2.e", learn:{"tips": ["Zerlege die Zahl in Teile, die gut teilbar sind: 672 : 6 = 600 : 6 + 72 : 6 = 100 + 12 = 112.", "Bleibt etwas übrig, ist das der Rest: 50 : 7 = 7 Rest 1, denn 7 · 7 = 49.", "Kontrolle mit der Umkehraufgabe: 112 · 6 = 672."], "examples": ["735 : 5 = 147", "95 : 4 = 23 Rest 3", "2'436 : 6 = 406"]} },
    { id:"dez", no:"Thema 7", title:"Dezimalzahlen", de:"Lesen, ordnen, addieren und subtrahieren", icon:"🔟", gen:"dez5", lp:"MA.1.A.1.g, MA.1.A.2.f, MA.1.A.3.e", learn:{"tips": ["Nach dem Dezimalpunkt kommen Zehntel, dann Hundertstel: 3.45 = 3 Einer, 4 Zehntel, 5 Hundertstel.", "Beim Rechnen schreibst du Stelle unter Stelle, Punkt unter Punkt: 3.45 + 1.2 = 4.65.", "Vergleichen: 2.5 ist grösser als 2.45, denn 5 Zehntel sind mehr als 4 Zehntel.", "Du kannst Punkt oder Komma eingeben: 4.65 und 4,65 gelten beide."], "examples": ["0.5 = 5 Zehntel = 1/2", "2.30 Fr. + 1.80 Fr. = 4.10 Fr.", "1.75 m = 175 cm"]} },
    { id:"bruch", no:"Thema 8", title:"Brüche", de:"Darstellen, vergleichen, kürzen und erweitern", icon:"🍕", gen:"bruch5", lp:"MA.1.A.2.f, MA.1.A.3.e, MA.1.C.2.f", learn:{"tips": ["Ein Bruch hat Zähler (oben) und Nenner (unten): 3/4 heisst 3 von 4 gleich grossen Teilen.", "Erweitern: Zähler und Nenner mit der gleichen Zahl malnehmen: 1/2 = 2/4 = 3/6.", "Kürzen: Zähler und Nenner durch die gleiche Zahl teilen: 6/8 = 3/4.", "3/4 von 20: zuerst 20 : 4 = 5, dann 5 · 3 = 15.", "1/2 = 50 %, 1/4 = 25 %, 1/10 = 10 %."], "examples": ["2/4 = 1/2", "3/5 = 6/10", "1/4 von 80 = 20"]} },
    { id:"geo", no:"Thema 9", title:"Geometrie: Winkel und Kreise", de:"Parallel, senkrecht, Winkelarten, Radius und Durchmesser", icon:"📐", gen:"geo5", lp:"MA.2.A.1.g, MA.2.A.2.f", learn:{"tips": ["Parallele Geraden schneiden sich nie. Senkrechte Geraden bilden einen rechten Winkel (90°).", "Winkelarten: spitz (kleiner als 90°), recht (90°), stumpf (zwischen 90° und 180°), gestreckt (180°).", "Der Durchmesser ist doppelt so lang wie der Radius.", "Mit dem Geodreieck zeichnest du Senkrechte und Parallele, mit dem Zirkel Kreise."], "examples": ["Radius 4 cm → Durchmesser 8 cm", "45° ist spitz", "Ein Quadrat hat 4 Symmetrieachsen"]} },
    { id:"flaeche", no:"Thema 10", title:"Umfang und Fläche", de:"Rechtecke, Quadrate und zusammengesetzte Figuren", icon:"⬛", gen:"flaeche5", lp:"MA.2.A.1.g, MA.3.A.2.f", learn:{"tips": ["Umfang = alle Seiten zusammen. Rechteck: 2 · Länge + 2 · Breite.", "Fläche = Länge · Breite. Die Einheit ist cm² oder m² (Quadratzentimeter, Quadratmeter).", "Zusammengesetzte Figuren zerlegst du in Rechtecke und zählst die Flächen zusammen.", "Achtung: Umfang in cm oder m, Fläche in cm² oder m²."], "examples": ["Rechteck 6 m · 4 m: Fläche 24 m², Umfang 20 m", "Quadrat 5 cm: Fläche 25 cm²", "1 m² = 100 dm²"]} },
    { id:"masse", no:"Thema 11", title:"Masseinheiten und Massstab", de:"Längen, Gewichte, Hohlmasse, Zeit und Karten", icon:"⚖️", gen:"masse5", lp:"MA.3.A.1.f, MA.3.A.2.f", learn:{"tips": ["1 km = 1'000 m · 1 kg = 1'000 g · 1 t = 1'000 kg", "1 l = 10 dl = 1'000 ml · 1 h = 60 min · 1 min = 60 s", "Dezimalzahlen umwandeln: 2.5 km = 2'500 m, 0.75 l = 750 ml.", "Massstab 1 : 1000 heisst: 1 cm auf der Karte sind 1000 cm = 10 m in Wirklichkeit."], "examples": ["3.2 kg = 3'200 g", "1 h 45 min = 105 min", "1 : 25'000 → 4 cm = 1 km"]} },
    { id:"sach", no:"Thema 12", title:"Sachrechnen", de:"Preise, Mengen und Rückgeld", icon:"🛒", gen:"sach5", lp:"MA.1.B.1.e, MA.3.C.1.e", learn:{"tips": ["Lies die Aufgabe genau: Was weiss ich? Was ist gesucht?", "Dreisatz: Zuerst für 1 Stück rechnen, dann für die gesuchte Anzahl: 3 Hefte 4.50 Fr. → 1 Heft 1.50 Fr. → 7 Hefte 10.50 Fr.", "Mach eine Tabelle, wenn mehrere Werte zusammengehören.", "Kontrolliere mit einem Überschlag, ob das Ergebnis passt."], "examples": ["4 Brötchen à 1.20 Fr. = 4.80 Fr.", "20 Fr. − 13.40 Fr. = 6.60 Fr.", "In 3 h fährt das Velo 45 km"]} },
    { id:"daten", no:"Thema 13", title:"Daten, Kombinatorik und Zufall", de:"Tabellen lesen, Möglichkeiten zählen, sicher oder unmöglich", icon:"📊", gen:"daten5", lp:"MA.3.C.1.e, MA.3.C.2.e", learn:{"tips": ["In einer Tabelle oder einem Diagramm findest du Werte schnell. Lies zuerst die Überschrift und die Einheiten.", "Kombinationen: 3 T-Shirts und 2 Hosen ergeben 3 · 2 = 6 Möglichkeiten.", "Zufall: sicher (passiert immer), möglich (kann passieren), unmöglich (passiert nie)."], "examples": ["4 Glacesorten, 2 Becher → 8 Möglichkeiten", "Würfel: eine 3 ist möglich", "Münze: «Zahl» oder «Kopf»"]} }
  ]}]},
  { grade:6, books:[ { id:'ma6', name:'Lehrplan 21', units:[
    { id:"mio", no:"Thema 1", title:"Grosse Zahlen bis 1 Million", de:"Stellenwerte, runden, ordnen, Zahlenstrahl", icon:"🔢", gen:"mio6", lp:"MA.1.A.1.f, MA.1.A.2.f, MA.1.A.4.f", learn:{"tips": ["1 Million = 1'000'000 = 1000 Tausender.", "Runden: Schau auf die Ziffer rechts von der Rundungsstelle. 0 bis 4 abrunden, 5 bis 9 aufrunden.", "Die Mitte zwischen zwei Zahlen: (a + b) : 2."], "examples": ["347'812 ≈ 350'000 (auf Zehntausender)", "Mitte von 200'000 und 600'000 = 400'000"]} },
    { id:"kopf", no:"Thema 2", title:"Kopfrechnen und Überschlagen", de:"Bis 4 Wertziffern geschickt rechnen", icon:"🧠", gen:"kopf6", lp:"MA.1.A.3.e, MA.1.A.2.g", learn:{"tips": ["Mit Hundertern wie mit Einern rechnen: 4800 + 3700 = 48 H + 37 H = 85 H.", "Rechenvorteile: 25 · 48 = 100 · 12 = 1200.", "Überschlag vor dem Rechnen: 592'000 : 195 ≈ 600'000 : 200 = 3000."], "examples": ["6'300 + 2'800 = 9'100", "4'536 : 6 = 756"]} },
    { id:"dez", no:"Thema 3", title:"Dezimalzahlen", de:"Ordnen, addieren, subtrahieren und multiplizieren", icon:"🔟", gen:"dez6", lp:"MA.1.A.2.g, MA.1.A.3.f, MA.1.A.3.g", learn:{"tips": ["Stellen: Einer . Zehntel Hundertstel Tausendstel. 1.043 < 1.05 < 1.43.", "Addieren und subtrahieren: Punkt unter Punkt.", "Multiplizieren: 12 · 0.3 = 3.6. Zehntel mal Zehntel gibt Hundertstel: 0.4 · 0.5 = 0.2.", "Mal 10 schiebt das Komma eine Stelle nach rechts, geteilt durch 10 eine Stelle nach links."], "examples": ["3.4 + 0.25 = 3.65", "12 · 0.3 = 3.6", "4.7 : 100 = 0.047"]} },
    { id:"bruch", no:"Thema 4", title:"Brüche", de:"Kürzen, erweitern, addieren und andere Schreibweisen", icon:"🍰", gen:"bruch6", lp:"MA.1.A.1.h, MA.1.A.3.f, MA.1.A.3.g", learn:{"tips": ["Kürzen: Zähler und Nenner durch die gleiche Zahl teilen: 6/8 = 3/4.", "Erweitern: Zähler und Nenner mit der gleichen Zahl multiplizieren: 2/3 = 8/12.", "Gleiche Nenner: nur die Zähler addieren: 2/5 + 1/5 = 3/5.", "Andere Schreibweisen: 1/4 = 0.25 = 25 %."], "examples": ["9/12 = 3/4", "1/2 + 1/4 = 3/4", "3/4 = 0.75 = 75 %"]} },
    { id:"teiler", no:"Thema 5", title:"Teiler, Vielfache und Primzahlen", de:"Teilbarkeit und kleinstes gemeinsames Vielfaches", icon:"🧮", gen:"teiler6", lp:"MA.1.A.1.g, MA.1.A.1.h, MA.1.A.4.f", learn:{"tips": ["Primzahlen haben genau zwei Teiler: 1 und sich selbst. 2, 3, 5, 7, 11, 13, 17, 19 …", "1 ist keine Primzahl.", "Kleinstes gemeinsames Vielfaches von 4 und 6: 12."], "examples": ["Teiler von 20: 1, 2, 4, 5, 10, 20", "31 ist eine Primzahl"]} },
    { id:"masse", no:"Thema 6", title:"Masse umwandeln", de:"Länge, Gewicht, Hohlmasse, Zeit und Flächenmasse", icon:"⚖️", gen:"masse6", lp:"MA.3.A.1.f, MA.3.A.1.h, MA.3.A.2.g", learn:{"tips": ["Kilo = 1000, Dezi = 1/10, Centi = 1/100, Milli = 1/1000.", "1 t = 1000 kg, 1 kg = 1000 g, 1 g = 1000 mg. 1 l = 10 dl = 100 cl = 1000 ml.", "Flächenmasse: 1 m² = 100 dm², 1 dm² = 100 cm²."], "examples": ["3.5 kg = 3500 g", "2 m 45 cm = 245 cm", "4 m² = 400 dm²"]} },
    { id:"flaeche", no:"Thema 7", title:"Umfang, Fläche und Volumen", de:"Rechteck, Quadrat und Quader", icon:"📐", gen:"flaeche6", lp:"MA.2.A.3.e, MA.2.A.3.f", learn:{"tips": ["Umfang Rechteck = 2 · (Länge + Breite).", "Fläche Rechteck = Länge · Breite (in cm², m²).", "Volumen Quader = Länge · Breite · Höhe (in cm³)."], "examples": ["Rechteck 8 cm × 5 cm: Fläche 40 cm², Umfang 26 cm", "Quader 4 · 3 · 2 = 24 cm³"]} },
    { id:"geo", no:"Thema 8", title:"Winkel, Koordinaten und Massstab", de:"Geodreieck, Koordinatensystem und Pläne", icon:"📍", gen:"geo6", lp:"MA.2.C.2.g, MA.2.C.4.d, MA.2.C.4.f", learn:{"tips": ["Spitzer Winkel: kleiner als 90°. Rechter Winkel: genau 90°. Stumpfer Winkel: zwischen 90° und 180°.", "Koordinaten (x|y): zuerst nach rechts, dann nach oben.", "Massstab 1 : 1000: 1 cm auf dem Plan = 1000 cm = 10 m in Wirklichkeit."], "examples": ["(3|5): 3 nach rechts, 5 nach oben", "1 : 100 → 4 cm = 4 m"]} },
    { id:"prop", no:"Thema 9", title:"Proportionalität und Mittelwert", de:"Preise, Mengen und Tabellen", icon:"📊", gen:"prop6", lp:"MA.3.A.3.d, MA.3.A.3.e, MA.3.A.1.h", learn:{"tips": ["Proportional: doppelt so viel kostet doppelt so viel.", "Rechne über 1 kg oder 100 g: 20 Fr./kg → 100 g kosten 2 Fr. → 300 g kosten 6 Fr.", "Mittelwert: alle Werte addieren und durch die Anzahl teilen."], "examples": ["100 g = 5.40 Fr. → 300 g = 16.20 Fr.", "Mittelwert von 4, 6, 8 = 6"]} },
    { id:"gleich", no:"Thema 10", title:"Rechenregeln und Gleichungen", de:"Punkt vor Strich, Klammern und x finden", icon:"🟰", gen:"gleich6", lp:"MA.1.A.4.g", learn:{"tips": ["Punkt vor Strich: Mal und geteilt zuerst, dann plus und minus.", "Was in der Klammer steht, rechnest du zuerst.", "Gleichungen löst du mit der Umkehrrechnung: x + 37 = 100 → x = 100 − 37 = 63."], "examples": ["5 + 3 · 4 = 17", "(5 + 3) · 4 = 32", "6 · x = 42 → x = 7"]} }
  ]}]}
]},
{ id:'de', name:'Deutsch', icon:'📚', color:'#12A874', lang:'de-CH', grades:[
  { grade:3, books:[ { id:'de3', name:'Lehrplan 21', units:[
    { id:"abc", no:"Thema 1", title:"ABC und Nachschlagen", de:"Alphabet und Wörter im Wörterbuch finden", icon:"🔤", gen:"abc", lp:"D.5.E.1", learn:{"tips": ["Das ABC hat 26 Buchstaben. Ä, ö und ü werden wie a, o und u eingeordnet.", "Gleicher erster Buchstabe? Dann entscheidet der zweite: Apfel vor Arm.", "Verben findest du im Wörterbuch in der Grundform: «er lief» → laufen."], "examples": ["Ball – Baum – Bett", "Esel vor Eule"]} },

    { id:"wortart", no:"Thema 1", title:"Wortarten", de:"Nomen, Verb, Adjektiv, Pronomen und Partikeln", icon:"🏷️", gen:"wortart5", choiceOnly:true, labels:{ calc:["🏷️","Wortarten bestimmen","Welche Wortart ist markiert?"] }, lp:"D.5.D.1", learn:{"tips": ["Nomen: Probe mit Artikel (der, die, das). Verb: Probe mit «ich …, du …». Adjektiv: Probe «sehr …» oder steigern.", "Pronomen stehen für ein Nomen oder begleiten es: ich, du, er, sie, wir, mein, dein, unser.", "Präpositionen zeigen, wo oder wohin: auf, unter, neben, mit, nach, in.", "Konjunktionen verbinden Wörter oder Sätze: und, oder, aber, weil, dass."], "examples": ["der Wald (Nomen)", "wir wandern (Pronomen + Verb)", "auf dem Dach (Präposition)", "weil es regnet (Konjunktion)"]} },
    { id:"pron", no:"Thema 2", title:"Pronomen", de:"Personalpronomen und Possessivpronomen", icon:"👤", lp:"D.5.D.1", learn:{"tips": ["Personalpronomen ersetzen Nomen: Lea → sie, der Hund → er, die Kinder → sie.", "Possessivpronomen zeigen, wem etwas gehört: mein, dein, sein, ihr, unser, euer.", "Lea und ihr Bruder. Tim und sein Hund."], "examples": ["Mia liest. Sie liest.", "Das ist unser Haus.", "Tim sucht seinen Ball."]}, quiz:[["Lea hat einen Hund. ___ Hund heisst Rex.", "Ihr", "Sein", "Mein", "Unser"], ["Tim sucht ___ Turnschuhe.", "seine", "ihre", "unsere", "eure"], ["Die Kinder spielen. ___ sind im Garten.", "Sie", "Er", "Es", "Wir"], ["Der Baum ist alt. ___ steht hier seit 100 Jahren.", "Er", "Sie", "Es", "Ihr"], ["Wir lieben ___ Katze.", "unsere", "eure", "ihre", "seine"], ["Habt ihr ___ Hausaufgaben gemacht?", "eure", "unsere", "seine", "ihre"], ["Welches Wort ist ein Personalpronomen?", "wir", "unser", "Haus", "schnell"], ["Welches Wort ist ein Possessivpronomen?", "dein", "du", "dich", "dir"], ["Das Velo gehört mir. Es ist ___ Velo.", "mein", "dein", "sein", "ihr"], ["Ersetze «Oma und Opa»:", "sie", "er", "es", "ihr"], ["Ersetze «das Pferd»:", "es", "er", "sie", "wir"], ["Mia und ich gehen ins Kino. ___ freuen uns.", "Wir", "Sie", "Ihr", "Ich"]], write:[["Ersetze «der Lehrer» durch ein Pronomen.", "er"], ["Ersetze «die Lehrerin».", "sie"], ["Ersetze «das Kind».", "es"], ["Das Buch gehört dir. Es ist ___ Buch.", "dein"]] },
    { id:"partikel", no:"Thema 3", title:"Präpositionen und Konjunktionen", de:"Wörter, die zeigen, wo, und Wörter, die verbinden", icon:"🔗", lp:"D.5.D.1", learn:{"tips": ["Präpositionen: auf, unter, neben, hinter, vor, zwischen, in, mit, nach, von, bei.", "Konjunktionen: und, oder, aber, denn, weil, dass, wenn, obwohl.", "Nach «weil», «dass», «wenn» und «obwohl» steht das Verb am Schluss: …, weil es regnet."], "examples": ["Die Katze liegt unter dem Tisch.", "Ich gehe raus, obwohl es kalt ist.", "Willst du Tee oder Saft?"]}, quiz:[["Ich bleibe drinnen, ___ es regnet.", "weil", "obwohl", "aber", "oder"], ["Ich gehe raus, ___ es kalt ist.", "obwohl", "weil", "denn", "und"], ["Willst du Tee ___ Saft?", "oder", "weil", "dass", "obwohl"], ["Ich weiss, ___ du recht hast.", "dass", "das", "weil", "oder"], ["Ich möchte mitkommen, ___ ich bin krank.", "aber", "weil", "dass", "oder"], ["___ es schneit, fahren wir Ski.", "Wenn", "Aber", "Oder", "Denn"], ["Die Lampe hängt ___ dem Tisch.", "über", "unter", "zwischen", "nach"], ["Der Ball liegt ___ den zwei Bäumen.", "zwischen", "auf", "über", "nach"], ["Wir fahren ___ Zürich.", "nach", "über", "unter", "zwischen"], ["Welches Wort ist eine Präposition?", "neben", "weil", "und", "schnell"], ["Welches Wort ist eine Konjunktion?", "weil", "unter", "Tisch", "laufen"], ["Welcher Satz ist richtig?", "Ich bin froh, weil die Sonne scheint.", "Ich bin froh, weil scheint die Sonne.", "Ich bin froh, weil die Sonne gescheint."]], write:[["Ich gehe schlafen, ___ ich müde bin. (Grund)", "weil"], ["Ich glaube, ___ es morgen regnet.", "dass"], ["Möchtest du Pizza ___ Pasta?", "oder"], ["Das Bild hängt ___ dem Sofa. (oberhalb)", "über"]] },
    { id:"zeitf", no:"Thema 4", title:"Zeitformen", de:"Präsens, Präteritum, Perfekt, Futur und Plusquamperfekt", icon:"⏳", gen:"zeit5", choiceOnly:true, labels:{ calc:["⏳","Zeitformen","Erkenne und bilde die Zeitform"] }, lp:"D.5.D.1", learn:{"tips": ["Präsens: Mia spielt. Präteritum: Mia spielte. Perfekt: Mia hat gespielt.", "Futur (Zukunft): wird + Grundform: Mia wird spielen.", "Plusquamperfekt (Vorvergangenheit): was noch früher passiert ist: Mia hatte gespielt, bevor es regnete. Du lernst es erst kennen."], "examples": ["Ich fahre – fuhr – bin gefahren – werde fahren", "Wir lesen – lasen – haben gelesen – werden lesen", "Tim hatte gegessen, bevor er ging."]} },
    { id:"satzgl", no:"Thema 5", title:"Satzglieder", de:"Verschiebeprobe, Subjekt, Prädikat und Objekt", icon:"🧩", gen:"satzgl", choiceOnly:true, labels:{ calc:["🧩","Satzglieder","Subjekt, Prädikat, Objekt und Verschiebeprobe"] }, lp:"D.5.D.1, D.5.A.1", learn:{"tips": ["Verschiebeprobe: Was beim Umstellen zusammenbleibt, ist ein Satzglied. [Der Hund] [jagt] [die Katze]. → [Die Katze] [jagt] [der Hund]? Nein: [Jagt] [der Hund] [die Katze]?", "Prädikat: das Verb (die Personalform). Es steht im Aussagesatz an 2. Stelle.", "Subjekt: Wer oder was tut etwas? Objekt: Wen oder was? / Wem?"], "examples": ["[Mia] [schenkt] [ihrem Bruder] [ein Buch].", "Subjekt: Mia", "Prädikat: schenkt"]} },
    { id:"faelle", no:"Thema 6", title:"Die vier Fälle entdecken", de:"Wer, wen, wem, wessen? Fragen stellen", icon:"❓", lp:"D.5.D.1", learn:{"tips": ["Mit Fragen findest du den Fall eines Nomens heraus.", "Wer oder was? (Nominativ): Der Hund bellt.", "Wen oder was? (Akkusativ): Ich sehe den Hund.", "Wem? (Dativ): Ich gebe dem Hund einen Knochen.", "Wessen? (Genitiv): Das ist der Knochen des Hundes.", "Die Fälle lernst du jetzt kennen. Bestimmen musst du sie erst in der Oberstufe."], "examples": ["der Freund – den Freund – dem Freund – des Freundes"]}, quiz:[["Ich sehe ___ (der Hund).", "den Hund", "dem Hund", "der Hund", "des Hundes"], ["Ich gebe ___ (die Katze) Futter.", "der Katze", "die Katze", "den Katze", "des Katze"], ["___ (der Lehrer) erklärt die Aufgabe.", "Der Lehrer", "Den Lehrer", "Dem Lehrer", "Des Lehrers"], ["Ich helfe ___ (mein Bruder).", "meinem Bruder", "meinen Bruder", "mein Bruder", "meines Bruders"], ["Das ist das Velo ___ (der Nachbar).", "des Nachbarn", "den Nachbarn", "dem Nachbar", "der Nachbar"], ["Mit welcher Frage findest du «den Ball» in «Tim wirft den Ball»?", "Wen oder was?", "Wer oder was?", "Wem?", "Wessen?"], ["Mit welcher Frage findest du «dem Kind» in «Ich schenke dem Kind ein Buch»?", "Wem?", "Wen oder was?", "Wer oder was?", "Wessen?"], ["Mit welcher Frage findest du das Subjekt?", "Wer oder was?", "Wem?", "Wessen?", "Wen oder was?"], ["Wir besuchen ___ (die Oma).", "die Oma", "der Oma", "den Oma", "des Oma"], ["Ich danke ___ (die Lehrerin).", "der Lehrerin", "die Lehrerin", "den Lehrerin", "des Lehrerin"], ["Das ist das Haus ___ (die Familie).", "der Familie", "die Familie", "den Familie", "dem Familie"], ["Ich suche ___ (das Buch).", "das Buch", "dem Buch", "des Buches", "den Buch"]], write:[["Ich sehe ___ Baum. (der)", "den"], ["Ich gebe ___ Mann die Hand. (der)", "dem"], ["___ Katze schläft. (die)", "Die"], ["Ich helfe ___ Frau. (die)", "der"]] },
    { id:"wbild", no:"Thema 7", title:"Wortbildung", de:"Wortstamm, Vorsilben, Nachsilben und zusammengesetzte Wörter", icon:"🧱", lp:"D.5.C.1, D.5.D.1", learn:{"tips": ["Zusammengesetzte Nomen: Haus + Tür = Haustür. Das letzte Wort bestimmt den Artikel: die Tür → die Haustür.", "Vorsilben verändern die Bedeutung: fahren → abfahren, verfahren, erfahren.", "Nachsilben machen aus Adjektiven oder Verben Nomen: frei → die Freiheit, wohnen → die Wohnung, freundlich → die Freundlichkeit.", "Wörter mit -heit, -keit, -ung, -nis schreibst du gross."], "examples": ["Schule + Haus = Schulhaus", "krank → die Krankheit", "hoffen → die Hoffnung"]}, quiz:[["Schnee + Mann = ?", "der Schneemann", "die Schneemann", "das Schneemann", "der Schneemänner"], ["Welcher Artikel passt zu «Haustür»?", "die", "der", "das", "den"], ["frei → die ___", "Freiheit", "Freiung", "Freinis", "Freikeit"], ["wohnen → die ___", "Wohnung", "Wohnheit", "Wohnkeit", "Wohnnis"], ["freundlich → die ___", "Freundlichkeit", "Freundlichheit", "Freundlichung", "Freundlichnis"], ["erleben → das ___", "Erlebnis", "Erlebung", "Erlebheit", "Erlebkeit"], ["Welche Vorsilbe passt? Der Zug ___fährt um 8 Uhr.", "ab", "ver", "be", "zer"], ["Welches Wort gehört NICHT zur Wortfamilie «fahren»?", "Farbe", "Fahrer", "Fahrt", "abfahren"], ["Wie heisst der Wortstamm von «Spieler»?", "spiel", "spie", "ler", "spieler"], ["Welches Wort ist zusammengesetzt?", "Apfelbaum", "Apfel", "Baum", "äpfeln"], ["krank → die ___", "Krankheit", "Krankung", "Kranknis", "Krankkeit"], ["Welche Nachsilbe macht aus «lesen» ein Adjektiv?", "-bar (lesbar)", "-ung (Lesung)", "-er (Leser)", "-heit"]], write:[["Velo + Weg = ?", "Veloweg"], ["hoffen → die ___", "Hoffnung"], ["gesund → die ___", "Gesundheit"], ["Sonne + Blume = ?", "Sonnenblume"]] },
    { id:"gross", no:"Thema 8", title:"Gross- und Kleinschreibung", de:"Nomen, Satzanfang und Nominalisierungen", icon:"🔠", lp:"D.5.E.1", learn:{"tips": ["Gross schreibst du: Satzanfänge, Nomen und Namen.", "Verben und Adjektive können zu Nomen werden. Dann schreibst du sie gross. Signalwörter: das, beim, zum, im, viel, etwas, nichts.", "das Schwimmen, beim Lesen, zum Spielen, etwas Schönes, viel Neues.", "Die Anrede «Sie» schreibst du gross, «du» klein."], "examples": ["Beim Schwimmen ist mir kalt.", "Ich wünsche dir viel Glück und alles Gute.", "Etwas Schönes ist passiert."]}, quiz:[["Welche Schreibweise ist richtig?", "Beim Lesen vergesse ich die Zeit.", "Beim lesen vergesse ich die Zeit.", "beim Lesen vergesse ich die zeit."], ["Welche Schreibweise ist richtig?", "Ich wünsche dir viel Spass beim Tanzen.", "Ich wünsche dir viel Spass beim tanzen.", "Ich Wünsche dir viel spass beim Tanzen."], ["Welche Schreibweise ist richtig?", "Das Laufen macht mir Freude.", "Das laufen macht mir Freude.", "Das Laufen macht mir freude."], ["Welche Schreibweise ist richtig?", "Wir laufen schnell.", "Wir Laufen schnell.", "wir laufen Schnell."], ["Welche Schreibweise ist richtig?", "Ich habe etwas Neues gelernt.", "Ich habe etwas neues gelernt.", "Ich habe Etwas neues gelernt."], ["Welches Signalwort zeigt eine Nominalisierung?", "beim", "und", "sehr", "schnell"], ["«zum (spielen)»: Wie schreibst du es?", "zum Spielen", "zum spielen", "Zum spielen"], ["«das (gute)»: Wie schreibst du es?", "das Gute", "das gute", "Das gute"], ["Welches Wort schreibst du gross? «Ich mag das …»", "Singen", "singen", "sing"], ["Welche Schreibweise ist richtig?", "Können Sie mir helfen?", "Können sie mir helfen?", "können Sie mir Helfen?"], ["Welche Schreibweise ist richtig?", "Im Winter fahren wir Ski.", "Im winter fahren wir ski.", "im Winter Fahren wir Ski."], ["Welche Schreibweise ist richtig?", "Lea liest gern.", "Lea Liest gern.", "lea liest Gern."]], write:[["Schreib richtig: beim (schwimmen)", "beim Schwimmen"], ["Schreib richtig: viel (glück)", "viel Glück"], ["Schreib richtig: das (lachen)", "das Lachen"], ["Schreib richtig: etwas (süsses)", "etwas Süsses"]] },
    { id:"sss", no:"Thema 9", title:"s oder ss? Dehnung und Schärfung", de:"Lange und kurze Vokale hören und richtig schreiben", icon:"🐍", lp:"D.5.E.1", learn:{"tips": ["In der Schweiz schreibt man kein ß, sondern immer ss: die Strasse, gross, der Fuss.", "Kurzer Vokal: oft ss oder doppelter Konsonant: die Klasse, das Wasser, der Ball, die Mutter.", "Langer Vokal: einfacher Konsonant, manchmal mit h oder ie: die Nase, der Hase, fahren, das Tier.", "Sprich das Wort langsam und hör genau: kurz oder lang?"], "examples": ["die Tasse (kurz)", "die Rose (lang)", "der Kuss (kurz)", "die Wiese (lang)"]}, quiz:[["Die Stra_e ist nass.", "ss", "s", "ß"], ["Der Ha_e hoppelt.", "s", "ss", "ß"], ["Wir trinken Wa_er.", "ss", "s", "ß"], ["Die Ro_e blüht.", "s", "ss", "ß"], ["Die Kla_e lacht.", "ss", "s", "ß"], ["Die Na_e läuft.", "s", "ss", "ß"], ["Welches Wort ist richtig geschrieben?", "gross", "groß", "gros"], ["Welches Wort ist richtig geschrieben?", "der Fuss", "der Fuß", "der Fus"], ["Kurzer oder langer Vokal bei «Ball»?", "kurz", "lang", "gar keiner"], ["Kurzer oder langer Vokal bei «Tier»?", "lang", "kurz", "gar keiner"], ["Welches Wort hat ein Dehnungs-h?", "fahren", "Faden", "Farbe"], ["Welches Wort hat einen doppelten Konsonanten?", "Mutter", "Mut", "Mus"]], write:[["Schreib richtig: die Stra_e", "die Strasse|Strasse"], ["Schreib richtig: der Ha_e", "der Hase|Hase"], ["Schreib richtig: das Wa_er", "das Wasser|Wasser"], ["Schreib richtig: gro_", "gross"]], sort:{"bins": ["s", "ss"], "items": [["Ha_e", "s"], ["Na_e", "s"], ["Ro_e", "s"], ["Wie_e", "s"], ["Rie_e", "s"], ["le_en", "s"], ["Mu_ik", "s"], ["Stra_e", "ss"], ["Wa_er", "ss"], ["Kla_e", "ss"], ["Ta_e", "ss"], ["Ku_", "ss"], ["me_en", "ss"], ["Fu_", "ss"]]} },
    { id:"dass", no:"Thema 10", title:"das oder dass? Komma vor Nebensätzen", de:"Ersatzprobe und Komma bei dass, weil, wenn", icon:"✍️", lp:"D.5.E.1, D.4.F.1", learn:{"tips": ["Ersatzprobe: Kannst du «das» durch «dieses» oder «welches» ersetzen, schreibst du «das». Sonst «dass».", "Das Buch, das ich lese, ist spannend. (welches) – Ich hoffe, dass du kommst. (nicht ersetzbar)", "Vor dass, weil, wenn, obwohl steht ein Komma: Ich weiss, dass du müde bist."], "examples": ["Das Haus, das dort steht, ist alt.", "Ich freue mich, dass du da bist.", "Ich gehe nicht raus, weil es regnet."]}, quiz:[["Ich hoffe, ___ du kommst.", "dass", "das"], ["___ Velo gehört mir.", "Das", "Dass"], ["Das Bild, ___ an der Wand hängt, ist schön.", "das", "dass"], ["Ich weiss, ___ du recht hast.", "dass", "das"], ["Er sagt, ___ er Hunger hat.", "dass", "das"], ["Siehst du ___ Pferd?", "das", "dass"], ["Es ist schön, ___ du hier bist.", "dass", "das"], ["Das Spiel, ___ wir spielen, ist lustig.", "das", "dass"], ["Wo steht das Komma richtig?", "Ich glaube, dass es regnet.", "Ich glaube dass, es regnet.", "Ich, glaube dass es regnet."], ["Wo steht das Komma richtig?", "Wir bleiben drinnen, weil es stürmt.", "Wir bleiben drinnen weil, es stürmt.", "Wir, bleiben drinnen weil es stürmt."], ["Wo steht das Komma richtig?", "Wenn es schneit, bauen wir einen Schneemann.", "Wenn es schneit bauen, wir einen Schneemann.", "Wenn, es schneit bauen wir einen Schneemann."], ["Welches Wort kann «das» in «Das Buch, das ich lese» ersetzen?", "welches", "dass", "weil"]], write:[["Ich freue mich, ___ du kommst.", "dass"], ["___ Wetter ist schön.", "Das"], ["Ich weiss, ___ es stimmt.", "dass"], ["Das Lied, ___ wir singen, ist neu.", "das"]] },
    { id:"rede", no:"Thema 11", title:"Direkte Rede", de:"Anführungszeichen, Doppelpunkt und Redebegleitsatz", icon:"💬", lp:"D.5.E.1", learn:{"tips": ["Was jemand sagt, steht in Anführungszeichen: «Komm her!»", "Steht der Begleitsatz vorne, folgt ein Doppelpunkt: Mia ruft: «Komm her!»", "Steht der Begleitsatz hinten, folgt ein Komma: «Komm her», ruft Mia.", "Fragezeichen und Ausrufezeichen bleiben in den Anführungszeichen: «Kommst du?», fragt Tim."], "examples": ["Lea sagt: «Ich habe Hunger.»", "«Ich habe Hunger», sagt Lea.", "«Wo bist du?», fragt Papa."]}, quiz:[["Welche Schreibweise ist richtig?", "Tim sagt: «Ich komme mit.»", "Tim sagt, «Ich komme mit.»", "Tim sagt «Ich komme mit»."], ["Welche Schreibweise ist richtig?", "«Ich komme mit», sagt Tim.", "«Ich komme mit.» sagt Tim.", "«Ich komme mit»: sagt Tim."], ["Welche Schreibweise ist richtig?", "«Kommst du?», fragt Mia.", "«Kommst du», fragt Mia?", "«Kommst du?» fragt Mia."], ["Welches Zeichen folgt, wenn der Begleitsatz vorne steht?", "ein Doppelpunkt", "ein Komma", "ein Punkt"], ["Welches Zeichen folgt nach der Rede, wenn der Begleitsatz hinten steht?", "ein Komma", "ein Doppelpunkt", "ein Strichpunkt"], ["Was ist der Begleitsatz in «Mama ruft: «Essen ist fertig!»»?", "Mama ruft", "Essen ist fertig", "ruft: Essen"], ["Welches Verb passt als Begleitverb für eine Frage?", "fragen", "antworten", "rufen"], ["Welche Schreibweise ist richtig?", "Oma fragt: «Hast du Hunger?»", "Oma fragt, «Hast du Hunger?»", "Oma fragt: «Hast du Hunger»?"], ["Welche Anführungszeichen benutzt man in der Schweiz?", "« »", "„ “", "\" \" nur"], ["Welche Schreibweise ist richtig?", "«Pass auf!», ruft der Lehrer.", "«Pass auf», ruft der Lehrer!", "«Pass auf!» ruft der Lehrer."], ["Welches Wort ist ein Redebegleitverb?", "flüstern", "laufen", "essen"], ["Was steht in Anführungszeichen?", "das, was jemand sagt", "der Name", "der Begleitsatz"]], write:[["Welches Zeichen fehlt? Lea sagt___ «Hallo!» (Name des Zeichens)", "Doppelpunkt"], ["«Ich bin müde»___ sagt Tim. Welches Zeichen fehlt? (Name)", "Komma"], ["Wie heisst das Satzzeichen « »?", "Anführungszeichen"], ["Welches Verb passt? «Kommst du?», ___ Mia.", "fragt"]] },
    { id:"texte", no:"Thema 12", title:"Textsorten und Lesen", de:"Märchen, Fabel, Sage, Gedicht und Sachtext erkennen", icon:"📚", lp:"D.6.A.1, D.6.C.1, D.2.B.1", learn:{"tips": ["Märchen: beginnt oft mit «Es war einmal», Zauber, Gut und Böse, gutes Ende.", "Fabel: Tiere sprechen und handeln wie Menschen, am Schluss gibt es eine Lehre.", "Sage: spielt an einem echten Ort, hat einen wahren Kern, aber vieles ist erfunden (z.B. Gallus und der Bär).", "Gedicht: Verse, Strophen, oft Reime. Sachtext: informiert über Tatsachen."], "examples": ["Rotkäppchen (Märchen)", "Der Fuchs und der Rabe (Fabel)", "Wilhelm Tell (Sage)"]}, quiz:[["In welcher Textsorte sprechen Tiere und es gibt am Schluss eine Lehre?", "Fabel", "Märchen", "Sachtext", "Gedicht"], ["Welche Textsorte beginnt oft mit «Es war einmal»?", "Märchen", "Fabel", "Sage", "Sachtext"], ["Welche Textsorte spielt an einem echten Ort und hat einen wahren Kern?", "Sage", "Märchen", "Gedicht", "Fabel"], ["Was ist eine Strophe?", "ein Abschnitt in einem Gedicht", "ein Satzzeichen", "eine Figur in einer Geschichte", "ein Buchtitel"], ["Welcher Text informiert über Tatsachen?", "Sachtext", "Märchen", "Fabel", "Gedicht"], ["Welche Wörter reimen sich?", "Haus – Maus", "Hund – Katze", "Baum – Blatt", "Tisch – Stuhl"], ["Wie heisst die wichtigste Person einer Geschichte?", "Hauptfigur", "Nebenfigur", "Erzählerin", "Autorin"], ["Wer schreibt ein Buch?", "die Autorin oder der Autor", "der Verlag", "die Leserin", "die Buchhandlung"], ["«Gallus und der Bär» ist eine …", "Sage", "Fabel", "Sachtext", "Gedicht"], ["Was hilft beim Lesen eines Sachtexts?", "Überschriften und Bilder anschauen", "nur das Ende lesen", "schnell überfliegen ohne Denken", "die Wörter zählen"], ["Was ist eine Lehre in einer Fabel?", "ein Ratschlag, was man daraus lernt", "ein Lehrer", "eine Prüfung", "ein Reim"], ["Wo findest du, worum es in einem Buch geht?", "im Klappentext auf der Rückseite", "im Inhaltsverzeichnis der Zeitung", "im Impressum", "auf dem Strichcode"]], write:[["Textsorte mit sprechenden Tieren und einer Lehre:", "Fabel"], ["Textsorte mit «Es war einmal»:", "Märchen"], ["Ein Abschnitt in einem Gedicht heisst …", "Strophe"], ["Wilhelm Tell ist eine …", "Sage"]], sort:{"bins": ["Märchen", "Fabel", "Sage"], "items": [["Rotkäppchen", "Märchen"], ["Hänsel und Gretel", "Märchen"], ["Schneewittchen", "Märchen"], ["Aschenputtel", "Märchen"], ["Der Fuchs und der Rabe", "Fabel"], ["Die Grille und die Ameise", "Fabel"], ["Der Hase und die Schildkröte", "Fabel"], ["Der Löwe und die Maus", "Fabel"], ["Wilhelm Tell", "Sage"], ["Gallus und der Bär", "Sage"], ["Die Teufelsbrücke", "Sage"], ["Der Rattenfänger von Hameln", "Sage"]]} }
  ]}]},
  { grade:6, books:[ { id:'de6', name:'Lehrplan 21', units:[
    { id:"wortart", no:"Thema 1", title:"Wortarten-Training", de:"Nomen, Verb, Adjektiv, Pronomen und Partikeln", icon:"🏷️", gen:"wortart5", lp:"D.5.D.1", learn:{"tips": ["Nomen (Begleiter-Probe), Verb (Personalform), Adjektiv (steigerbar, «sehr …»).", "Pronomen stehen für ein Nomen oder begleiten es: er, sie, wir, mein, dein.", "Partikeln verändern sich nie: auf, und, sehr, heute, weil."], "examples": ["Mein (Pronomen) Bruder (Nomen) rennt (Verb) schnell (Adjektiv)."]} },
    { id:"zeit", no:"Thema 2", title:"Zeitformen sicher bilden", de:"Präsens, Präteritum, Perfekt, auch unregelmässige Verben", icon:"⏳", gen:"zeit5", lp:"D.5.D.1", learn:{"tips": ["Präsens, Präteritum und Perfekt bildest du sicher, auch bei unregelmässigen Verben: gehen – ging – ist gegangen.", "Zum Entdecken: Futur (Ich werde morgen kommen.) und Plusquamperfekt (Ich war schon gegangen, als …)."], "examples": ["singen – sang – hat gesungen", "bringen – brachte – hat gebracht"]} },
    { id:"satz", no:"Thema 3", title:"Sätze bauen", de:"Verschiebeprobe, Satzglieder und Verbenfächer", icon:"🧱", gen:"satzgl", lp:"D.5.D.1", learn:{"tips": ["Mit der Verschiebeprobe findest du die Satzglieder: Wörter, die zusammen bleiben, sind ein Satzglied.", "Das Verb (Personalform) steht im Aussagesatz an zweiter Stelle.", "Präpositionalgruppe: Sie beginnt mit einer Präposition: auf dem Tisch, nach der Schule."], "examples": ["Am Morgen | trinkt | Lea | einen Tee.", "Lea | trinkt | am Morgen | einen Tee."]} },
    { id:"wbild", no:"Thema 4", title:"Wortbildung und Morpheme", de:"Vorsilben, Nachsilben und Nomen-Signale", icon:"🧩", lp:"D.5.D.1, D.5.E.1", learn:{"tips": ["Wörter bestehen aus Bausteinen: Vorsilbe + Stamm + Nachsilbe: un-glück-lich, Ent-deck-ung.", "Nachsilben -heit, -keit, -ung, -nis, -schaft machen ein Wort zum Nomen. Dann schreibt man es gross.", "Vorsilben verändern die Bedeutung: fahren → abfahren, verfahren, erfahren."], "examples": ["frei → die Freiheit", "heiter → die Heiterkeit", "entdecken → die Entdeckung"]}, quiz:[["Welche Nachsilbe macht aus «frei» ein Nomen?", "-heit", "-lich", "-en", "-ig"], ["Welche Nachsilbe macht aus «übe(n)» ein Nomen?", "-ung", "-lich", "-bar", "-isch"], ["Welches Wort ist ein Nomen?", "die Freundlichkeit", "freundlich", "befreunden", "freundlicher"], ["Zerlege «unglücklich»:", "un + glück + lich", "ung + lück + lich", "unglü + cklich", "un + glücklich + -"], ["Welche Vorsilbe macht das Gegenteil von «ehrlich»?", "un-", "ver-", "be-", "ge-"], ["Welches Wort hat die Vorsilbe «ver»?", "verlaufen", "Vogel", "vier", "voll"], ["Aus «gesund» wird ein Nomen:", "die Gesundheit", "die Gesundung", "das Gesundsein", "die Gesundkeit"], ["Aus «erleben» wird ein Nomen:", "das Erlebnis", "die Erlebheit", "die Erlebkeit", "das Erlebung"], ["Welches Wort ist KEIN Nomen?", "heiter", "die Heiterkeit", "die Wahrheit", "die Prüfung"], ["«Die Schönheit» – was ist der Stamm?", "schön", "heit", "die", "schönh"], ["Was bedeutet «unmöglich»?", "nicht möglich", "sehr möglich", "möglich gemacht", "fast möglich"], ["Welches Wort passt zur Nachsilbe -schaft?", "Freundschaft", "Freundheit", "Freundung", "Freundkeit"]], write:[["Mach ein Nomen aus «krank»: die …", "Krankheit"], ["Mach ein Nomen aus «sauber»: die …", "Sauberkeit"], ["Mach ein Nomen aus «wohnen»: die …", "Wohnung"], ["Gegenteil mit Vorsilbe: «bekannt» → …", "unbekannt"]] },
    { id:"doppel", no:"Thema 5", title:"Doppelkonsonanten und Stammregel", de:"Kurze Vokale, ck/tz und verwandte Wörter", icon:"🔠", lp:"D.5.E.1", learn:{"tips": ["Nach einem kurzen, betonten Vokal folgt oft ein doppelter Konsonant: Ball, kommen, Mutter.", "Statt kk schreibt man ck, statt zz schreibt man tz: backen, Katze.", "Stammregel: Der Stamm bleibt gleich: kommen – er kommt (nicht: komt).", "Ausnahmen merken: bis, das, was, mit, hat, ob."], "examples": ["schwimmen – er schwimmt", "die Stelle – stellen", "rennen – er rennt"]}, quiz:[["Welches Wort ist richtig?", "er kommt", "er komt", "er kommmt", "er kohmt"], ["Welches Wort ist richtig?", "schwimmen", "schwiemen", "schwimen", "schwimmenn"], ["Welches Wort ist richtig?", "die Mutter", "die Muter", "die Mutta", "die Muhter"], ["Welches Wort ist richtig?", "er rennt", "er rent", "er rennnt", "er rehnt"], ["Welches Wort ist richtig?", "die Blätter", "die Bläter", "die Bletter", "die Blätta"], ["Welches Wort ist richtig?", "plötzlich", "plözlich", "plötslich", "plötzzlich"], ["Welches Wort ist richtig?", "die Stelle", "die Stele", "die Stäle", "die Stellle"], ["Welches Wort ist eine Ausnahme mit nur einem s am Schluss?", "bis", "Fluss", "Kuss", "Pass"], ["Welches Wort ist richtig?", "er hofft", "er hoft", "er hoffd", "er hoffft"], ["Warum schreibt man «er knallt» mit ll?", "Stammregel: knallen", "Es klingt so.", "Ausnahme", "Das ist ein Nomen."], ["Welches Wort ist richtig?", "der Zucker", "der Zukker", "der Zuker", "der Zuccer"], ["Welches Wort ist richtig?", "die Pfütze", "die Pfüze", "die Pfüzze", "die Pfütse"]], write:[["Schreib richtig: er schwi_t (schwimmen)", "schwimmt"], ["Schreib richtig: die Ta_e (Tasse)", "Tasse"], ["Schreib richtig: er ka_n (können)", "kann"], ["Schreib richtig: die Hi_e (tz)", "Hitze"]] },
    { id:"gross", no:"Thema 6", title:"Gross oder klein?", de:"Konkrete und abstrakte Nomen, Nomen-Signale", icon:"🔡", lp:"D.5.E.1", learn:{"tips": ["Nomen schreibt man gross, auch wenn man sie nicht anfassen kann: die Angst, die Freude, das Glück, die Wut.", "Nomen-Signale: Begleiter (der, ein, kein, mein), Nachsilben -heit, -keit, -ung.", "Verben werden zu Nomen mit Begleiter: das Lesen, beim Schwimmen."], "examples": ["Ich habe Angst.", "Beim Rennen fiel er hin.", "Viel Glück!"]}, quiz:[["Welches Wort schreibt man gross? Ich habe grosse _ngst.", "Angst", "angst (klein)", "beides", "keines"], ["Welcher Satz ist richtig?", "Wir wünschen dir viel Glück.", "Wir wünschen dir viel glück.", "wir wünschen dir viel Glück.", "Wir Wünschen dir viel Glück."], ["Welcher Satz ist richtig?", "Beim Schwimmen ist mir kalt.", "Beim schwimmen ist mir kalt.", "beim Schwimmen ist mir kalt.", "Beim Schwimmen ist mir Kalt."], ["Welches Wort ist ein abstraktes Nomen?", "die Freude", "der Tisch", "die Katze", "das Velo"], ["Welcher Satz ist richtig?", "Sie platzte fast vor Wut.", "Sie platzte fast vor wut.", "Sie Platzte fast vor Wut.", "sie platzte fast vor wut."], ["Welches Wort ist hier ein Nomen? «Das Lesen macht Spass.»", "Lesen", "macht", "Das", "Spass (Verb)"], ["Welches Wort schreibt man klein?", "schnell", "Schnelligkeit", "Schnelle (das Schnelle)", "Schnellzug"], ["Welcher Satz ist richtig?", "Die Prüfung war leicht.", "Die prüfung war leicht.", "die Prüfung war Leicht.", "Die Prüfung war Leicht."], ["Welches Signal zeigt ein Nomen?", "ein Begleiter davor", "ein Komma", "eine Endung -lich", "das Verb danach"], ["Welcher Satz ist richtig?", "Mit viel Mut sprang er.", "Mit viel mut sprang er.", "Mit Viel Mut sprang er.", "mit viel Mut Sprang er."], ["Welches Wort ist ein Nomen?", "die Wahrheit", "wahr", "wahrscheinlich", "bewahren"], ["Welcher Satz ist richtig?", "Ich freue mich aufs Wandern.", "Ich freue mich aufs wandern.", "ich freue mich aufs Wandern.", "Ich Freue mich aufs Wandern."]], write:[["Schreib das Nomen zu «frei»:", "Freiheit"], ["Setze ein: Wir haben grosse ___ (freuen, als Nomen).", "Freude"], ["Ergänze gross oder klein: viel ___ (glück)", "Glück"], ["Ergänze: beim ___ (lesen, als Nomen)", "Lesen"]] },
    { id:"trennen", no:"Thema 7", title:"Silbentrennung", de:"Wörter richtig trennen", icon:"✂️", lp:"D.5.E.1", learn:{"tips": ["Man trennt nach Sprechsilben: Ta-fel, Fens-ter, Schu-le.", "Steht ein Konsonant zwischen Vokalen, kommt er auf die neue Zeile: Ho-se.", "Bei mehreren Konsonanten kommt nur der letzte auf die neue Zeile: Fens-ter, Kat-ze.", "ck und ch, sch bleiben zusammen: Zu-cker, ma-chen, wa-schen. Einzelne Vokale trennt man nicht ab: Abend, nicht A-bend."], "examples": ["Kin-der", "Bä-cker", "Mor-gen", "Ta-sche"]}, quiz:[["Wie trennt man «Fenster»?", "Fens-ter", "Fen-ster", "Fe-nster", "Fenst-er"], ["Wie trennt man «Zucker»?", "Zu-cker", "Zuc-ker", "Zuck-er", "Z-ucker"], ["Wie trennt man «Katze»?", "Kat-ze", "Ka-tze", "Katz-e", "K-atze"], ["Wie trennt man «machen»?", "ma-chen", "mac-hen", "mach-en", "m-achen"], ["Wie trennt man «Schule»?", "Schu-le", "Sch-ule", "Schul-e", "Sc-hule"], ["Wie trennt man «Garten»?", "Gar-ten", "Ga-rten", "Gart-en", "G-arten"], ["Welches Wort darf man NICHT trennen?", "Abend (A-bend)", "Mon-tag", "Tan-te", "Wol-ke"], ["Wie trennt man «Tasche»?", "Ta-sche", "Tas-che", "Tasch-e", "T-asche"], ["Wie trennt man «Butter»?", "But-ter", "Bu-tter", "Butt-er", "B-utter"], ["Wie trennt man «Lehrerin»?", "Leh-re-rin", "Le-hrer-in", "Lehr-er-in", "Le-hre-rin"], ["Wie viele Silben hat «Schokolade»?", "4", "3", "5", "2"], ["Wie trennt man «Pflanze»?", "Pflan-ze", "Pfla-nze", "Pf-lanze", "Pflanz-e"]] },
    { id:"komma", no:"Thema 8", title:"Kommaregeln", de:"Aufzählungen, Verbgruppen und direkte Rede", icon:"❗", lp:"D.5.E.1", learn:{"tips": ["Aufzählungen: Komma zwischen den Teilen, aber nicht vor «und» und «oder».", "Zwischen zwei Teilsätzen mit eigenem Verb steht ein Komma: Ich lese, weil ich Zeit habe.", "Direkte Rede: «Komm mit», sagt Lea. Lea sagt: «Komm mit!»"], "examples": ["Ich kaufe Brot, Käse und Milch.", "Er kommt, wenn er Zeit hat.", "«Ich bin da», ruft Tim."]}, quiz:[["Welcher Satz ist richtig?", "Ich bleibe zu Hause, weil ich krank bin.", "Ich bleibe zu Hause weil ich krank bin.", "Ich bleibe, zu Hause weil ich krank bin.", "Ich bleibe zu Hause weil, ich krank bin."], ["Welcher Satz ist richtig?", "Wir spielen Fussball, Tennis und Unihockey.", "Wir spielen Fussball, Tennis, und Unihockey.", "Wir spielen Fussball Tennis und Unihockey.", "Wir spielen, Fussball, Tennis und Unihockey."], ["Welcher Satz ist richtig?", "«Ich komme gleich», sagt Mia.", "«Ich komme gleich» sagt Mia.", "«Ich komme gleich», sagt Mia».", "Ich komme gleich, sagt Mia."], ["Welcher Satz ist richtig?", "Als es dunkel wurde, gingen wir heim.", "Als es dunkel wurde gingen wir heim.", "Als, es dunkel wurde gingen wir heim.", "Als es dunkel, wurde gingen wir heim."], ["Steht hier ein Komma? «Ich weiss_ dass du recht hast.»", "ja", "nein", "nur in der Schweiz", "nur bei Fragen"], ["Steht hier ein Komma? «Willst du Tee_ oder Saft?»", "nein", "ja", "zwei Kommas", "ein Punkt"], ["Welcher Satz ist richtig?", "Er lachte, sprang auf und rannte weg.", "Er lachte sprang auf und rannte weg.", "Er lachte, sprang auf, und rannte weg.", "Er, lachte sprang auf und rannte weg."], ["Welcher Satz ist richtig?", "Lea fragt: «Kommst du mit?»", "Lea fragt «Kommst du mit?»", "Lea fragt: Kommst du mit?", "Lea fragt, «Kommst du mit»?"], ["Wo fehlt ein Komma? «Obwohl es regnet_ gehen wir raus.»", "nach «regnet»", "nach «Obwohl»", "nach «gehen»", "nirgends"], ["Wo fehlt ein Komma? «Ich hoffe_ dass du kommst.»", "nach «hoffe»", "nach «dass»", "nach «du»", "nirgends"], ["Welcher Satz braucht KEIN Komma?", "Ich esse Brot und trinke Milch.", "Ich esse Brot weil ich Hunger habe.", "Wenn es schneit gehen wir schlitteln.", "Ich glaube dass er kommt."], ["Welcher Satz ist richtig?", "Der Hund, der bellt, heisst Rex.", "Der Hund der bellt heisst Rex.", "Der Hund, der bellt heisst Rex.", "Der Hund der bellt, heisst Rex."]] },
    { id:"lesen", no:"Thema 9", title:"Sachtexte verstehen", de:"Informationen finden, Tabellen und Grafiken lesen", icon:"📰", lp:"D.2.B.1, D.2.C.1", learn:{"tips": ["Überfliege zuerst den Text: Titel, Zwischentitel, Bilder, Tabellen.", "Such gezielt nach Schlüsselwörtern aus der Frage.", "Unterscheide: Was steht im Text? Was ist meine Meinung?"], "examples": ["Wer, was, wann, wo, wie, warum?"]}, quiz:[["«Der Bodensee ist 63 km lang und grenzt an Deutschland, Österreich und die Schweiz.» Wie lang ist der Bodensee?", "63 km", "36 km", "630 km", "6 km"], ["«Der Bodensee ist 63 km lang und grenzt an Deutschland, Österreich und die Schweiz.» An wie viele Länder grenzt er?", "3", "2", "4", "5"], ["«Bienen besuchen an einem Tag bis zu 3000 Blüten. Ohne Bienen gäbe es viel weniger Früchte.» Warum sind Bienen wichtig?", "Sie bestäuben Blüten.", "Sie fressen Früchte.", "Sie stechen.", "Sie bauen Häuser."], ["Tabelle: Montag 12 °C, Dienstag 15 °C, Mittwoch 9 °C. Wann war es am wärmsten?", "Dienstag", "Montag", "Mittwoch", "am Wochenende"], ["Tabelle: Montag 12 °C, Dienstag 15 °C, Mittwoch 9 °C. Um wie viel Grad wurde es von Dienstag auf Mittwoch kälter?", "6 °C", "3 °C", "9 °C", "15 °C"], ["«Der Säntis ist mit 2502 m der höchste Berg im Alpstein.» Was ist eine Tatsache?", "Der Säntis ist 2502 m hoch.", "Der Säntis ist der schönste Berg.", "Wandern ist langweilig.", "Der Säntis ist zu steil."], ["Welcher Satz ist eine Meinung?", "Fussball ist das beste Spiel.", "Ein Fussballspiel dauert 90 Minuten.", "Ein Team hat 11 Spieler.", "Der Ball ist rund."], ["Wozu dient ein Zwischentitel?", "Er zeigt, worum es im nächsten Abschnitt geht.", "Er ist nur Dekoration.", "Er nennt die Autorin.", "Er ersetzt den Text."], ["«Wegen des Sturms fiel der Zug aus.» Warum fiel der Zug aus?", "wegen des Sturms", "wegen Bauarbeiten", "wegen Schnee", "Das steht nicht da."], ["Wo findest du schnell, wer einen Text geschrieben hat?", "beim Namen unter dem Titel oder am Schluss", "in der Mitte", "bei de     { id:"fehler", no:"Thema 10", title:"Texte überarbeiten", de:"Fehler finden und Sätze verbessern", icon:"🔍", lp:"D.4.E.1, D.5.E.1", learn:{"tips": ["Lies deinen Text laut. Klingt etwas komisch, prüf den Satz.", "Achte auf Gross- und Kleinschreibung, Satzzeichen und Wiederholungen.", "Ersetze Wiederholungen: «und dann, und dann» → danach, später, schliesslich."], "examples": ["Danach gingen wir heim.", "Plötzlich hörten wir ein Geräusch."]}, quiz:[["Wo ist der Fehler? «Am morgen ging ich zur Schule.»", "morgen → Morgen", "ging → gieng", "Schule → schule", "kein Fehler"], ["Wo ist der Fehler? «Ich habe einen grossen hund.»", "hund → Hund", "grossen → Grossen", "habe → hab", "kein Fehler"], ["Wo ist der Fehler? «Er komt morgen.»", "komt → kommt", "Er → er", "morgen → Morgen", "kein Fehler"], ["Wo ist der Fehler? «Wir spielten fussball.»", "fussball → Fussball", "spielten → spilten", "Wir → wir", "kein Fehler"], ["Welches Wort ersetzt «und dann» am besten?", "danach", "und", "aber", "weil"], ["Welcher Satz ist besser?", "Plötzlich knallte es laut.", "Dann war es laut und dann knallte es.", "Es war laut. Es knallte. Es war laut.", "Laut knallte und dann es."], ["Wo ist der Fehler? «Lea fragt: Kommst du?»", "Anführungszeichen fehlen", "fragt → Fragt", "du → Du", "kein Fehler"], ["Wo ist der Fehler? «Die Kinder spielt im Garten.»", "spielt → spielen", "Kinder → Kinds", "Garten → garten", "kein Fehler"], ["Wo ist der Fehler? «Wir sind gestern ins Kino gegeht.»", "gegeht → gegangen", "sind → haben", "Kino → kino", "kein Fehler"], ["Wo ist der Fehler? «Ich freue mich auf die Ferien»", "Punkt fehlt am Schluss", "Ferien → ferien", "freue → Freue", "kein Fehler"], ["Wo ist der Fehler? «Weil es regnete blieben wir drinnen.»", "Komma nach «regnete»", "regnete → regnet", "drinnen → Drinnen", "kein Fehler"], ["Welches Wort passt besser als «gut» in «Das Essen war gut»?", "lecker", "gross", "schnell", "laut"]] }

    { id:"wohnort", no:"Thema 1", title:"Mein Wohnort", de:"Schulweg, Plan lesen und Himmelsrichtungen", icon:"🏘️", lp:"NMG.8.1, NMG.8.3, NMG.8.5", learn:{"tips": ["Ein Plan zeigt einen Ort von oben, viel kleiner als in Wirklichkeit.", "Die Legende erklärt, was die Zeichen auf dem Plan bedeuten.", "Himmelsrichtungen: Norden (oben auf der Karte), Süden, Osten (Sonnenaufgang), Westen (Sonnenuntergang).", "Eine Gemeinde hat einen Namen, eine Schule, eine Verwaltung und einen Gemeindepräsidenten oder eine Gemeindepräsidentin."], "examples": ["N oben, S unten", "Sonnenaufgang im Osten"]}, quiz:[["Wo geht die Sonne auf?", "im Osten", "im Westen", "im Norden", "im Süden"], ["Wo geht die Sonne unter?", "im Westen", "im Osten", "im Norden", "im Süden"], ["Was ist auf einer Karte meistens oben?", "Norden", "Süden", "Osten", "Westen"], ["Was erklärt die Legende eines Plans?", "was die Zeichen bedeuten", "wer den Plan gemacht hat", "wie alt die Stadt ist", "das Wetter"], ["Ein Plan zeigt einen Ort …", "von oben", "von der Seite", "von unten", "von innen"], ["Was gibt es in jeder Gemeinde?", "eine Gemeindeverwaltung", "einen Flughafen", "einen Zoo", "ein Spital"], ["Wer leitet eine Gemeinde?", "der Gemeindepräsident oder die Gemeindepräsidentin", "der Lehrer", "der Bäcker", "die Polizei"], ["Was ist sicher auf dem Schulweg?", "auf dem Trottoir gehen", "auf der Strasse rennen", "zwischen Autos hervorspringen", "bei Rot gehen"], ["Wie viele Haupthimmelsrichtungen gibt es?", "4", "2", "3", "8"], ["Was liegt gegenüber von Norden?", "Süden", "Osten", "Westen", "oben"], ["Was zeigt ein Kompass an?", "die Himmelsrichtung", "die Zeit", "das Wetter", "die Höhe"], ["Was bedeutet ein blauer Strich auf dem Plan meistens?", "ein Bach oder Fluss", "eine Strasse", "ein Wald", "eine Grenze"]], write:[["Himmelsrichtung, wo die Sonne aufgeht:", "Osten"], ["Himmelsrichtung oben auf der Karte:", "Norden"], ["Wie heisst die Erklärung der Zeichen auf einem Plan?", "Legende"]] },

    { id:"kloster", no:"Thema 5", title:"Kloster und Stadt im Mittelalter", de:"Kloster St.Gallen, Handwerk, Markt und Zünfte", icon:"⛪", lp:"NMG.9.2, NMG.9.3", learn:{"tips": ["Im Jahr 612 kam der Mönch Gallus ins Steinachtal. 719 gründete Otmar dort ein Kloster.", "Im Kloster wurde gebetet, gearbeitet und geschrieben. Mönche schrieben Bücher von Hand ab. Viele davon liegen heute in der Stiftsbibliothek.", "Der Stiftsbezirk St.Gallen gehört seit 1983 zum UNESCO-Welterbe.", "Mittelalterliche Städte hatten eine Stadtmauer, Tore, einen Markt und Handwerker. Handwerker schlossen sich in Zünften zusammen.", "St.Gallen wurde mit Leinwand (Stoff aus Flachs) bekannt."], "examples": ["612: Gallus", "719: Klostergründung durch Otmar", "1983: UNESCO-Welterbe", "Leinwand aus St.Gallen"]}, quiz:[["Wer gründete 719 das Kloster St.Gallen?", "Otmar", "Gallus", "Karl der Grosse", "Wilhelm Tell"], ["Wann kam Gallus ins Steinachtal?", "612", "1291", "1803", "1500"], ["Was machten Mönche im Kloster unter anderem?", "Bücher von Hand abschreiben", "Autos bauen", "Zeitungen drucken", "Ritterturniere veranstalten"], ["Wie heisst die berühmte Bibliothek in St.Gallen?", "Stiftsbibliothek", "Nationalbibliothek", "Stadtbibliothek Bern", "Klosterkino"], ["Seit wann ist der Stiftsbezirk UNESCO-Welterbe?", "1983", "1291", "2010", "1848"], ["Was ist eine Zunft?", "ein Zusammenschluss von Handwerkern", "ein Turm", "ein Gebet", "eine Burg"], ["Wozu hatten Städte eine Stadtmauer?", "zum Schutz", "als Schmuck", "für Werbung", "zum Klettern"], ["Womit wurde St.Gallen im Mittelalter bekannt?", "mit Leinwand (Stoff)", "mit Uhren", "mit Schokolade", "mit Autos"], ["Woraus macht man Leinwand?", "aus Flachs", "aus Plastik", "aus Gold", "aus Holz"], ["Was gab es auf dem Markt?", "Waren zum Tauschen und Kaufen", "nur Bücher", "Autos", "Computer"], ["Wer schrieb im Kloster?", "Mönche", "Bauern", "Ritter", "Kinder der Stadt"], ["Welcher Satz über Gallus stimmt?", "Er war ein Mönch aus Irland.", "Er war ein König.", "Er war ein Ritter aus Bern.", "Er baute die Stadtmauer."]], write:[["Gründer des Klosters St.Gallen (719):", "Otmar"], ["Berühmte Bibliothek im Stiftsbezirk:", "Stiftsbibliothek|die Stiftsbibliothek"], ["Zusammenschluss von Handwerkern:", "Zunft|die Zunft"], ["Stoff, mit dem St.Gallen bekannt wurde:", "Leinwand|die Leinwand"]] },
    { id:"eidgen", no:"Thema 6", title:"Entstehung der Eidgenossenschaft", de:"Bundesbrief, Sagen und Geschichte", icon:"📜", lp:"NMG.9.3, NMG.9.4", learn:{"tips": ["1291 schlossen Uri, Schwyz und Unterwalden einen Bund. Der Bundesbrief liegt heute im Bundesbriefmuseum in Schwyz.", "Die Geschichte von Wilhelm Tell und dem Rütlischwur sind Sagen. Sie erzählen von Freiheit, sind aber nicht sicher belegt.", "Belegt sind zum Beispiel die Schlachten am Morgarten (1315) und bei Sempach (1386) gegen die Habsburger.", "Der Name «Schweiz» kommt vom Kanton Schwyz. Der 1. August ist der Nationalfeiertag."], "examples": ["1291: Bundesbrief", "Uri, Schwyz, Unterwalden", "1315: Morgarten"]}, quiz:[["Welche Orte schlossen 1291 einen Bund?", "Uri, Schwyz und Unterwalden", "Zürich, Bern und Luzern", "Genf, Waadt und Wallis", "St.Gallen, Thurgau und Appenzell"], ["Wo liegt der Bundesbrief heute?", "in Schwyz", "in Bern", "in Zürich", "in Genf"], ["Wilhelm Tell ist …", "eine Sagenfigur", "ein Bundesrat", "ein Ritter aus St.Gallen", "ein Mönch"], ["Gegen wen kämpften die Eidgenossen am Morgarten?", "die Habsburger", "die Römer", "die Franzosen", "die Appenzeller"], ["Wann war die Schlacht am Morgarten?", "1315", "1291", "1515", "1803"], ["Woher kommt der Name «Schweiz»?", "vom Kanton Schwyz", "vom Wort «Schweiss»", "vom Fluss Schweizach", "von einem König"], ["Wann ist der Nationalfeiertag?", "am 1. August", "am 1. Mai", "am 25. Dezember", "am 1. Januar"], ["Auf welcher Wiese soll der Rütlischwur stattgefunden haben?", "Rütli", "Morgarten", "Sempach", "Säntis"], ["Wen soll Wilhelm Tell mit der Armbrust besiegt haben?", "den Vogt Gessler", "Karl den Grossen", "Napoleon", "Gallus"], ["Was ist ein Unterschied zwischen Sage und Geschichte?", "Geschichte ist mit Quellen belegt.", "Sagen sind immer wahr.", "Geschichte ist erfunden.", "Es gibt keinen Unterschied."], ["Wann war die Schlacht bei Sempach?", "1386", "1291", "1415", "1648"], ["Welches Dokument gilt als «Gründungsurkunde»?", "der Bundesbrief", "die Bibel", "der Klosterplan", "das Rütlilied"]], write:[["Jahr des Bundesbriefs:", "1291"], ["Sagenheld mit der Armbrust:", "Wilhelm Tell|Tell"], ["Nationalfeiertag der Schweiz: der 1. …", "August"], ["Der Name Schweiz kommt vom Kanton …", "Schwyz"]], sort:{"bins": ["Sage", "belegte Geschichte"], "items": [["Tells Apfelschuss", "Sage"], ["Der Rütlischwur", "Sage"], ["Tell besiegt Gessler", "Sage"], ["Die Teufelsbrücke", "Sage"], ["Der Bundesbrief von 1291", "belegte Geschichte"], ["Schlacht am Morgarten 1315", "belegte Geschichte"], ["Schlacht bei Sempach 1386", "belegte Geschichte"], ["St.Gallen wird 1803 Kanton", "belegte Geschichte"]]} },
    { id:"pubertaet", no:"Thema 7", title:"Körper und Pubertät", de:"Wachsen, sich verändern und gut für sich sorgen", icon:"🌱", lp:"NMG.1.2, NMG.1.6", learn:{"tips": ["In der Pubertät wird der Körper erwachsen. Sie beginnt bei allen zu einer anderen Zeit, oft zwischen 9 und 14 Jahren.", "Hormone (Botenstoffe im Körper) steuern die Veränderungen: Man wächst schneller, Haare wachsen unter den Achseln und im Intimbereich.", "Bei Mädchen wachsen die Brüste und die Menstruation (Periode) beginnt. Bei Jungen wird die Stimme tiefer (Stimmbruch).", "Man schwitzt mehr: Tägliches Waschen und Deo helfen. Auch Gefühle können stärker schwanken. Das ist normal.", "Fragen darf man immer stellen: den Eltern, einer Lehrperson oder in der Schulsozialarbeit."], "examples": ["Hormone steuern die Pubertät", "Stimmbruch bei Jungen", "Periode bei Mädchen", "Jede und jeder hat ein eigenes Tempo"]}, quiz:[["Was steuert die Veränderungen in der Pubertät?", "Hormone", "Vitamine", "Muskeln", "Knochen"], ["Wann beginnt die Pubertät?", "bei allen zu einer anderen Zeit", "immer genau mit 10 Jahren", "erst mit 18", "nie"], ["Was passiert bei Jungen in der Pubertät?", "Die Stimme wird tiefer.", "Die Zähne fallen aus.", "Sie werden kleiner.", "Die Haare werden weiss."], ["Was beginnt bei Mädchen in der Pubertät?", "die Menstruation (Periode)", "der Stimmbruch", "das Milchzahnwechseln", "der Bartwuchs"], ["Was hilft gegen Schweissgeruch?", "täglich waschen und frische Kleider", "weniger trinken", "nicht mehr Sport machen", "nie duschen"], ["Was ist in der Pubertät normal?", "Gefühle können stärker schwanken.", "Man muss immer fröhlich sein.", "Man darf keine Fragen stellen.", "Alle verändern sich gleich schnell."], ["Wen kannst du bei Fragen zur Pubertät fragen?", "Eltern oder eine Lehrperson", "niemanden", "nur Fremde im Internet", "nur Gleichaltrige"], ["Was wächst in der Pubertät unter den Achseln?", "Haare", "Federn", "Schuppen", "nichts"], ["Was bedeutet «Körpergrenzen respektieren»?", "Niemand darf dich ohne dein Einverständnis berühren.", "Man darf alle umarmen.", "Grenzen gibt es nur in Ländern.", "Man muss alles zeigen."], ["Wie oft sollte man in der Pubertät duschen oder sich waschen?", "täglich", "einmal im Monat", "nie", "nur im Sommer"]], write:[["Botenstoffe, die die Pubertät steuern:", "Hormone|die Hormone"], ["Wenn die Stimme bei Jungen tiefer wird:", "Stimmbruch|der Stimmbruch"], ["Andere Wort für Periode:", "Menstruation|die Menstruation"], ["Das hilft gegen Schweissgeruch: täglich …", "waschen|duschen"]] },
    { id:"ernaehrung", no:"Thema 8", title:"Ernährung und Gesundheit", de:"Lebensmittelpyramide, Nährstoffe und gesunde Pausen", icon:"🥗", lp:"NMG.1.3, NMG.6.3", learn:{"tips": ["Die Schweizer Lebensmittelpyramide zeigt, wie viel wir von welchen Lebensmitteln essen sollten.", "Unten: Wasser und ungesüsster Tee (1 bis 2 Liter täglich). Dann Gemüse und Früchte (5 Portionen am Tag).", "Getreide, Kartoffeln und Hülsenfrüchte geben Energie (Kohlenhydrate). Milchprodukte, Fleisch, Fisch, Eier und Tofu liefern Eiweiss.", "Öle und Nüsse in kleinen Mengen. Ganz oben: Süsses und Salziges nur ab und zu."], "examples": ["5 am Tag: 3 Gemüse, 2 Früchte", "Wasser ist das beste Getränk", "Süsses: ab und zu"]}, quiz:[["Was steht ganz unten in der Lebensmittelpyramide?", "Getränke wie Wasser", "Süssigkeiten", "Fleisch", "Öl"], ["Wie viele Portionen Gemüse und Früchte sollte man pro Tag essen?", "5", "1", "10", "0"], ["Was steht ganz oben in der Pyramide?", "Süsses und Salziges", "Gemüse", "Wasser", "Brot"], ["Welches Lebensmittel liefert viel Eiweiss?", "Eier", "Zucker", "Apfelsaft", "Gurke"], ["Welches Lebensmittel liefert viele Kohlenhydrate?", "Teigwaren", "Butter", "Wasser", "Salat"], ["Wie viel sollte ein Kind etwa trinken?", "1 bis 2 Liter am Tag", "ein Glas pro Woche", "5 Liter am Tag", "nichts"], ["Was ist ein gesunder Znüni?", "ein Apfel und ein Vollkornbrot", "Chips und Cola", "Schokoriegel", "Gummibärchen"], ["Wozu braucht der Körper Kohlenhydrate?", "für Energie", "für die Haarfarbe", "gegen Sonnenbrand", "zum Schlafen"], ["Welches Getränk ist am gesündesten?", "Wasser", "Eistee", "Cola", "Sirup"], ["Wozu braucht der Körper Eiweiss?", "für Muskeln und Wachstum", "für schlechte Laune", "für Zahnschmerzen", "für nichts"], ["Was gehört zu den Hülsenfrüchten?", "Linsen", "Äpfel", "Reis", "Käse"], ["Was hilft neben gutem Essen der Gesundheit?", "Bewegung und genug Schlaf", "den ganzen Tag sitzen", "wenig schlafen", "nur Süsses"]], write:[["Das beste Getränk gegen Durst:", "Wasser"], ["Wie viele Portionen Gemüse und Früchte am Tag? (Zahl)", "5|fünf"], ["Nährstoff für Energie (in Brot, Reis, Teigwaren):", "Kohlenhydrate"], ["Nährstoff für Muskeln (in Eiern, Fleisch, Tofu):", "Eiweiss"]], sort:{"bins": ["Kohlenhydrate", "Eiweiss", "Fett"], "items": [["Brot", "Kohlenhydrate"], ["Teigwaren", "Kohlenhydrate"], ["Reis", "Kohlenhydrate"], ["Kartoffeln", "Kohlenhydrate"], ["Eier", "Eiweiss"], ["Quark", "Eiweiss"], ["Pouletfleisch", "Eiweiss"], ["Tofu", "Eiweiss"], ["Butter", "Fett"], ["Olivenöl", "Fett"], ["Rahm", "Fett"]]} },
    { id:"lebensr", no:"Thema 9", title:"Lebensräume: Wiese, Hecke und Weiher", de:"Pflanzen und Tiere, Nahrungsketten", icon:"🐸", lp:"NMG.2.1, NMG.2.2, NMG.2.6", learn:{"tips": ["Ein Lebensraum bietet Tieren und Pflanzen Nahrung, Wasser, Schutz und Platz für die Jungen.", "In einer Nahrungskette frisst ein Lebewesen das andere: Löwenzahn → Grashüpfer → Frosch → Storch.", "Pflanzen stehen am Anfang jeder Nahrungskette. Sie brauchen Licht, Wasser und Nährstoffe.", "Hecken sind wichtig für Vögel, Igel und Insekten. Im Weiher leben Frösche, Libellenlarven und Molche."], "examples": ["Gras → Heuschrecke → Igel", "Alge → Kaulquappe → Fisch", "Hecke = Versteck und Futter"]}, quiz:[["Was steht am Anfang jeder Nahrungskette?", "eine Pflanze", "ein Raubtier", "ein Pilz", "der Mensch"], ["Welches Tier lebt im Weiher?", "der Molch", "der Maulwurf", "die Feldmaus", "der Specht"], ["Wie heisst die Larve des Frosches?", "Kaulquappe", "Raupe", "Made", "Puppe"], ["Was bietet eine Hecke den Tieren?", "Versteck und Nahrung", "nur Schatten für Menschen", "gar nichts", "Strom"], ["Welche Nahrungskette stimmt?", "Gras → Heuschrecke → Frosch", "Frosch → Gras → Heuschrecke", "Heuschrecke → Frosch → Gras", "Gras → Frosch → Heuschrecke"], ["Was brauchen Pflanzen zum Wachsen?", "Licht, Wasser und Nährstoffe", "nur Dunkelheit", "Zucker und Salz", "Plastik"], ["Wo lebt die Libellenlarve?", "im Wasser", "im Boden", "auf Bäumen", "im Haus"], ["Welches Tier frisst Insekten in der Wiese?", "die Spitzmaus", "die Kuh", "das Schaf", "das Pferd"], ["Was passiert, wenn man eine Wiese oft mäht?", "Weniger Blumen und Insekten können leben.", "Es gibt mehr Blumen.", "Nichts.", "Es wachsen Bäume."], ["Was ist ein Lebensraum?", "ein Ort, an dem Tiere und Pflanzen leben", "ein Zimmer", "eine Stadt nur für Menschen", "ein Zoo"], ["Welche Pflanze wächst im Weiher?", "die Seerose", "die Sonnenblume", "der Kaktus", "die Tanne"], ["Wer frisst den Frosch?", "der Storch", "die Heuschrecke", "die Mücke", "das Gras"]], write:[["Junges des Frosches:", "Kaulquappe|die Kaulquappe"], ["Am Anfang jeder Nahrungskette steht eine …", "Pflanze"], ["Grosse Wasserpflanze mit runden Blättern im Weiher:", "Seerose|die Seerose"], ["Lebensraum aus Sträuchern am Feldrand:", "Hecke|die Hecke"]], sort:{"bins": ["Wiese", "Weiher", "Hecke"], "items": [["Grashüpfer", "Wiese"], ["Löwenzahn", "Wiese"], ["Margerite", "Wiese"], ["Feldmaus", "Wiese"], ["Frosch", "Weiher"], ["Seerose", "Weiher"], ["Molch", "Weiher"], ["Libellenlarve", "Weiher"], ["Holunder", "Hecke"], ["Weissdorn", "Hecke"], ["Neuntöter (Vogel)", "Hecke"], ["Haselstrauch", "Hecke"]]} },
    { id:"energie", no:"Thema 10", title:"Energie und Stromkreis", de:"Energieformen, erneuerbare Energie und Stromkreise", icon:"⚡", lp:"NMG.3.1, NMG.4.3", learn:{"tips": ["Energie braucht es für Licht, Wärme und Bewegung. Fast alle Energie kommt ursprünglich von der Sonne.", "Erneuerbare Energie geht nicht aus: Sonne, Wind, Wasser, Holz. Nicht erneuerbar sind Erdöl, Erdgas, Kohle und Uran.", "In der Schweiz kommt über die Hälfte des Stroms aus Wasserkraft.", "Ein Stromkreis braucht eine Stromquelle (Batterie), Leiter (Kabel) und einen Verbraucher (Lämpchen). Ein Schalter öffnet oder schliesst den Kreis. Strom fliesst nur im geschlossenen Kreis."], "examples": ["Sonne, Wind, Wasser = erneuerbar", "Batterie + Kabel + Lämpchen = Stromkreis", "Schalter offen = Lämpchen aus"]}, quiz:[["Welche Energiequelle ist erneuerbar?", "Wind", "Erdöl", "Kohle", "Erdgas"], ["Woher kommt in der Schweiz am meisten Strom?", "Wasserkraft", "Kohle", "Wind", "Erdöl"], ["Wann leuchtet das Lämpchen?", "wenn der Stromkreis geschlossen ist", "wenn der Schalter offen ist", "immer", "nie"], ["Was ist ein Leiter?", "ein Material, durch das Strom fliesst", "ein Lämpchen", "ein Schalter aus Gummi", "eine Batterie ohne Strom"], ["Welches Material leitet Strom?", "Kupfer", "Holz", "Gummi", "Plastik"], ["Was macht ein Schalter?", "Er öffnet oder schliesst den Stromkreis.", "Er macht Strom.", "Er speichert Licht.", "Er kühlt das Kabel."], ["Welche Energie nutzt eine Solaranlage?", "Sonnenenergie", "Windenergie", "Erdöl", "Atomenergie"], ["Was ist NICHT erneuerbar?", "Erdgas", "Sonne", "Wasser", "Holz"], ["Warum ist Strom aus der Steckdose gefährlich?", "Er kann lebensgefährlich sein.", "Er ist kalt.", "Er riecht schlecht.", "Er ist nicht gefährlich."], ["Wie kannst du Energie sparen?", "Licht ausmachen, wenn du den Raum verlässt", "alle Geräte immer laufen lassen", "das Fenster offen lassen, wenn geheizt wird", "das Licht den ganzen Tag brennen lassen"], ["Was wandelt ein Windrad um?", "Wind in Strom", "Strom in Wind", "Wasser in Holz", "Licht in Wasser"], ["Woher kommt fast alle Energie ursprünglich?", "von der Sonne", "vom Mond", "vom Erdöl", "vom Strom"]], write:[["Stromquelle für eine Taschenlampe:", "Batterie|die Batterie"], ["Energie aus fliessendem Wasser heisst …", "Wasserkraft"], ["Damit öffnest oder schliesst du den Stromkreis:", "Schalter|der Schalter"], ["Gegenteil von erneuerbar:", "nicht erneuerbar"]], sort:{"bins": ["erneuerbar", "nicht erneuerbar"], "items": [["Sonne", "erneuerbar"], ["Wind", "erneuerbar"], ["Wasserkraft", "erneuerbar"], ["Holz", "erneuerbar"], ["Erdwärme", "erneuerbar"], ["Erdöl", "nicht erneuerbar"], ["Erdgas", "nicht erneuerbar"], ["Kohle", "nicht erneuerbar"], ["Uran", "nicht erneuerbar"], ["Benzin", "nicht erneuerbar"]]} },
    { id:"klima", no:"Thema 11", title:"Wetter und Klima", de:"Wetterkarte, Föhn und Bise, Klimawandel", icon:"🌦️", lp:"NMG.4.4, NMG.8.2", learn:{"tips": ["Wetter ist das, was wir heute oder in den nächsten Tagen erleben. Klima ist das durchschnittliche Wetter über 30 Jahre.", "Hochdruck bringt meist schönes Wetter, Tiefdruck oft Wolken und Regen.", "Föhn ist ein warmer, trockener Fallwind in den Alpentälern, zum Beispiel im Rheintal. Die Bise ist ein kalter Nordostwind.", "Durch den Klimawandel wird es wärmer, die Gletscher schmelzen. Weniger Autofahren und Energie sparen helfen dem Klima."], "examples": ["Wetter = heute", "Klima = über 30 Jahre", "Föhn = warm und trocken", "Bise = kalt aus Nordosten"]}, quiz:[["Was ist Klima?", "das durchschnittliche Wetter über viele Jahre", "das Wetter von heute", "ein Gewitter", "eine Wolke"], ["Was bringt Hochdruck meistens?", "schönes Wetter", "Regen", "Schnee", "Hagel"], ["Was ist der Föhn?", "ein warmer, trockener Fallwind", "ein kalter Wind aus dem Nordosten", "ein Regen", "eine Wolke"], ["Was ist die Bise?", "ein kalter Wind aus Nordosten", "ein warmer Wind aus Süden", "ein Gewitter", "ein Schneesturm im Sommer"], ["Womit misst man den Luftdruck?", "Barometer", "Thermometer", "Lineal", "Waage"], ["Was passiert mit den Gletschern durch den Klimawandel?", "Sie schmelzen.", "Sie wachsen.", "Sie bleiben gleich.", "Sie werden zu Vulkanen."], ["Was hilft dem Klima?", "mit dem Velo oder dem ÖV fahren", "mehr fliegen", "das Licht brennen lassen", "mehr Abfall machen"], ["In welcher Einheit misst man Niederschlag?", "Millimeter", "Grad", "Kilogramm", "Stunden"], ["Was zeigt eine Wetterkarte?", "das Wetter in einer Region", "die Strassen", "die Kantonsgrenzen nur", "die Fahrpläne"], ["Welches Gas verstärkt den Treibhauseffekt?", "Kohlendioxid (CO₂)", "Sauerstoff", "Helium", "Stickstoff nur"], ["In welchem Tal gibt es oft Föhn?", "im Rheintal", "am Genfersee", "im Mittelland bei Bern", "in Basel"], ["Wie heisst die Wetterstation auf dem höchsten Berg der Ostschweiz?", "Säntis", "Rigi", "Pilatus", "Chasseral"]], write:[["Warmer, trockener Fallwind in den Alpentälern:", "Föhn|der Föhn"], ["Kalter Wind aus Nordosten:", "Bise|die Bise"], ["Gerät zum Messen der Temperatur:", "Thermometer|das Thermometer"], ["Durchschnittliches Wetter über 30 Jahre:", "Klima|das Klima"]] },
    { id:"wirtschaft", no:"Thema 12", title:"Arbeit und Wirtschaft", de:"Landwirtschaft, Industrie, Dienstleistung und Produkte", icon:"🏭", lp:"NMG.6.1, NMG.6.3", learn:{"tips": ["Man teilt die Arbeit in drei Bereiche: Landwirtschaft (Rohstoffe gewinnen), Industrie und Gewerbe (Waren herstellen), Dienstleistungen (für andere etwas tun).", "In der Schweiz arbeiten die meisten Menschen im Dienstleistungsbereich, zum Beispiel in Läden, Schulen, Spitälern oder Banken.", "Vom Rohstoff zum Produkt: Milch → Käserei → Käse → Laden → Kühlschrank.", "Die OLMA in St.Gallen ist eine grosse Messe für Landwirtschaft und Ernährung."], "examples": ["Bäuerin: Landwirtschaft", "Schreiner: Gewerbe", "Coiffeuse: Dienstleistung"]}, quiz:[["In welchem Bereich arbeiten in der Schweiz die meisten Menschen?", "Dienstleistungen", "Landwirtschaft", "Bergbau", "Fischerei"], ["Zu welchem Bereich gehört eine Bäuerin?", "Landwirtschaft", "Dienstleistung", "Industrie", "Verwaltung"], ["Zu welchem Bereich gehört eine Lehrerin?", "Dienstleistung", "Landwirtschaft", "Industrie", "Gewerbe"], ["Was entsteht in einer Käserei?", "Käse", "Brot", "Schokolade nur", "Wolle"], ["Wie heisst die grosse Messe in St.Gallen?", "OLMA", "BEA", "MUBA", "Comptoir"], ["Was ist ein Rohstoff?", "ein Stoff aus der Natur, z.B. Milch oder Holz", "ein fertiges Velo", "ein Computer", "ein Laden"], ["Was macht ein Schreiner aus Holz?", "Möbel", "Käse", "Strom", "Kleider"], ["Welche Reihenfolge stimmt?", "Milch – Käserei – Käse – Laden", "Laden – Käse – Milch – Käserei", "Käse – Milch – Laden – Käserei", "Käserei – Laden – Milch – Käse"], ["Was bedeutet «regional einkaufen»?", "Produkte aus der Nähe kaufen", "nur im Internet kaufen", "nur teure Sachen kaufen", "gar nicht einkaufen"], ["Was produziert eine Fabrik?", "Waren in grossen Mengen", "nur Dienstleistungen", "Rohstoffe aus dem Boden", "Wetter"], ["Wer arbeitet in einer Dienstleistung?", "die Coiffeuse", "der Förster", "der Bauer", "die Fischerin"], ["Warum transportiert     app.innerHTML = bar(done, total, `${done} von ${total} Karten geschafft`) + `<div class="card center flash">

    </div>`;
    if (dir === 'fwd') speak(w.en, .85);
    if ($('#say')) $('#say').onclick = () => speak(w.en, .85);
    $('#flip').onclick = () => {
      $('#back').hidden = false; $('#rate').hidden = false; $('#flip').hidden = true;
