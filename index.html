<style>
:root{
  --bg:#f7f9fd;--card:#ffffff;--ink:#141b2d;--muted:#667085;--line:#e4e8f1;--soft:#eef1f8;
  --star:#ffb020;--ok:#12a36b;--bad:#ef4444;--okbg:#e6f7ef;--badbg:#fdeaea;--pen:#ef4444;--c:#3b6ef5;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.07);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1322;--card:#181f33;--ink:#eef2ff;--muted:#9aa4bf;--line:#2a3350;--soft:#1f2740;--okbg:#10301f;--badbg:#3a1618;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1322;--card:#181f33;--ink:#eef2ff;--muted:#9aa4bf;--line:#2a3350;--soft:#1f2740;--okbg:#10301f;--badbg:#3a1618;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 55%,transparent);outline-offset:2px}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;background:none;border:none;cursor:pointer;padding:2px;white-space:nowrap;letter-spacing:-.01em}
.crumbs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{font-size:.88rem;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.sep{color:var(--muted)}
.sync{font-size:.8rem;font-weight:800;white-space:nowrap;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.sync.off{color:var(--bad)}
.stars{font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#ffd166,#ffb020);color:#3d2a00;border-radius:999px;padding:5px 12px;box-shadow:0 2px 8px rgba(255,176,32,.35)}
@media(max-width:300px){.brand .bt{display:none}}
@media(max-width:560px){.top{flex-wrap:wrap;row-gap:8px;padding:8px 12px}.brand{margin-right:auto}.crumbs{order:5;flex:1 1 100%}
  .crumbs:empty{display:none}.crumb{font-size:.82rem;padding:4px 10px}.stars,.playchip,.sync{padding:5px 10px}}

/* Seite */
.sheet{max-width:780px;margin:0 auto;padding:22px 18px 64px;min-height:calc(100vh - 60px)}
.h1{font-weight:900;font-size:clamp(1.6rem,5.2vw,2.2rem);line-height:1.12;letter-spacing:-.02em;margin:.1em 0 .35em}
.h2{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:1.6em 0 .7em;color:var(--muted)}

.dhead{display:flex;gap:10px;align-items:center;padding:4px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.dhead div{flex:1;display:flex;flex-direction:column}.dhead small{color:var(--muted)}
.dclose{padding:6px 12px}
.ditem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:none;background:transparent;font:inherit;color:var(--ink);padding:12px 10px;border-radius:12px;cursor:pointer}
.ditem:hover{background:var(--soft)}.ditem>span:first-child{font-size:1.35rem;width:30px;text-align:center}.ditem b{display:block}.ditem small{color:var(--muted)}

body.menuopen{overflow:hidden}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}.phead .h1{margin-bottom:6px}.nb{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.8rem;font-weight:900;text-align:center}
.kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:520px){.kpi4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dbars{width:100%;height:auto;display:block;margin:10px 0 4px;color:var(--ink)}
.dtab>div{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(50px,1fr) 3.2em;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.dtab>div:last-child{border:0}.dtab>div>.small{grid-column:1/-1;margin-top:-4px}
.dbar{display:block;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.dbar i{display:block;height:100%;background:var(--ok)}.mitem .dbar{margin-top:6px}
.dsw{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dsw p{margin:6px 0}@media(max-width:520px){.dsw{grid-template-columns:1fr}}
.derr>div{padding:8px 0;border-bottom:1px solid var(--line)}.derr>div:last-child{border:0}.derr .small{display:block;margin-top:2px}
.rlist>div{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.rlist>div:last-child{border:0}.rlist b{white-space:nowrap}
.btn.sm{min-height:38px;padding:6px 12px}.mitem.rew>span:last-child{flex:1;min-width:0}.mitem.rew .dbar{width:100%}

.exl{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:.95rem}.exl input{margin-top:4px}
.wrep{white-space:pre-wrap;font:inherit;font-size:.92rem;margin:0}.mitem.rew.off{opacity:.65}
.ptabs{margin-bottom:10px;flex-wrap:nowrap;gap:6px;overflow-x:auto}.ptabs .btn{padding:7px 11px;font-size:.92rem;white-space:nowrap;flex:0 0 auto}
.pcards{display:grid;gap:12px}.pcard .kpi{margin-top:8px}.pchead{display:flex;gap:10px;align-items:center}.pchead div{display:flex;flex-direction:column}

    { id:'md1', no:'Thema 4', title:'Multiplikation und Division 1', de:'Zehner-Einmaleins und Stellen-Einmaleins', icon:'✖️', gen:'md1', lp:'MA.1.A.3.d, MA.1.A.3.e',
      learn:{ table:true, tips:['Zehner-Einmaleins: 7 · 30 ist 7 · 3 Zehner = 21 Zehner = 210.',"Stellen-Einmaleins: 6 · 400 = 24 Hunderter = 2'400.","Geteilt genauso: 3'600 : 9 → 36 Hunderter : 9 = 4 Hunderter = 400."], examples:['7 · 30 = 210',"6 · 400 = 2'400",'280 : 7 = 40'] }},
    { id:'fig1', no:'Thema 5', title:'Figuren 1', de:'Quadrat und Rechteck, Parkette, Spiegelbilder', icon:'🔷', gen:'fig1', lp:'MA.2.A.1',
      learn:{ tips:['Ein Quadrat hat vier gleich lange Seiten und vier rechte Winkel. Ein Rechteck hat vier rechte Winkel, gegenüberliegende Seiten sind gleich lang.','Ein Parkett bedeckt eine Fläche ohne Lücken und ohne Überlappungen.','Eine Figur ist achsensymmetrisch, wenn beide Hälften beim Falten genau aufeinander passen.'], examples:['Achsensymmetrisch: A, H, M, T','Nicht achsensymmetrisch: F, G, R'] }},
    { id:'addsub', no:'Thema 6', title:'Addition und Subtraktion', de:'Mit grossen Zahlen im Kopf und schriftlich rechnen', icon:'➕', gen:'addsub', lp:'MA.1.A.3.d, MA.1.A.3.e',
      learn:{ tips:["Im Kopf mit Tausendern rechnen: 320'000 + 38'000 → 320 T + 38 T = 358 T.",'Schriftlich: Einer unter Einer, Zehner unter Zehner. Beginne rechts, den Übertrag schreibst du klein in die nächste Spalte.',"Überprüfe mit Überschlagen: 4'582 + 3'719 ist etwa 4'600 + 3'700 = 8'300."], examples:["320'000 + 38'000 = 358'000","4'582 + 3'719 = 8'301","7'204 − 2'658 = 4'546"] }},
    { id:'fig2', no:'Thema 7', title:'Figuren 2', de:'Linien, Kreise, vergrössern und verkleinern', icon:'⭕', gen:'fig2', lp:'MA.2.A.1, MA.2.A.2',
      learn:{ tips:['Parallele Linien haben überall den gleichen Abstand und treffen sich nie.','Senkrechte Linien bilden einen rechten Winkel.','Der Radius geht vom Mittelpunkt bis zum Kreisrand. Der Durchmesser ist doppelt so lang wie der Radius.','Vergrössern auf das Doppelte: alle Längen mal 2. Verkleinern auf die Hälfte: alle Längen durch 2.'], examples:['Radius 4 cm → Durchmesser 8 cm','6 cm doppelt so gross → 12 cm'] }},
    { id:'md2', no:'Thema 8', title:'Multiplikation und Division 2', de:'Rechenwege beim Multiplizieren und Dividieren', icon:'➗', gen:'malgeteilt', lp:'MA.1.A.3.e',
      learn:{ tips:["Nullen zuerst weglassen und am Schluss anhängen: 6 · 400 → 6 · 4 = 24 → 2'400.","Zerlegen: 45 · 24 = 40 · 24 + 5 · 24 = 960 + 120 = 1'080.",'Geteilt in Schritten: 231 : 7 → 210 : 7 = 30 und 21 : 7 = 3, zusammen 33.','Du darfst Zwischenschritte auf ein Blatt schreiben.'], examples:["45 · 240 = 10'800",'231 : 7 = 33'] }},
    { id:'sach', no:'Thema 9', title:'Sachrechnen', de:'Einkaufen, Probieren, Würfelspiele', icon:'🛒', gen:'sach', lp:'MA.3.C.2',
      learn:{ tips:['Lies die Aufgabe zweimal. Was ist gegeben, was ist gesucht?','Schreib eine Rechnung dazu und am Schluss einen Antwortsatz.','1 Fr. = 100 Rp.'], examples:['4 Hefte zu 3 Fr. → 4 · 3 = 12 Fr.','50 Fr. − 37 Fr. = 13 Fr. Rückgeld'] }},
    { id:'koerper', no:'Thema 10', title:'Körper und Pläne', de:'Würfel, Quader, Würfelgebäude', icon:'🧊', gen:'koerper', lp:'MA.2.A.1, MA.2.B.1',
      learn:{ tips:['Ein Würfel hat 6 Flächen (alles Quadrate), 12 Kanten und 8 Ecken.','Ein Quader hat auch 6 Flächen, 12 Kanten und 8 Ecken. Seine Flächen sind Rechtecke.','Würfelgebäude zählen: Stockwerk für Stockwerk.'], examples:['Würfel: 6 Flächen, 12 Kanten, 8 Ecken'] }},
    { id:'muster', no:'Thema 11', title:'Muster und Zahlenrätsel', de:'Zahlenfolgen, Zahlenmauern, Zahlenrätsel', icon:'🧱', gen:'muster', lp:'MA.1.B.1',
      learn:{ tips:['Zahlenfolge: Finde die Regel zwischen zwei Nachbarzahlen und wende sie weiter an.','Zahlenmauer: Zwei Steine nebeneinander ergeben zusammen den Stein darüber.','Zahlenrätsel: Rechne rückwärts. Aus «verdoppeln und 7 dazu» wird «7 weg und halbieren».'], examples:['3, 7, 11, 15 → 19','Mauer 5, 8, 2 → 13, 10 → 23'] }},
    { id:'zeit', no:'Thema 12', title:'Uhr und Zeit', de:'Uhr lesen, Zeiteinheiten, Zeitpunkt und Zeitdauer', icon:'⏰', clockGame:true, gen:'zeit', lp:'MA.3.A.2.f',
      learn:{ tips:['Der kurze Zeiger zeigt die Stunden, der lange Zeiger die Minuten.','Steht der lange Zeiger auf der 3, ist es Viertel nach. Auf der 6 ist es halb, auf der 9 Viertel vor.','Am Nachmittag zählst du 12 Stunden dazu: 3 Uhr am Nachmittag ist 15:00.','1 d = 24 h, 1 h = 60 min, 1 min = 60 s','Zeitdauer in Schritten rechnen: von 8:45 bis 9:00 sind es 15 min, dann bis 10:15 noch 75 min. Zusammen 90 min.'], examples:['2 h = 120 min','1 h 15 min = 75 min','8:45 bis 10:15 Uhr = 90 min','9:50 + 25 min = 10:15'] }},
    { id:'brueche', no:'Freiwillig', title:'Brüche', de:'Freiwillig: geht über die Grundanforderungen hinaus', icon:'🍕', gen:'brueche', lp:'MA.1.C.2',
      learn:{ tips:['Ein Viertel (¼) heisst: das Ganze in 4 gleiche Teile teilen und 1 Teil nehmen.','Je grösser die Zahl unten, desto kleiner die Teile: ½ ist grösser als ¼.'], examples:['½ von 20 = 10','¼ von 20 = 5','⅓ von 12 = 4'] }},
    { id:'blitz', no:'Extra', title:'Blitzrechnen', de:'Kopfrechnen fürs ganze Jahr', icon:'⚡', gen:'kopfmix', lp:'MA.1.A.3.d',
      learn:{ table:true, tips:['Jeden Tag ein paar Minuten reichen. Tempo kommt mit der Übung.'], examples:['7 · 8 = 56',"4 · 300 = 1'200",'640 : 8 = 80'] }},
    { id:'begriffe', no:'Extra', title:'Mathe-Wörter', de:'Summe, Differenz, Produkt, Quotient und mehr', icon:'💬', gen:'begriffe', choiceOnly:true, lp:'MA.1.A.1.e, MA.1.A.1.f',
      learn:{ tips:['Plus heisst Addition: Summand + Summand = Summe.','Minus heisst Subtraktion: Das Ergebnis heisst Differenz.','Mal heisst Multiplikation: Faktor · Faktor = Produkt.','Geteilt heisst Division: Das Ergebnis heisst Quotient.','Was beim Teilen übrig bleibt, heisst Rest: 17 : 5 = 3 Rest 2.','Eine Quadratzahl ist eine Zahl mal sich selbst: 7 · 7 = 49.'] }}
  ]}]},
  { grade:5, books:[ { id:'ma5', name:'Lehrplan 21', units:[
    { id:"zahl", no:"Thema 1", title:"Zahlen bis 1 Million und darüber", de:"Stellenwerte, ordnen, zählen in Schritten", icon:"🔢", gen:"zahl5", lp:"MA.1.A.1.f, MA.1.A.2.e, MA.1.C.2.e", learn:{"tips": ["Stellenwerte: Mio (Millionen), HT, ZT, T, H, Z, E. Eine Million = 1'000'000 = 1000 Tausender.", "Grosse Zahlen schreibst du in Dreiergruppen mit Apostroph: 2'345'678.", "Vergleichen: zuerst die Anzahl Stellen, dann von links Ziffer für Ziffer.", "Beim Zählen in Schritten verändert sich nur eine Stelle, ausser es gibt einen Übertrag."], "examples": ["4 HT + 3 ZT + 5 T = 435'000", "990'000 + 10'000 = 1'000'000", "1 Milliarde = 1000 Millionen"]} },
    { id:"runden", no:"Thema 2", title:"Runden und Überschlagen", de:"Auf Zehner, Hunderter, Tausender runden und schätzen", icon:"🎯", gen:"runden5", lp:"MA.1.A.2.f, MA.1.A.4.f", learn:{"tips": ["Schau auf die Ziffer rechts von der Rundungsstelle: 0 bis 4 abrunden, 5 bis 9 aufrunden.", "Runde 34'567 auf Tausender: Die Hunderterziffer ist 5 → aufrunden → 35'000.", "Überschlagen heisst: zuerst runden, dann im Kopf rechnen. So merkst du, ob ein Ergebnis stimmen kann."], "examples": ["2'462 ≈ 2'000 (auf Tausender)", "58 · 31 ≈ 60 · 30 = 1'800", "4'812 + 3'190 ≈ 5'000 + 3'000 = 8'000"]} },
    { id:"teiler", no:"Thema 3", title:"Teiler und Vielfache", de:"Teilbarkeit, Teiler und Vielfache bestimmen", icon:"➗", gen:"teiler5", lp:"MA.1.A.4.f, MA.1.C.2.f", learn:{"tips": ["Vielfache von 6: 6, 12, 18, 24, … (die Einmaleins-Reihe).", "Teiler von 12: 1, 2, 3, 4, 6, 12. Jede Zahl ist durch 1 und durch sich selbst teilbar.", "Durch 2 teilbar: letzte Ziffer gerade. Durch 5: letzte Ziffer 0 oder 5. Durch 10: letzte Ziffer 0.", "Durch 3 teilbar, wenn die Quersumme durch 3 teilbar ist: 471 → 4 + 7 + 1 = 12."], "examples": ["Teiler von 18: 1, 2, 3, 6, 9, 18", "345 ist durch 5 teilbar", "Quersumme von 252 = 9 → durch 9 teilbar"]} },
    { id:"kopf", no:"Thema 4", title:"Kopfrechnen und Rechenvorteile", de:"Geschickt rechnen bis 4 Wertziffern", icon:"🧠", gen:"kopf5", lp:"MA.1.A.3.d, MA.1.A.4.e", learn:{"tips": ["Mit Hundertern rechnen wie mit Einern: 4'800 + 3'700 = 48 H + 37 H = 85 H = 8'500.", "Rechenvorteil: 25 · 36 = 25 · 4 · 9 = 100 · 9 = 900.", "Verdoppeln und Halbieren: 50 · 48 = 100 · 24 = 2'400.", "Umkehraufgabe zur Kontrolle: 640 : 8 = 80, denn 80 · 8 = 640."], "examples": ["6'300 − 2'800 = 3'500", "25 · 48 = 1'200", "2'400 : 6 = 400"]} },
    { id:"mult", no:"Thema 5", title:"Multiplizieren mit grösseren Zahlen", de:"Malkreuz, eigene Rechenwege und Überschlag", icon:"✖️", gen:"mult5", lp:"MA.1.A.3.e, MA.1.B.2.e", learn:{"tips": ["Zerlege eine Zahl: 34 · 26 = 34 · 20 + 34 · 6 = 680 + 204 = 884.", "Malkreuz: Zerlege beide Zahlen in Zehner und Einer und rechne alle Teile.", "Mach zuerst einen Überschlag: 34 · 26 ≈ 30 · 30 = 900. Das Ergebnis muss in der Nähe liegen."], "examples": ["47 · 12 = 470 + 94 = 564", "213 · 4 = 852", "Überschlag 312 · 48 ≈ 300 · 50 = 15'000"]} },
    { id:"div", no:"Thema 6", title:"Dividieren", de:"Durch einstellige Zahlen teilen, mit und ohne Rest", icon:"➗", gen:"div5", lp:"MA.1.A.3.e, MA.1.B.2.e", learn:{"tips": ["Zerlege die Zahl in Teile, die gut teilbar sind: 672 : 6 = 600 : 6 + 72 : 6 = 100 + 12 = 112.", "Bleibt etwas übrig, ist das der Rest: 50 : 7 = 7 Rest 1, denn 7 · 7 = 49.", "Kontrolle mit der Umkehraufgabe: 112 · 6 = 672."], "examples": ["735 : 5 = 147", "95 : 4 = 23 Rest 3", "2'436 : 6 = 406"]} },
    { id:"dez", no:"Thema 7", title:"Dezimalzahlen", de:"Lesen, ordnen, addieren und subtrahieren", icon:"🔟", gen:"dez5", lp:"MA.1.A.1.g, MA.1.A.2.f, MA.1.A.3.e", learn:{"tips": ["Nach dem Dezimalpunkt kommen Zehntel, dann Hundertstel: 3.45 = 3 Einer, 4 Zehntel, 5 Hundertstel.", "Beim Rechnen schreibst du Stelle unter Stelle, Punkt unter Punkt: 3.45 + 1.2 = 4.65.", "Vergleichen: 2.5 ist grösser als 2.45, denn 5 Zehntel sind mehr als 4 Zehntel.", "Du kannst Punkt oder Komma eingeben: 4.65 und 4,65 gelten beide."], "examples": ["0.5 = 5 Zehntel = 1/2", "2.30 Fr. + 1.80 Fr. = 4.10 Fr.", "1.75 m = 175 cm"]} },
    { id:"bruch", no:"Thema 8", title:"Brüche", de:"Darstellen, vergleichen, kürzen und erweitern", icon:"🍕", gen:"bruch5", lp:"MA.1.A.2.f, MA.1.A.3.e, MA.1.C.2.f", learn:{"tips": ["Ein Bruch hat Zähler (oben) und Nenner (unten): 3/4 heisst 3 von 4 gleich grossen Teilen.", "Erweitern: Zähler und Nenner mit der gleichen Zahl malnehmen: 1/2 = 2/4 = 3/6.", "Kürzen: Zähler und Nenner durch die gleiche Zahl teilen: 6/8 = 3/4.", "3/4 von 20: zuerst 20 : 4 = 5, dann 5 · 3 = 15.", "1/2 = 50 %, 1/4 = 25 %, 1/10 = 10 %."], "examples": ["2/4 = 1/2", "3/5 = 6/10", "1/4 von 80 = 20"]} },
    { id:"geo", no:"Thema 9", title:"Geometrie: Winkel und Kreise", de:"Parallel, senkrecht, Winkelarten, Radius und Durchmesser", icon:"📐", gen:"geo5", lp:"MA.2.A.1.g, MA.2.A.2.f", learn:{"tips": ["Parallele Geraden schneiden sich nie. Senkrechte Geraden bilden einen rechten Winkel (90°).", "Winkelarten: spitz (kleiner als 90°), recht (90°), stumpf (zwischen 90° und 180°), gestreckt (180°).", "Der Durchmesser ist doppelt so lang wie der Radius.", "Mit dem Geodreieck zeichnest du Senkrechte und Parallele, mit dem Zirkel Kreise."], "examples": ["Radius 4 cm → Durchmesser 8 cm", "45° ist spitz", "Ein Quadrat hat 4 Symmetrieachsen"]} },
    { id:"flaeche", no:"Thema 10", title:"Umfang und Fläche", de:"Rechtecke, Quadrate und zusammengesetzte Figuren", icon:"⬛", gen:"flaeche5", lp:"MA.2.A.1.g, MA.3.A.2.f", learn:{"tips": ["Umfang = alle Seiten zusammen. Rechteck: 2 · Länge + 2 · Breite.", "Fläche = Länge · Breite. Die Einheit ist cm² oder m² (Quadratzentimeter, Quadratmeter).", "Zusammengesetzte Figuren zerlegst du in Rechtecke und zählst die Flächen zusammen.", "Achtung: Umfang in cm oder m, Fläche in cm² oder m²."], "examples": ["Rechteck 6 m · 4 m: Fläche 24 m², Umfang 20 m", "Quadrat 5 cm: Fläche 25 cm²", "1 m² = 100 dm²"]} },
    { id:"masse", no:"Thema 11", title:"Masseinheiten und Massstab", de:"Längen, Gewichte, Hohlmasse, Zeit und Karten", icon:"⚖️", gen:"masse5", lp:"MA.3.A.1.f, MA.3.A.2.f", learn:{"tips": ["1 km = 1'000 m · 1 kg = 1'000 g · 1 t = 1'000 kg", "1 l = 10 dl = 1'000 ml · 1 h = 60 min · 1 min = 60 s", "Dezimalzahlen umwandeln: 2.5 km = 2'500 m, 0.75 l = 750 ml.", "Massstab 1 : 1000 heisst: 1 cm auf der Karte sind 1000 cm = 10 m in Wirklichkeit."], "examples": ["3.2 kg = 3'200 g", "1 h 45 min = 105 min", "1 : 25'000 → 4 cm = 1 km"]} },
    { id:"sach", no:"Thema 12", title:"Sachrechnen", de:"Preise, Mengen und Rückgeld", icon:"🛒", gen:"sach5", lp:"MA.1.B.1.e, MA.3.C.1.e", learn:{"tips": ["Lies die Aufgabe genau: Was weiss ich? Was ist gesucht?", "Dreisatz: Zuerst für 1 Stück rechnen, dann für die gesuchte Anzahl: 3 Hefte 4.50 Fr. → 1 Heft 1.50 Fr. → 7 Hefte 10.50 Fr.", "Mach eine Tabelle, wenn mehrere Werte zusammengehören.", "Kontrolliere mit einem Überschlag, ob das Ergebnis passt."], "examples": ["4 Brötchen à 1.20 Fr. = 4.80 Fr.", "20 Fr. − 13.40 Fr. = 6.60 Fr.", "In 3 h fährt das Velo 45 km"]} },
    { id:"daten", no:"Thema 13", title:"Daten, Kombinatorik und Zufall", de:"Tabellen lesen, Möglichkeiten zählen, sicher oder unmöglich", icon:"📊", gen:"daten5", lp:"MA.3.C.1.e, MA.3.C.2.e", learn:{"tips": ["In einer Tabelle oder einem Diagramm findest du Werte schnell. Lies zuerst die Überschrift und die Einheiten.", "Kombinationen: 3 T-Shirts und 2 Hosen ergeben 3 · 2 = 6 Möglichkeiten.", "Zufall: sicher (passiert immer), möglich (kann passieren), unmöglich (passiert nie)."], "examples": ["4 Glacesorten, 2 Becher → 8 Möglichkeiten", "Würfel: eine 3 ist möglich", "Münze: «Zahl» oder «Kopf»"]} }
  ]}]}
]},

    { id:'wortart', no:'Thema 2', title:'Wortarten erkennen', de:'Nomen, Verb, Adjektiv oder ein anderes Wort?', icon:'🗂️', gen:'wortart', choiceOnly:true, lp:'D.5.D.1.c',
      learn:{ tips:['Nomen-Probe: Du kannst «der», «die» oder «das» davor setzen. Nomen schreibt man gross: der Hund, die Schule.',
        'Verb-Probe: Du kannst «ich», «du» oder «er» davor setzen und es verändert sich: ich renne, du rennst.',
        'Adjektiv-Probe: Du kannst es steigern oder «ganz» davor setzen: schnell, schneller, ganz schnell.',
        'Alle anderen Wörter sind «andere Wörter», zum Beispiel und, auf, sehr, wir, heute.'],
        examples:['die Katze → Nomen','du lachst → Verb','kalt, kälter → Adjektiv','und → anderes Wort'] }},
    { id:'nomen', no:'Thema 3', title:'Nomen: Einzahl, Mehrzahl, Begleiter', de:'der, die, das und die Mehrzahl', icon:'🏷️', gen:'plural', lp:'D.5.D.1.c',
      labels:{ calc:['✏️','Schreiben','Schreib die Mehrzahl oder die Einzahl'], blitz:['⚡','Auswählen','Wähle die richtige Form'], test:['Schreiben','Auswählen'] },
      learn:{ tips:['Nomen haben einen Begleiter (Artikel): der, die oder das.',
        'In der Mehrzahl heisst der Begleiter immer «die»: der Baum → die Bäume.',
        'Oft wird in der Mehrzahl aus a ein ä, aus o ein ö, aus u ein ü und aus au ein äu: die Hand → die Hände.',
        'Manche Nomen bleiben in der Mehrzahl gleich: der Lehrer → die Lehrer.'],
        examples:['der Baum → die Bäume','die Maus → die Mäuse','das Kind → die Kinder','das Auto → die Autos'] }},
    { id:'vtyp', no:'Thema 4', title:'Verben: regelmässig oder unregelmässig?', de:'Wortstamm erkennen und Verben sortieren', icon:'🌳', gen:'verbtyp', choiceOnly:true, lp:'D.5.D.1.c',
      learn:{ tips:['Der Wortstamm ist das Verb ohne die Endung -en: lach-en, fahr-en, sortier-en.',
        'Bei regelmässigen Verben bleibt der Wortstamm immer gleich: ich lache, du lachst, er lacht.',
        'Bei unregelmässigen Verben ändert sich der Wortstamm, meistens bei du und er/sie/es: ich fahre, du fährst, er fährt.',
        'Trick: Bilde die du-Form. Ändert sich der Wortstamm, ist das Verb unregelmässig.'],
        examples:['lach-en → du lachst','fahr-en → du fährst','seh-en → du siehst','helf-en → du hilfst'],
        conj:['lachen','fahren','sehen','helfen'] }},
    { id:'vform', no:'Thema 5', title:'Verben: Personalformen', de:'ich, du, er/sie/es, wir, ihr, sie', icon:'✍️', gen:'personal', lp:'D.5.D.1.c',
      labels:{ calc:['✏️','Schreiben','Tippe die richtige Verbform ein'], blitz:['⚡','Auswählen','Wähle die richtige Verbform'], test:['Schreiben','Auswählen'] },
      learn:{ tips:['Die Endungen sind fast immer gleich: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie -en.',
        'Bei unregelmässigen Verben ändert sich der Stamm nur bei du und er/sie/es.',
        'Achtung, häufiger Fehler: Bei ihr ändert sich nichts! Ihr lauft, ihr helft, ihr tragt, ihr gebt.',
        'Endet der Stamm auf s, ss oder z, fällt bei du das s weg: du küsst, du isst, du tanzt.'],
        examples:['du läufst','er hilft','ihr lauft','ihr helft','du liest','er nimmt'],

  { grade:5, books:[ { id:'de5', name:'Lehrplan 21', units:[
    { id:"wortart", no:"Thema 1", title:"Wortarten", de:"Nomen, Verb, Adjektiv, Pronomen und Partikeln", icon:"🏷️", gen:"wortart5", choiceOnly:true, labels:{ calc:["🏷️","Wortarten bestimmen","Welche Wortart ist markiert?"] }, lp:"D.5.D.1", learn:{"tips": ["Nomen: Probe mit Artikel (der, die, das). Verb: Probe mit «ich …, du …». Adjektiv: Probe «sehr …» oder steigern.", "Pronomen stehen für ein Nomen oder begleiten es: ich, du, er, sie, wir, mein, dein, unser.", "Präpositionen zeigen, wo oder wohin: auf, unter, neben, mit, nach, in.", "Konjunktionen verbinden Wörter oder Sätze: und, oder, aber, weil, dass."], "examples": ["der Wald (Nomen)", "wir wandern (Pronomen + Verb)", "auf dem Dach (Präposition)", "weil es regnet (Konjunktion)"]} },
    { id:"pron", no:"Thema 2", title:"Pronomen", de:"Personalpronomen und Possessivpronomen", icon:"👤", lp:"D.5.D.1", learn:{"tips": ["Personalpronomen ersetzen Nomen: Lea → sie, der Hund → er, die Kinder → sie.", "Possessivpronomen zeigen, wem etwas gehört: mein, dein, sein, ihr, unser, euer.", "Lea und ihr Bruder. Tim und sein Hund."], "examples": ["Mia liest. Sie liest.", "Das ist unser Haus.", "Tim sucht seinen Ball."]}, quiz:[["Lea hat einen Hund. ___ Hund heisst Rex.", "Ihr", "Sein", "Mein", "Unser"], ["Tim sucht ___ Turnschuhe.", "seine", "ihre", "unsere", "eure"], ["Die Kinder spielen. ___ sind im Garten.", "Sie", "Er", "Es", "Wir"], ["Der Baum ist alt. ___ steht hier seit 100 Jahren.", "Er", "Sie", "Es", "Ihr"], ["Wir lieben ___ Katze.", "unsere", "eure", "ihre", "seine"], ["Habt ihr ___ Hausaufgaben gemacht?", "eure", "unsere", "seine", "ihre"], ["Welches Wort ist ein Personalpronomen?", "wir", "unser", "Haus", "schnell"], ["Welches Wort ist ein Possessivpronomen?", "dein", "du", "dich", "dir"], ["Das Velo gehört mir. Es ist ___ Velo.", "mein", "dein", "sein", "ihr"], ["Ersetze «Oma und Opa»:", "sie", "er", "es", "ihr"], ["Ersetze «das Pferd»:", "es", "er", "sie", "wir"], ["Mia und ich gehen ins Kino. ___ freuen uns.", "Wir", "Sie", "Ihr", "Ich"]], write:[["Ersetze «der Lehrer» durch ein Pronomen.", "er"], ["Ersetze «die Lehrerin».", "sie"], ["Ersetze «das Kind».", "es"], ["Das Buch gehört dir. Es ist ___ Buch.", "dein"]] },
    { id:"partikel", no:"Thema 3", title:"Präpositionen und Konjunktionen", de:"Wörter, die zeigen, wo, und Wörter, die verbinden", icon:"🔗", lp:"D.5.D.1", learn:{"tips": ["Präpositionen: auf, unter, neben, hinter, vor, zwischen, in, mit, nach, von, bei.", "Konjunktionen: und, oder, aber, denn, weil, dass, wenn, obwohl.", "Nach «weil», «dass», «wenn» und «obwohl» steht das Verb am Schluss: …, weil es regnet."], "examples": ["Die Katze liegt unter dem Tisch.", "Ich gehe raus, obwohl es kalt ist.", "Willst du Tee oder Saft?"]}, quiz:[["Ich bleibe drinnen, ___ es regnet.", "weil", "obwohl", "aber", "oder"], ["Ich gehe raus, ___ es kalt ist.", "obwohl", "weil", "denn", "und"], ["Willst du Tee ___ Saft?", "oder", "weil", "dass", "obwohl"], ["Ich weiss, ___ du recht hast.", "dass", "das", "weil", "oder"], ["Ich möchte mitkommen, ___ ich bin krank.", "aber", "weil", "dass", "oder"], ["___ es schneit, fahren wir Ski.", "Wenn", "Aber", "Oder", "Denn"], ["Die Lampe hängt ___ dem Tisch.", "über", "unter", "zwischen", "nach"], ["Der Ball liegt ___ den zwei Bäumen.", "zwischen", "auf", "über", "nach"], ["Wir fahren ___ Zürich.", "nach", "über", "unter", "zwischen"], ["Welches Wort ist eine Präposition?", "neben", "weil", "und", "schnell"], ["Welches Wort ist eine Konjunktion?", "weil", "unter", "Tisch", "laufen"], ["Welcher Satz ist richtig?", "Ich bin froh, weil die Sonne scheint.", "Ich bin froh, weil scheint die Sonne.", "Ich bin froh, weil die Sonne gescheint."]], write:[["Ich gehe schlafen, ___ ich müde bin. (Grund)", "weil"], ["Ich glaube, ___ es morgen regnet.", "dass"], ["Möchtest du Pizza ___ Pasta?", "oder"], ["Das Bild hängt ___ dem Sofa. (oberhalb)", "über"]] },
    { id:"zeitf", no:"Thema 4", title:"Zeitformen", de:"Präsens, Präteritum, Perfekt, Futur und Plusquamperfekt", icon:"⏳", gen:"zeit5", choiceOnly:true, labels:{ calc:["⏳","Zeitformen","Erkenne und bilde die Zeitform"] }, lp:"D.5.D.1", learn:{"tips": ["Präsens: Mia spielt. Präteritum: Mia spielte. Perfekt: Mia hat gespielt.", "Futur (Zukunft): wird + Grundform: Mia wird spielen.", "Plusquamperfekt (Vorvergangenheit): was noch früher passiert ist: Mia hatte gespielt, bevor es regnete. Du lernst es erst kennen."], "examples": ["Ich fahre – fuhr – bin gefahren – werde fahren", "Wir lesen – lasen – haben gelesen – werden lesen", "Tim hatte gegessen, bevor er ging."]} },
    { id:"satzgl", no:"Thema 5", title:"Satzglieder", de:"Verschiebeprobe, Subjekt, Prädikat und Objekt", icon:"🧩", gen:"satzgl", choiceOnly:true, labels:{ calc:["🧩","Satzglieder","Subjekt, Prädikat, Objekt und Verschiebeprobe"] }, lp:"D.5.D.1, D.5.A.1", learn:{"tips": ["Verschiebeprobe: Was beim Umstellen zusammenbleibt, ist ein Satzglied. [Der Hund] [jagt] [die Katze]. → [Die Katze] [jagt] [der Hund]? Nein: [Jagt] [der Hund] [die Katze]?", "Prädikat: das Verb (die Personalform). Es steht im Aussagesatz an 2. Stelle.", "Subjekt: Wer oder was tut etwas? Objekt: Wen oder was? / Wem?"], "examples": ["[Mia] [schenkt] [ihrem Bruder] [ein Buch].", "Subjekt: Mia", "Prädikat: schenkt"]} },
    { id:"faelle", no:"Thema 6", title:"Die vier Fälle entdecken", de:"Wer, wen, wem, wessen? Fragen stellen", icon:"❓", lp:"D.5.D.1", learn:{"tips": ["Mit Fragen findest du den Fall eines Nomens heraus.", "Wer oder was? (Nominativ): Der Hund bellt.", "Wen oder was? (Akkusativ): Ich sehe den Hund.", "Wem? (Dativ): Ich gebe dem Hund einen Knochen.", "Wessen? (Genitiv): Das ist der Knochen des Hundes.", "Die Fälle lernst du jetzt kennen. Bestimmen musst du sie erst in der Oberstufe."], "examples": ["der Freund – den Freund – dem Freund – des Freundes"]}, quiz:[["Ich sehe ___ (der Hund).", "den Hund", "dem Hund", "der Hund", "des Hundes"], ["Ich gebe ___ (die Katze) Futter.", "der Katze", "die Katze", "den Katze", "des Katze"], ["___ (der Lehrer) erklärt die Aufgabe.", "Der Lehrer", "Den Lehrer", "Dem Lehrer", "Des Lehrers"], ["Ich helfe ___ (mein Bruder).", "meinem Bruder", "meinen Bruder", "mein Bruder", "meines Bruders"], ["Das ist das Velo ___ (der Nachbar).", "des Nachbarn", "den Nachbarn", "dem Nachbar", "der Nachbar"], ["Mit welcher Frage findest du «den Ball» in «Tim wirft den Ball»?", "Wen oder was?", "Wer oder was?", "Wem?", "Wessen?"], ["Mit welcher Frage findest du «dem Kind» in «Ich schenke dem Kind ein Buch»?", "Wem?", "Wen oder was?", "Wer oder was?", "Wessen?"], ["Mit welcher Frage findest du das Subjekt?", "Wer oder was?", "Wem?", "Wessen?", "Wen oder was?"], ["Wir besuchen ___ (die Oma).", "die Oma", "der Oma", "den Oma", "des Oma"], ["Ich danke ___ (die Lehrerin).", "der Lehrerin", "die Lehrerin", "den Lehrerin", "des Lehrerin"], ["Das ist das Haus ___ (die Familie).", "der Familie", "die Familie", "den Familie", "dem Familie"], ["Ich suche ___ (das Buch).", "das Buch", "dem Buch", "des Buches", "den Buch"]], write:[["Ich sehe ___ Baum. (der)", "den"], ["Ich gebe ___ Mann die Hand. (der)", "dem"], ["___ Katze schläft. (die)", "Die"], ["Ich helfe ___ Frau. (die)", "der"]] },
    { id:"wbild", no:"Thema 7", title:"Wortbildung", de:"Wortstamm, Vorsilben, Nachsilben und zusammengesetzte Wörter", icon:"🧱", lp:"D.5.C.1, D.5.D.1", learn:{"tips": ["Zusammengesetzte Nomen: Haus + Tür = Haustür. Das letzte Wort bestimmt den Artikel: die Tür → die Haustür.", "Vorsilben verändern die Bedeutung: fahren → abfahren, verfahren, erfahren.", "Nachsilben machen aus Adjektiven oder Verben Nomen: frei → die Freiheit, wohnen → die Wohnung, freundlich → die Freundlichkeit.", "Wörter mit -heit, -keit, -ung, -nis schreibst du gross."], "examples": ["Schule + Haus = Schulhaus", "krank → die Krankheit", "hoffen → die Hoffnung"]}, quiz:[["Schnee + Mann = ?", "der Schneemann", "die Schneemann", "das Schneemann", "der Schneemänner"], ["Welcher Artikel passt zu «Haustür»?", "die", "der", "das", "den"], ["frei → die ___", "Freiheit", "Freiung", "Freinis", "Freikeit"], ["wohnen → die ___", "Wohnung", "Wohnheit", "Wohnkeit", "Wohnnis"], ["freundlich → die ___", "Freundlichkeit", "Freundlichheit", "Freundlichung", "Freundlichnis"], ["erleben → das ___", "Erlebnis", "Erlebung", "Erlebheit", "Erlebkeit"], ["Welche Vorsilbe passt? Der Zug ___fährt um 8 Uhr.", "ab", "ver", "be", "zer"], ["Welches Wort gehört NICHT zur Wortfamilie «fahren»?", "Farbe", "Fahrer", "Fahrt", "abfahren"], ["Wie heisst der Wortstamm von «Spieler»?", "spiel", "spie", "ler", "spieler"], ["Welches Wort ist zusammengesetzt?", "Apfelbaum", "Apfel", "Baum", "äpfeln"], ["krank → die ___", "Krankheit", "Krankung", "Kranknis", "Krankkeit"], ["Welche Nachsilbe macht aus «lesen» ein Adjektiv?", "-bar (lesbar)", "-ung (Lesung)", "-er (Leser)", "-heit"]], write:[["Velo + Weg = ?", "Veloweg"], ["hoffen → die ___", "Hoffnung"], ["gesund → die ___", "Gesundheit"], ["Sonne + Blume = ?", "Sonnenblume"]] },
    { id:"gross", no:"Thema 8", title:"Gross- und Kleinschreibung", de:"Nomen, Satzanfang und Nominalisierungen", icon:"🔠", lp:"D.5.E.1", learn:{"tips": ["Gross schreibst du: Satzanfänge, Nomen und Namen.", "Verben und Adjektive können zu Nomen werden. Dann schreibst du sie gross. Signalwörter: das, beim, zum, im, viel, etwas, nichts.", "das Schwimmen, beim Lesen, zum Spielen, etwas Schönes, viel Neues.", "Die Anrede «Sie» schreibst du gross, «du» klein."], "examples": ["Beim Schwimmen ist mir kalt.", "Ich wünsche dir viel Glück und alles Gute.", "Etwas Schönes ist passiert."]}, quiz:[["Welche Schreibweise ist richtig?", "Beim Lesen vergesse ich die Zeit.", "Beim lesen vergesse ich die Zeit.", "beim Lesen vergesse ich die zeit."], ["Welche Schreibweise ist richtig?", "Ich wünsche dir viel Spass beim Tanzen.", "Ich wünsche dir viel Spass beim tanzen.", "Ich Wünsche dir viel spass beim Tanzen."], ["Welche Schreibweise ist richtig?", "Das Laufen macht mir Freude.", "Das laufen macht mir Freude.", "Das Laufen macht mir freude."], ["Welche Schreibweise ist richtig?", "Wir laufen schnell.", "Wir Laufen schnell.", "wir laufen Schnell."], ["Welche Schreibweise ist richtig?", "Ich habe etwas Neues gelernt.", "Ich habe etwas neues gelernt.", "Ich habe Etwas neues gelernt."], ["Welches Signalwort zeigt eine Nominalisierung?", "beim", "und", "sehr", "schnell"], ["«zum (spielen)»: Wie schreibst du es?", "zum Spielen", "zum spielen", "Zum spielen"], ["«das (gute)»: Wie schreibst du es?", "das Gute", "das gute", "Das gute"], ["Welches Wort schreibst du gross? «Ich mag das …»", "Singen", "singen", "sing"], ["Welche Schreibweise ist richtig?", "Können Sie mir helfen?", "Können sie mir helfen?", "können Sie mir Helfen?"], ["Welche Schreibweise ist richtig?", "Im Winter fahren wir Ski.", "Im winter fahren wir ski.", "im Winter Fahren wir Ski."], ["Welche Schreibweise ist richtig?", "Lea liest gern.", "Lea Liest gern.", "lea liest Gern."]], write:[["Schreib richtig: beim (schwimmen)",     { id:"sss", no:"Thema 9", title:"s oder ss? Dehnung und Schärfung", de:"Lange und kurze Vokale hören und richtig schreiben", icon:"🐍", lp:"D.5.E.1", learn:{"tips": ["In der Schweiz schreibt man kein ß, sondern immer ss: die Strasse, gross, der Fuss.", "Kurzer Vokal: oft ss oder doppelter Konsonant: die Klasse, das Wasser, der Ball, die Mutter.", "Langer Vokal: einfacher Konsonant, manchmal mit h oder ie: die Nase, der Hase, fahren, das Tier.", "Sprich das Wort langsam und hör genau: kurz oder lang?"], "examples": ["die Tasse (kurz)", "die Rose (lang)", "der Kuss (kurz)", "die Wiese (lang)"]}, quiz:[["Die Stra_e ist nass.", "ss", "s", "ß"], ["Der Ha_e hoppelt.", "s", "ss", "ß"], ["Wir trinken Wa_er.", "ss", "s", "ß"], ["Die Ro_e blüht.", "s", "ss", "ß"], ["Die Kla_e lacht.", "ss", "s", "ß"], ["Die Na_e läuft.", "s", "ss", "ß"], ["Welches Wort ist richtig geschrieben?", "gross", "groß", "gros"], ["Welches Wort ist richtig geschrieben?", "der Fuss", "der Fuß", "der Fus"], ["Kurzer oder langer Vokal bei «Ball»?", "kurz", "lang", "gar keiner"], ["Kurzer oder langer Vokal bei «Tier»?", "lang", "kurz", "gar keiner"], ["Welches Wort hat ein Dehnungs-h?", "fahren", "Faden", "Farbe"], ["Welches Wort hat einen doppelten Konsonanten?", "Mutter", "Mut", "Mus"]], write:[["Schreib richtig: die Stra_e", "die Strasse|Strasse"], ["Schreib richtig: der Ha_e", "der Hase|Hase"], ["Schreib richtig: das Wa_er", "das Wasser|Wasser"], ["Schreib richtig: gro_", "gross"]], sort:{"bins": ["s", "ss"], "items": [["Ha_e", "s"], ["Na_e", "s"], ["Ro_e", "s"], ["Wie_e", "s"], ["Rie_e", "s"], ["le_en", "s"], ["Mu_ik", "s"], ["Stra_e", "ss"], ["Wa_er", "ss"], ["Kla_e", "ss"], ["Ta_e", "ss"], ["Ku_", "ss"], ["me_en", "ss"], ["Fu_", "ss"]]} },
    { id:"dass", no:"Thema 10", title:"das oder dass? Komma vor Nebensätzen", de:"Ersatzprobe und Komma bei dass, weil, wenn", icon:"✍️", lp:"D.5.E.1, D.4.F.1", learn:{"tips": ["Ersatzprobe: Kannst du «das» durch «dieses» oder «welches» ersetzen, schreibst du «das». Sonst «dass».", "Das Buch, das ich lese, ist spannend. (welches) – Ich hoffe, dass du kommst. (nicht ersetzbar)", "Vor dass, weil, wenn, obwohl steht ein Komma: Ich weiss, dass du müde bist."], "examples": ["Das Haus, das dort steht, ist alt.", "Ich freue mich, dass du da bist.", "Ich gehe nicht raus, weil es regnet."]}, quiz:[["Ich hoffe, ___ du kommst.", "dass", "das"], ["___ Velo gehört mir.", "Das", "Dass"], ["Das Bild, ___ an der Wand hängt, ist schön.", "das", "dass"], ["Ich weiss, ___ du recht hast.", "dass", "das"], ["Er sagt, ___ er Hunger hat.", "dass", "das"], ["Siehst du ___ Pferd?", "das", "dass"], ["Es ist schön, ___ du hier bist.", "dass", "das"], ["Das Spiel, ___ wir spielen, ist lustig.", "das", "dass"], ["Wo steht das Komma richtig?", "Ich glaube, dass es regnet.", "Ich glaube dass, es regnet.", "Ich, glaube dass es regnet."], ["Wo steht das Komma richtig?", "Wir bleiben drinnen, weil es stürmt.", "Wir bleiben drinnen weil, es stürmt.", "Wir, bleiben drinnen weil es stürmt."], ["Wo steht das Komma richtig?", "Wenn es schneit, bauen wir einen Schneemann.", "Wenn es schneit bauen, wir einen Schneemann.", "Wenn, es schneit bauen wir einen Schneemann."], ["Welches Wort kann «das» in «Das Buch, das ich lese» ersetzen?", "welches", "dass", "weil"]], write:[["Ich freue mich, ___ du kommst.", "dass"], ["___ Wetter ist schön.", "Das"], ["Ich weiss, ___ es stimmt.", "dass"], ["Das Lied, ___ wir singen, ist neu.", "das"]] },
    { id:"rede", no:"Thema 11", title:"Direkte Rede", de:"Anführungszeichen, Doppelpunkt und Redebegleitsatz", icon:"💬", lp:"D.5.E.1", learn:{"tips": ["Was jemand sagt, steht in Anführungszeichen: «Komm her!»", "Steht der Begleitsatz vorne, folgt ein Doppelpunkt: Mia ruft: «Komm her!»", "Steht der Begleitsatz hinten, folgt ein Komma: «Komm her», ruft Mia.", "Fragezeichen und Ausrufezeichen bleiben in den Anführungszeichen: «Kommst du?», fragt Tim."], "examples": ["Lea sagt: «Ich habe Hunger.»", "«Ich habe Hunger», sagt Lea.", "«Wo bist du?», fragt Papa."]}, quiz:[["Welche Schreibweise ist richtig?", "Tim sagt: «Ich komme mit.»", "Tim sagt, «Ich komme mit.»", "Tim sagt «Ich komme mit»."], ["Welche Schreibweise ist richtig?", "«Ich komme mit», sagt Tim.", "«Ich komme mit.» sagt Tim.", "«Ich komme mit»: sagt Tim."], ["Welche Schreibweise ist richtig?", "«Kommst du?», fragt Mia.", "«Kommst du», fragt Mia?", "«Kommst du?» fragt Mia."], ["Welches Zeichen folgt, wenn der Begleitsatz vorne steht?", "ein Doppelpunkt", "ein Komma", "ein Punkt"], ["Welches Zeichen folgt nach der Rede, wenn der Begleitsatz hinten steht?", "ein Komma", "ein Doppelpunkt", "ein Strichpunkt"], ["Was ist der Begleitsatz in «Mama ruft: «Essen ist fertig!»»?", "Mama ruft", "Essen ist fertig", "ruft: Essen"], ["Welches Verb passt als Begleitverb für eine Frage?", "fragen", "antworten", "rufen"], ["Welche Schreibweise ist richtig?", "Oma fragt: «Hast du Hunger?»", "Oma fragt, «Hast du Hunger?»", "Oma fragt: «Hast du Hunger»?"], ["Welche Anführungszeichen benutzt man in der Schweiz?", "« »", "„ “", "\" \" nur"], ["Welche Schreibweise ist richtig?", "«Pass auf!», ruft der Lehrer.", "«Pass auf», ruft der Lehrer!", "«Pass auf!» ruft der Lehrer."], ["Welches Wort ist ein Redebegleitverb?", "flüstern", "laufen", "essen"], ["Was steht in Anführungszeichen?", "das, was jemand sagt", "der Name", "der Begleitsatz"]], write:[["Welches Zeichen fehlt? Lea sagt___ «Hallo!» (Name des Zeichens)", "Doppelpunkt"], ["«Ich     { id:"landsch", no:"Thema 2", title:"Landschaften der Schweiz", de:"Jura, Mittelland und Alpen", icon:"⛰️", lp:"NMG.8.1, NMG.8.2", learn:{"tips": ["Die Schweiz hat drei grosse Landschaften: Jura, Mittelland und Alpen.", "Die Alpen bedecken etwa 60 % der Fläche, das Mittelland etwa 30 %, der Jura etwa 10 %.", "Im Mittelland wohnen die meisten Menschen. Dort gibt es viele Städte, Bauernhöfe und Verkehrswege.", "Der höchste Berg der Schweiz ist die Dufourspitze (4'634 m) im Wallis."], "examples": ["Jura: Chasseral, Weissenstein", "Mittelland: Bern, Zürich, Aarau", "Alpen: Säntis, Matterhorn, Jungfrau"]}, quiz:[["Welche Landschaft bedeckt die grösste Fläche der Schweiz?", "die Alpen", "das Mittelland", "der Jura", "das Tessin"], ["Wo wohnen die meisten Menschen?", "im Mittelland", "in den Alpen", "im Jura", "am Bodensee"], ["Wie heisst der höchste Berg der Schweiz?", "Dufourspitze", "Matterhorn", "Säntis", "Eiger"], ["In welchem Kanton steht das Matterhorn?", "Wallis", "Graubünden", "Bern", "Uri"], ["Welche Landschaft liegt im Nordwesten der Schweiz?", "der Jura", "die Alpen", "das Engadin", "das Rheintal"], ["Was gibt es im Mittelland besonders viel?", "Städte, Felder und Strassen", "Gletscher", "Vulkane", "Wüsten"], ["Wie hoch ist der Säntis ungefähr?", "2'502 m", "4'478 m", "1'200 m", "3'970 m"], ["Zu welcher Landschaft gehört der Chasseral?", "Jura", "Alpen", "Mittelland", "Voralpen am Bodensee"], ["Etwa wie viel Prozent der Schweiz sind Alpen?", "60 %", "10 %", "30 %", "90 %"], ["Welche Landschaft ist am kleinsten?", "der Jura", "die Alpen", "das Mittelland", "alle gleich"], ["Was bildet sich in den Alpen aus Schnee und Eis?", "Gletscher", "Dünen", "Vulkane", "Korallen"], ["Wo liegt das Mittelland?", "zwischen Jura und Alpen", "südlich der Alpen", "im Tessin", "im Engadin"]], write:[["Die drei Landschaften: Jura, Mittelland und …", "Alpen"], ["Höchster Berg der Schweiz:", "Dufourspitze"], ["In welcher Landschaft wohnen die meisten Menschen?", "Mittelland|im Mittelland"], ["Hausberg der Ostschweiz mit Wetterstation:", "Säntis"]], sort:{"bins": ["Jura", "Mittelland", "Alpen"], "items": [["Chasseral", "Jura"], ["Weissenstein", "Jura"], ["La Chaux-de-Fonds", "Jura"], ["Delsberg (Delémont)", "Jura"], ["Bern", "Mittelland"], ["Zürich", "Mittelland"], ["Aarau", "Mittelland"], ["Lausanne", "Mittelland"], ["Säntis", "Alpen"], ["Matterhorn", "Alpen"], ["Jungfrau", "Alpen"], ["Pizol", "Alpen"], ["Davos", "Alpen"]]} },
    { id:"gewaesser", no:"Thema 3", title:"Gewässer der Schweiz", de:"Flüsse, Seen und das Wasserschloss Europas", icon:"🌊", lp:"NMG.8.1, NMG.2.1", learn:{"tips": ["Die Schweiz heisst «Wasserschloss Europas»: Hier entspringen grosse Flüsse wie Rhein und Rhone.", "Der Rhein fliesst in die Nordsee, die Rhone ins Mittelmeer, der Inn über die Donau ins Schwarze Meer, der Ticino über den Po in die Adria.", "Der längste Fluss ganz in der Schweiz ist die Aare. Der grösste See ganz in der Schweiz ist der Neuenburgersee.", "Der Genfersee ist der grösste See am Rand der Schweiz. Der Rheinfall bei Schaffhausen ist einer der wasserreichsten Wasserfälle Europas."], "examples": ["Rhein → Nordsee", "Rhone → Mittelmeer", "Aare: längster Schweizer Fluss"]}, quiz:[["In welches Meer fliesst der Rhein?", "Nordsee", "Mittelmeer", "Schwarzes Meer", "Ostsee"], ["In welches Meer fliesst die Rhone?", "Mittelmeer", "Nordsee", "Ostsee", "Atlantik"], ["Welcher ist der längste Fluss ganz in der Schweiz?", "Aare", "Rhein", "Reuss", "Thur"], ["Welcher ist der grösste See ganz in der Schweiz?", "Neuenburgersee", "Genfersee", "Bodensee", "Walensee"], ["Wo ist der Rheinfall?", "bei Schaffhausen", "bei Basel", "bei Chur", "bei St. Gallen"], ["Warum heisst die Schweiz «Wasserschloss Europas»?", "Hier entspringen grosse Flüsse.", "Es gibt viele Schlösser am Wasser.", "Es regnet jeden Tag.", "Es gibt ein Meer."], ["Durch welche Stadt fliesst die Aare?", "Bern", "Zürich", "Lugano", "St. Gallen"], ["Der Inn fliesst über die Donau ins …", "Schwarze Meer", "Mittelmeer", "Nordsee", "Rote Meer"], ["An welchem See liegt Genf?", "Genfersee", "Zürichsee", "Thunersee", "Lago Maggiore"], ["An welchem See liegt Luzern?", "Vierwaldstättersee", "Zugersee", "Bielersee", "Walensee"], ["Welcher Fluss fliesst durch Basel?", "Rhein", "Aare", "Rhone", "Limmat"], ["Welcher Fluss fliesst durch Zürich?", "Limmat", "Thur", "Rhone", "Inn"]], write:[["Längster Fluss ganz in der Schweiz:", "Aare"], ["Der Rhein fliesst in die …", "Nordsee"], ["Berühmter Wasserfall bei Schaffhausen:", "Rheinfall|der Rheinfall"], ["Fluss durch Genf und das Wallis:", "Rhone"]], sort:{"bins": ["Fluss", "See"], "items": [["Rhein", "Fluss"], ["Rhone", "Fluss"], ["Aare", "Fluss"], ["Reuss", "Fluss"], ["Limmat", "Fluss"], ["Inn", "Fluss"], ["Thur", "Fluss"], ["Genfersee", "See"], ["Neuenburgersee", "See"], ["Vierwaldstättersee", "See"], ["Zürichsee", "See"], ["Lago Maggiore", "See"], ["Walensee", "See"]]} },
    { id:"mittelalter", no:"Thema 4", title:"Mittelalter: Burgen und Ritter", de:"Leben auf der Burg, Ritter, Bauern und Stände", icon:"🏰", lp:"NMG.9.2, NMG.9.3", learn:{"tips": ["Das Mittelalter dauerte etwa von 500 bis 1500.", "Die Gesellschaft hatte Stände: Adel (Ritter, Burgherren), Geistliche (Mönche, Nonnen) und Bauern. Die meisten Menschen waren Bauern.", "Teile einer Burg: Bergfried (Hauptturm), Palas (Wohngebäude), Ringmauer, Burggraben und Zugbrücke.", "Ein Ritter wurde zuerst Page, dann Knappe und mit dem Ritterschlag Ritter."], "examples": ["Page → Knappe → Ritter", "Bergfried = höchster Turm", "Bauern gaben dem Grundherrn einen Teil der Ernte (Zehnten)"]}, quiz:[["Von wann bis wann dauerte das Mittelalter etwa?", "500 bis 1500", "100 bis 300", "1800 bis 1900", "1500 bis 1800"], ["Wie heisst der höchste Turm einer Burg?", "Bergfried", "Palas", "Zinne", "Kapelle"], ["Was ist der Palas?", "das Wohngebäude der Burg", "der Burggraben", "der Kerker", "die Mauer"], ["Welche Reihenfolge stimmt?", "Page – Knappe – Ritter", "Knappe – Page – Ritter", "Ritter – Knappe – Page", "Page – Ritter – Knappe"], ["Welcher Stand war am grössten?", "die Bauern", "der Adel", "die Geistlichen", "die Könige"], ["Wer lebte in einem Kloster?", "Mönche und Nonnen", "Ritter", "Bauern", "Händler"], ["Wozu diente der Burggraben?", "zum Schutz vor Angreifern", "zum Baden", "zum Fischen für den König", "als Strasse"], ["Was bekam der Grundherr von den Bauern?", "einen Teil der Ernte", "Geld vom Staat", "nichts", "Ritterrüstungen"], ["Was ist eine Zugbrücke?", "eine Brücke, die man hochziehen kann", "eine Brücke für Züge", "ein Turm", "ein Tor in der Stadt"], ["Womit kämpfte ein Ritter?", "mit Schwert, Lanze und Schild", "mit Gewehren", "mit Kanonen", "mit Pfeil und Bogen nur"], ["Was war ein Turnier?", "ein Wettkampf der Ritter", "ein Markt", "ein Gottesdienst", "ein Fest der Bauern"], ["Wo wohnten die Bauern?", "in einfachen Häusern im Dorf", "auf der Burg", "im Kloster", "in Palästen"]], write:[["Höchster Turm der Burg:", "Bergfried|der Bergfried"], ["Ein junger Ritter in Ausbildung (nach dem Pagen) heisst …", "Knappe|der Knappe"], ["Die drei Stände: Adel, Geistliche und …", "Bauern|die Bauern"], ["Das Mittelalter endete etwa im Jahr …", "1500"]], sort:{"bins": ["Adel", "Geistliche", "Bauern"], "items": [["Ritter", "Adel"], ["Burgherr", "Adel"], ["Burgfräulein", "Adel"], ["Graf", "Adel"], ["Mönch", "Geistliche"], ["Nonne", "Geistliche"], ["Abt", "Geistliche"], ["Pfarrer", "Geistliche"], ["Bäuerin", "Bauern"], ["Knecht", "Bauern"], ["Magd", "Bauern"], ["Hirte", "Bauern"]]} },
    { id:"kloster", no:"Thema 5", title:"Kloster und Stadt im Mittelalter", de:"Kloster St.Gallen, Handwerk, Markt und Zünfte", icon:"⛪", lp:"NMG.9.2, NMG.9.3", learn:{"tips": ["Im Jahr 612 kam der Mönch Gallus ins Steinachtal. 719 gründete Otmar dort ein Kloster.", "Im Kloster wurde gebetet, gearbeitet und geschrieben. Mönche schrieben Bücher von Hand ab. Viele davon liegen heute in der Stiftsbibliothek.", "Der Stiftsbezirk St.Gallen gehört seit 1983 zum UNESCO-Welterbe.", "Mittelalterliche Städte hatten eine Stadtmauer, Tore, einen Markt und Handwerker. Handwerker schlossen sich in Zünften zusammen.", "St.Gallen wurde mit Leinwand (Stoff aus Flachs) bekannt."], "examples": ["612: Gallus", "719: Klostergründung durch Otmar", "1983: UNESCO-Welterbe", "Leinwand aus St.Gallen"]}, quiz:[["Wer gründete 719 das Kloster St.Gallen?", "Otmar", "Gallus", "Karl der Grosse", "Wilhelm Tell"], ["Wann kam Gallus ins Steinachtal?", "612", "1291", "1803", "1500"], ["Was machten Mönche im Kloster unter anderem?", "Bücher von Hand abschreiben", "Autos bauen", "Zeitungen drucken", "Ritterturniere veranstalten"], ["Wie heisst die berühmte Bibliothek in St.Gallen?", "Stiftsbibliothek", "Nationalbibliothek", "Stadtbibliothek Bern", "Klosterkino"], ["Seit wann ist der Stiftsbezirk UNESCO-Welterbe?", "1983", "1291", "2010", "1848"], ["Was ist eine Zunft?", "ein Zusammenschluss von Handwerkern", "ein Turm", "ein Gebet", "eine Burg"], ["Wozu hatten Städte eine Stadtmauer?", "zum Schutz", "als Schmuck", "für Werbung", "zum Klettern"], ["Womit wurde St.Gallen im Mittelalter bekannt?", "mit Leinwand (Stoff)", "mit Uhren", "mit Schokolade", "mit Autos"], ["Woraus macht man Leinwand?", "aus Flachs", "aus Plastik", "aus Gold", "aus Holz"], ["Was gab es auf dem Markt?", "Waren zum Tauschen und Kaufen", "nur Bücher", "Autos", "Computer"], ["Wer schrieb im Kloster?", "Mönche", "Bauern", "Ritter", "Kinder der Stadt"], ["Welcher Satz über Gallus stimmt?", "Er war ein Mönch aus Irland.", "Er war ein König.", "Er war ein Ritter aus Bern.", "Er baute die Stadtmauer."]], write:[["Gründer des Klosters St.Gallen (719):", "Otmar"], ["Berühmte Bibliothek im Stiftsbezirk:", "Stiftsbibliothek|die Stiftsbibliothek"], ["Zusammenschluss von Handwerkern:", "Zunft|die Zunft"], ["Stoff, mit dem St.Gallen bekannt wurde:", "Leinwand|die Leinwand"]] },
    { id:"eidgen", no:"Thema 6", title:"Entstehung der Eidgenossenschaft", de:"Bundesbrief, Sagen und Geschichte", icon:"📜", lp:"NMG.9.3, NMG.9.4", learn:{"tips": ["1291 schlossen Uri, Schwyz und Unterwalden einen Bund. Der Bundesbrief liegt heute im Bundesbriefmuseum in Schwyz.", "Die Geschichte von Wilhelm Tell und dem Rütlischwur sind Sagen. Sie erzählen von Freiheit, sind aber nicht sicher belegt.", "Belegt sind zum Beispiel die Schlachten am Morgarten (1315) und bei Sempach (1386) gegen die Habsburger.", "Der Name «Schweiz» kommt vom Kanton Schwyz. Der 1. August ist der Nationalfeiertag."], "examples": ["1291: Bundesbrief", "Uri, Schwyz, Unterwalden", "1315: Morgarten"]}, quiz:[["Welche Orte schlossen 1291 einen Bund?", "Uri, Schwyz und Unterwalden", "Zürich, Bern und Luzern", "Genf, Waadt und Wallis", "St.Gallen, Thurgau und Appenzell"], ["Wo liegt der Bundesbrief heute?", "in Schwyz", "in Bern", "in Zürich", "in Genf"], ["Wilhelm Tell ist …", "eine Sagenfigur", "ein Bundesrat", "ein Ritter aus St.Gallen", "ein Mönch"], ["Gegen wen kämpften die Eidgenossen am Morgarten?", "die Habsburger", "die Römer", "die Franzosen", "die Appenzeller"], ["Wann war die Schlacht am Morgarten?", "1315", "1291", "1515", "1803"], ["Woher kommt der Name «Schweiz»?", "vom Kanton Schwyz", "vom Wort «Schweiss»", "vom Fluss Schweizach", "von einem König"], ["Wann ist der Nationalfeiertag?", "am 1. August", "am 1. Mai", "am 25. Dezember", "am 1. Januar"], ["Auf welcher Wiese soll der Rütlischwur stattgefunden haben?", "Rütli", "Morgarten", "Sempach", "Säntis"], ["Wen soll Wilhelm Tell mit der Armbrust besiegt haben?", "den Vogt Gessler", "Karl den Grossen", "Napoleon", "Gallus"], ["Was ist ein Unterschied zwischen Sage und Geschichte?", "Geschichte ist mit Quellen belegt.", "Sagen sind immer wahr.", "Geschichte ist erfunden.", "Es gibt keinen Unterschied."], ["Wann war die Schlacht bei Sempach?", "1386", "1291", "1415", "1648"], ["Welches Dokument gilt als «Gründungsurkunde»?", "der Bundesbrief", "die Bibel", "der Klosterplan", "das Rütlilied"]], write:[["Jahr des Bundesbriefs:", "1291"], ["Sagenheld mit der Armbrust:", "Wilhelm Tell|Tell"], ["Nationalfeiertag der Schweiz: der 1. …", "August"], ["Der Name Schweiz kommt vom Kanton …", "Schwyz"]], sort:{"bins": ["Sage", "belegte Geschichte"], "items": [["Tells Apfelschuss", "Sage"], ["Der Rütlischwur", "Sage"], ["Tell besiegt Gessler", "Sage"], ["Die Teufelsbrücke", "Sage"], ["Der Bundesbrief von 1291", "belegte Geschichte"], ["Schlacht am Morgarten 1315", "belegte Geschichte"], ["Schlacht bei Sempach 1386", "belegte Geschichte"], ["St.Gallen wird 1803 Kanton", "belegte Geschichte"]]} },
    { id:"pubertaet", no:"Thema 7", title:"Körper und Pubertät", de:"Wachsen, sich verändern und gut für sich sorgen", icon:"🌱", lp:"NMG.1.2, NMG.1.6", learn:{"tips": ["In der Pubertät wird der Körper erwachsen. Sie beginnt bei allen zu einer anderen Zeit, oft zwischen 9 und 14 Jahren.", "Hormone (Botenstoffe im Körper) steuern die Veränderungen: Man wächst schneller, Haare wachsen unter den Achseln und im Intimbereich.", "Bei Mädchen wachsen die Brüste und die Menstruation (Periode) beginnt. Bei Jungen wird die Stimme tiefer (Stimmbruch).", "Man schwitzt mehr: Tägliches Waschen und Deo helfen. Auch Gefühle können stärker schwanken. Das ist normal.", "Fragen darf man immer stellen: den Eltern, einer Lehrperson oder in der Schulsozialarbeit."], "examples": ["Hormone steuern die Pubertät", "Stimmbruch bei Jungen", "Periode bei Mädchen", "Jede und jeder hat ein eigenes Tempo"]}, quiz:[["Was steuert die Veränderungen in der Pubertät?", "Hormone", "Vitamine", "Muskeln", "Knochen"], ["Wann beginnt die Pubertät?", "bei allen zu einer anderen Zeit", "immer genau mit 10 Jahren", "erst mit 18", "nie"], ["Was passiert bei Jungen in der Pubertät?", "Die Stimme wird tiefer.", "Die Zähne fallen aus.", "Sie werden kleiner.", "Die Haare werden weiss."], ["Was beginnt bei Mädchen in der Pubertät?", "die Menstruation (Periode)", "der Stimmbruch", "das Milchzahnwechseln", "der Bartwuchs"], ["Was hilft gegen Schweissgeruch?", "täglich waschen und frische Kleider", "weniger trinken", "nicht mehr Sport machen", "nie duschen"], ["Was ist in der Pubertät normal?", "Gefühle können stärker schwanken.", "Man muss immer fröhlich sein.", "Man darf keine Fragen stellen.", "Alle verändern sich gleich schnell."], ["Wen kannst du bei Fragen zur Pubertät fragen?", "Eltern oder eine Lehrperson", "niemanden", "nur Fremde im Internet", "nur Gleichaltrige"], ["Was wächst in der Pubertät unter den Achseln?", "Haare", "Federn", "Schuppen", "nichts"], ["Was bedeutet «Körpergrenzen respektieren»?", "Niemand darf dich ohne dein Einverständnis berühren.", "Man darf alle umarmen.", "Grenzen gibt es nur in Ländern.", "Man muss alles zeigen."], ["Wie oft sollte man in der Pubertät duschen oder sich waschen?", "täglich", "einmal im Monat", "nie", "nur im Sommer"]], write:[["Botenstoffe, die die Pubertät steuern:", "Hormone|die Hormone"], ["Wenn die Stimme bei Jungen tiefer wird:", "Stimmbruch|der Stimmbruch"], ["Andere Wort für Periode:", "Menstruation|die Menstruation"], ["Das hilft gegen Schweissgeruch: täglich …", "waschen|duschen"]] },
    { id:"ernaehrung", no:"Thema 8", title:"Ernährung und Gesundheit", de:"Lebensmittelpyramide, Nährstoffe und gesunde Pausen", icon:"🥗", lp:"NMG.1.3, NMG.6.3", learn:{"tips": ["Die Schweizer Lebensmittelpyramide zeigt, wie viel wir von welchen Lebensmitteln essen sollten.", "Unten: Wasser und ungesüsster Tee (1 bis 2 Liter täglich). Dann Gemüse und Früchte (5 Portionen am Tag).", "Getreide, Kartoffeln und Hülsenfrüchte geben Energie (Kohlenhydrate). Milchprodukte, Fleisch, Fisch, Eier und Tofu liefern Eiweiss.", "Öle und Nüsse in kleinen Mengen. Ganz oben: Süsses und Salziges nur ab und zu."], "examples": ["5 am Tag: 3 Gemüse, 2 Früchte", "Wasser ist das beste Getränk", "Süsses: ab und zu"]}, quiz:[["Was steht ganz unten in der Lebensmittelpyramide?", "Getränke wie Wasser", "Süssigkeiten", "Fleisch", "Öl"], ["Wie viele Portionen Gemüse und Früchte sollte man pro Tag essen?", "5", "1", "10", "0"], ["Was steht ganz oben in der Pyramide?", "Süsses und Salziges", "Gemüse", "Wasser", "Brot"], ["Welches Lebensmittel liefert viel Eiweiss?", "Eier", "Zucker", "Apfelsaft", "Gurke"], ["Welches Lebensmittel liefert viele Kohlenhydrate?", "Teigwaren", "Butter", "Wasser", "Salat"], ["Wie viel sollte ein Kind etwa trinken?", "1 bis 2 Liter am Tag", "ein Glas pro Woche", "5 Liter am Tag", "nichts"], ["Was ist ein gesunder Znüni?", "ein Apfel und ein Vollkornbrot", "Chips und Cola", "Schokoriegel", "Gummibärchen"], ["Wozu braucht der Körper Kohlenhydrate?", "für Energie", "für die Haarfarbe", "gegen Sonnenbrand", "zum Schlafen"], ["Welches Getränk ist am gesündesten?", "Wasser", "Eistee", "Cola", "Sirup"], ["Wozu braucht der Körper Eiweiss?", "für Muskeln und Wachstum", "für schlechte Laune", "für Zahnschmerzen", "für nichts"], ["Was gehört zu den Hülsenfrüchten?", "Linsen", "Äpfel", "Reis", "Käse"], ["Was hilft neben gutem Essen der Gesundheit?", "Bewegung und genug Schlaf", "den ganzen Tag sitzen", "wenig schlafen", "nur Süsses"]], write:[["Das beste Getränk gegen Durst:", "Was     { id:"lebensr", no:"Thema 9", title:"Lebensräume: Wiese, Hecke und Weiher", de:"Pflanzen und Tiere, Nahrungsketten", icon:"🐸", lp:"NMG.2.1, NMG.2.2, NMG.2.6", learn:{"tips": ["Ein Lebensraum bietet Tieren und Pflanzen Nahrung, Wasser, Schutz und Platz für die Jungen.", "In einer Nahrungskette frisst ein Lebewesen das andere: Löwenzahn → Grashüpfer → Frosch → Storch.", "Pflanzen stehen am Anfang jeder Nahrungskette. Sie brauchen Licht, Wasser und Nährstoffe.", "Hecken sind wichtig für Vögel, Igel und Insekten. Im Weiher leben Frösche, Libellenlarven und Molche."], "examples": ["Gras → Heuschrecke → Igel", "Alge → Kaulquappe → Fisch", "Hecke = Versteck und Futter"]}, quiz:[["Was steht am Anfang jeder Nahrungskette?", "eine Pflanze", "ein Raubtier", "ein Pilz", "der Mensch"], ["Welches Tier lebt im Weiher?", "der Molch", "der Maulwurf", "die Feldmaus", "der Specht"], ["Wie heisst die Larve des Frosches?", "Kaulquappe", "Raupe", "Made", "Puppe"], ["Was bietet eine Hecke den Tieren?", "Versteck und Nahrung", "nur Schatten für Menschen", "gar nichts", "Strom"], ["Welche Nahrungskette stimmt?", "Gras → Heuschrecke → Frosch", "Frosch → Gras → Heuschrecke", "Heuschrecke → Frosch → Gras", "Gras → Frosch → Heuschrecke"], ["Was brauchen Pflanzen zum Wachsen?", "Licht, Wasser und Nährstoffe", "nur Dunkelheit", "Zucker und Salz", "Plastik"], ["Wo lebt die Libellenlarve?", "im Wasser", "im Boden", "auf Bäumen", "im Haus"], ["Welches Tier frisst Insekten in der Wiese?", "die Spitzmaus", "die Kuh", "das Schaf", "das Pferd"], ["Was passiert, wenn man eine Wiese oft mäht?", "Weniger Blumen und Insekten können leben.", "Es gibt mehr Blumen.", "Nichts.", "Es wachsen Bäume."], ["Was ist ein Lebensraum?", "ein Ort, an dem Tiere und Pflanzen leben", "ein Zimmer", "eine Stadt nur für Menschen", "ein Zoo"], ["Welche Pflanze wächst im Weiher?", "die Seerose", "die Sonnenblume", "der Kaktus", "die Tanne"], ["Wer frisst den Frosch?", "der Storch", "die Heuschrecke", "die Mücke", "das Gras"] function flash(dir, onlyHard){
  stop();
  const u = NAV.u;
  const deck = shuffle(onlyHard ? hardWords(u) : u.words);
  let queue = deck.slice(), done = 0;
  const total = deck.length;
  const draw = () => {
    if (!queue.length) return flashDone(dir, onlyHard, total);
    const w = queue[0], front = dir === 'fwd' ? w.en : w.de, back = dir === 'fwd' ? w.de : w.en;
    app.innerHTML = bar(done, total, `${done} von ${total} Karten geschafft`) + `<div class="card center flash">
      <div class="word">${esc(front)}</div>
      <div id="back" hidden><div class="line"></div><div class="word2">${esc(back)}</div><div class="pic">${w.pic}</div></div>
      <div class="row">${canSpeak() && dir === 'fwd' ? '<button class="btn" id="say">🔊 Anhören</button>' : ''}<button class="btn primary" id="flip">Umdrehen</button></div>
      <div class="row" id="rate" hidden>${canSpeak() && dir === 'rev' ? '<button class="btn" id="say2">🔊 Anhören</button>' : ''}<button class="btn again" id="again">↺ Nochmal</button><button class="btn good" id="know">✓ Kann ich</button></div>
    </div>`;
    if (dir === 'fwd') speak(w.en, .85);
    if ($('#say')) $('#say').onclick = () => speak(w.en, .85);
    $('#flip').onclick = () => {
      $('#back').hidden = false; $('#rate').hidden = false; $('#flip').hidden = true;
      if (dir === 'rev') { speak(w.en, .85); $('#say2') && ($('#say2').onclick = () => speak(w.en, .85)); }
      $('#know').focus();
    };
    $('#know').onclick = () => { markWord(w, 1); queue.shift(); done++; draw(); };
    $('#again').onclick = () => { markWord(w, 0); queue.push(queue.shift()); draw(); };
  };
  draw();
}

function numOptions(ans){
  const mag = Math.max(1, Math.pow(10, Math.floor(Math.log10(Math.max(ans, 1))) - 1));
  const d = [1,-1,2,-2,10,-10,100,-100,1000,-1000,mag,-mag,2*mag,-2*mag].filter(x => Math.abs(x) <= Math.max(ans, 10));
  const s = new Set([ans]); let guard = 0;
  while (s.size < 4 && guard++ < 200) { const v = ans + pick(d); if (v >= 0) s.add(v); }
  return shuffle([...s]);
}
function fromGen(g, asChoice){
  const sol = g.sol || g.q.replace('?', typeof g.answer === 'number' ? fmt(g.answer) : g.answer);
  const text = g.html || esc(g.q);
  if (g.options || (asChoice && g.choices)) {
    const options = g.choices && !g.options
      ? shuffle([g.answer, ...g.choices]).map(o => ({ label:o, ok: o === g.answer }))
      : g.options
      ? (g.fixed ? g.options : shuffle(g.options)).map(o => ({ label:o, ok: o === g.answer }))
      : numOptions(g.answer).map(v => ({ label:fmt(v) + (g.unit ? ' ' + g.unit : ''), ok: v === g.answer }));
    return { kind:'choice', prompt: g.prompt || 'Welche Zahl stimmt?', text, plain:g.q, options, solution:sol };
  }
  if (asChoice) return { kind:'choice', prompt: g.prompt || 'Welche Zahl stimmt?', text, plain:g.q, solution:sol,
    options: numOptions(g.answer).map(v => ({ label:fmt(v) + (g.unit ? ' ' + g.unit : ''), ok: v === g.answer })) };
  if (typeof g.answer === 'string') return { kind:'input', numeric:false, uml:!!g.uml, dec:!!g.dec, cs: g.dec ? false : undefined, prompt: g.prompt || 'Schreib:', text, plain:g.q, answer:g.answer, alts:g.alts, im:g.im, unit:g.unit, solution:sol };
  return { kind:'input', numeric:true, prompt: g.prompt || 'Rechne:', text, plain:g.q, answer:String(g.answer), solution:sol, unit:g.unit };
}
function qItem(it){ const [q, a, ...w] = it;
  return { kind:'choice', prompt:'Wähle die richtige Antwort.', text:esc(q), plain:q, options:shuffle([a, ...w]).map(o => ({ label:o, ok: o === a })), solution:a }; }
function wItem(it){ const alts = String(it[1]).split('|');
  if (it[2]) { const sp = canSpeak(); // Diktat: Wort wird vorgelesen
    return { kind:'input', numeric:false, uml:true, prompt: sp ? 'Hör gut zu und schreib das Wort.' : 'Schreib das Wort ab und merk es dir.', text: sp ? '🎧' : esc(it[2]), plain:'Diktat', say: sp ? it[2] : null, autoSay:true, answer:alts[0], alts, solution:alts[0] }; }
  return { kind:'input', numeric:false, uml:true, prompt:'Schreib die Antwort.', text:esc(it[0]), plain:it[0], answer:alts[0], alts, solution:alts[0] }; }
const B = {
  vocab: (w,u) => {
    const toDe = Math.random() < .5;
    const others = u.words.filter(x => x !== w && x.de !== w.de && x.en !== w.en);
    const same = others.filter(x => w.cat && x.cat === w.cat);
    const pool = shuffle(same.length >= 3 ? same : others).slice(0,3);
    return { kind:'choice', prompt: toDe ? 'Was heisst das auf Deutsch?' : 'Wie heisst das auf ' + NAV.s.name + '?',
      text:esc(toDe ? w.en : w.de), say: toDe ? w.en : null,
      options: shuffle([w, ...pool]).map(x => ({ label: toDe ? x.de : x.en, ok: x === w })),
      solution: toDe ? w.de : w.en, after:w.en, word:w };
  },
  listen: (w,u) => {
    const L = u.words.filter(x => !x.nl);
    const pool = shuffle(L.filter(x => x !== w && x.pic !== w.pic)).slice(0,3);
    return { kind:'choice', prompt:'Hör gut zu! Welches Bild passt?', say:w.en, autoSay:true, grid:'pics',
      options: shuffle([w, ...pool]).map(x => ({ label:x.pic, big:true, ok: x === w })),
      solution:`${w.pic} ${w.en} = ${w.de}`, word:w };
  },
  write: w => ({ kind:'input', prompt:'Schreib das Wort auf ' + NAV.s.name + ':', text:esc(w.de), answer:w.en, solution:w.en, after:w.en, word:w }),
  writeDe: w => { const a = deAlts(w); return { kind:'input', prompt:'Schreib das Wort auf Deutsch. Achte auf Gross- und Kleinschreibung:', text:esc(w.en), say:w.en,
    answer:a[0], alts:a, solution:a.join(' / '), cs:true, deart:true, uml:true, word:w }; },
  spell: w => ({ kind:'spell', prompt:'Hör zu: Das Wort wird buchstabiert. Setz es zusammen!', hint:'Auf Deutsch: ' + w.de, word:w, answer:w.en, solution:w.en, after:w.en }),
  gap: s => ({ kind:'choice', prompt:'Welches Wort passt in die Lücke?',
    text: esc(s.s).replace('___', '<span class="gap">___</span>'),
    options: shuffle(s.o).map(o => ({ label:o, ok: o === s.a })), solution: s.s.replace('___', s.a), note:s.de, after: s.s.replace('___', s.a) }),
  letter: () => {
    const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), c = pick(L);
    const tricky = { A:'EIR', E:'IAY', I:'EAY', G:'JQ', J:'GYK', Y:'IWJ', R:'AHE', H:'RAK', V:'WBF', W:'VUY', U:'WYQ', Q:'KUG', K:'QCJ', C:'SKZ', Z:'CSX', S:'CZX', B:'PVD', P:'BDT' };
    const cand = [...(tricky[c] || '').split(''), ...shuffle(L)].filter((x,i,a) => x !== c && a.indexOf(x) === i).slice(0,3);
    return { kind:'choice', prompt:'Welchen Buchstaben hörst du?', say:letterName(c), autoSay:true, grid:'pics',
      options: shuffle([c, ...cand]).map(x => ({ label:x, big:true, ok: x === c })), solution:c };
  },
  calc: u => fromGen(GEN[u.gen](), false),
  blitz: u => fromGen(GEN[u.gen](), true)
};

function practiceTypes(u){
  const t = [];
  if (u.words.length) {
    t.push({ k:'vocab', icon:'🔤', name:'Wörter-Quiz', desc: NAV.s.name + ' und Deutsch' });
    if (canSpeak() && u.words.filter(w => !w.nl).length >= 4) t.push({ k:'listen', icon:'🎧', name:'Hörübung', desc:'Hör zu und wähle das Bild' });
    if (canSpeak() && u.words.some(canSpell)) t.push({ k:'spell', icon:'🧩', name:'Buchstabieren', desc:'Hör die Buchstaben und bau das Wort' });
    t.push({ k:'write', icon:'⌨️', name:'Schreiben ' + NAV.s.name, desc:'Deutsch → ' + NAV.s.name });
    if (u.words.some(canWriteDe)) t.push({ k:'writede', icon:'✍️', name:'Schreiben Deutsch', desc: NAV.s.name + ' → Deutsch, mit Gross- und Kleinschreibung' });
  }
  if (u.sentences.length) t.push({ k:'gaps', icon:'✏️', name:'Lückensätze', desc:'Welches Wort passt in den Satz?' });
  if (u.grammar) t.push({ k:'gram', icon:'🧠', name:'Grammatik', desc:u.grammar.title });
  if (u.abc && canSpeak()) t.push({ k:'letters', icon:'🅰️', name:'Buchstaben hören', desc:'Welchen Buchstaben hörst du?' });
  const LB = u.labels || {};
  if (u.quiz && u.quiz.length) t.push({ k:'quiz', icon:(LB.quiz || [])[0] || '💬', name:(LB.quiz || [])[1] || 'Quiz', desc:(LB.quiz || [])[2] || (u.quiz.length + ' Fragen zum Thema') });
  if (u.write && u.write.length) t.push({ k:'qwrite', icon:(LB.qwrite || [])[0] || '✏️', name:(LB.qwrite || [])[1] || 'Schreiben', desc:(LB.qwrite || [])[2] || 'Schreib die Antwort selbst' });
  if (u.gen && u.choiceOnly) { const c = (u.labels && u.labels.calc) || ['💬','Quiz','Wähle die richtige Antwort']; t.push({ k:'calc', icon:c[0], name:c[1], desc:c[2] }); }
  else if (u.gen) {
    const L = u.labels || {}, c = L.calc || ['✏️','Rechnen','Tippe das Ergebnis ein'], b = L.blitz || ['⚡','Blitzrechnen','Wähle die richtige Zahl'];
    t.push({ k:'calc', icon:c[0], name:c[1], desc:c[2] });
    t.push({ k:'blitz', icon:b[0], name:b[1], desc:b[2] });
  }
  const h = u.words.length ? hardWords(u) : [];
  if (h.length) t.push({ k:'hard', icon:'💪', name:'Schwierige Wörter', desc: h.length + ' Wörter zum Wiederholen' });
  return t;
}
function buildPractice(k,u,n = 10){
  const W = u.words;
  switch (k) {
    case 'vocab':   return shuffle(W).slice(0,n).map(w => B.vocab(w,u));
    case 'listen':  return shuffle(W.filter(w => !w.nl)).slice(0,n).map(w => B.listen(w,u));
    case 'spell':   return shuffle(W.filter(canSpell)).slice(0,n).map(B.spell);
    case 'write':   return shuffle(W.filter(canWrite)).slice(0,n).map(B.write);
    case 'writede': return shuffle(W.filter(canWriteDe)).slice(0,n).map(B.writeDe);
    case 'gaps':    return shuffle(u.sentences).slice(0,n).map(B.gap);
    case 'letters': return Array.from({ length:n }, B.letter);
    case 'gram':    return grammarTasks(u, n - 3, 3);
    case 'quiz':    return shuffle(u.quiz).slice(0,n).map(qItem);
    case 'qwrite':  return shuffle(u.write).slice(0,n).map(wItem);
    case 'calc':    return Array.from({ length:n }, () => B.calc(u));
    case 'blitz':   return Array.from({ length:n }, () => B.blitz(u));
    case 'hard':    return shuffle(hardWords(u)).slice(0,n).map(w => { const r = Math.random(); return canWrite(w) && r < .4 ? B.write(w) : canWriteDe(w) && r < .7 ? B.writeDe(w) : B.vocab(w,u); });
  }
  return [];
}

/* =====================================================================
   EIGENE LERNLISTEN (von Eltern im Eltern-Bereich erfasst, pro Familie synchronisiert)
   DB.custom = { id: { id, t, s, g, title, kind:'vok'|'qa'|'diktat', items:[[a, b]], del } }
   ===================================================================== */
const LIST_KINDS = {
  vok:    { name:'Vokabeln', hint:'Pro Zeile: Fremdwort = Deutsch', ex:'the bakery = die Bäckerei\nthe library = die Bibliothek\nturn left = links abbiegen' },
  diktat: { name:'Lernwörter (Rechtschreibung)', hint:'Pro Zeile ein Wort', ex:'Strasse\nfahren\nder Fuss\nvielleicht' },
  qa:     { name:'Fragen und Antworten', hint:'Pro Zeile: Frage = Antwort', ex:'Hauptort des Kantons St.Gallen = St.Gallen\n7 · 8 = 56\nLängster Fluss der Schweiz = Aare' }
};
const listKindsFor = sid => sid === 'en' || sid === 'fr' ? ['vok', 'qa'] : sid === 'de' ? ['diktat', 'qa'] : ['qa'];
function parseList(kind, text){
  const lines = String(text).split(/\r?\n/).map(l => l.replace(/^\s*[-•*\d]+[.)]\s+/, '').trim()).filter(Boolean), items = [], bad = [];
  for (const l of lines) {
    if (kind === 'diktat') { l.split(/\s*[,;]\s*/).filter(Boolean).forEach(w => items.push([w, ''])); continue; }
    const sep = ['\t', ' = ', '=', ';', ' – ', ' — ', ' - '].find(x => l.includes(x));
    if (!sep) { bad.push(l); continue; }
    const i = l.lastIndexOf(sep), a = l.slice(0, i).trim(), b = l.slice(i + sep.length).trim();
    if (a && b) items.push([a, b]); else bad.push(l);
  }
  return { items, bad };
}
function misspell(w){ // plausible Schreibfehler für Lernwörter
  const v = new Set(), add = x => { if (x && x !== w) v.add(x); };
  add(w.replace(/ie/, 'i')); add(w.replace(/([^i])i([^e])/, '$1ie$2')); add(w.replace(/ss/, 's')); add(w.replace(/([aeiouäöü])s([aeiou])/, '$1ss$2'));
  add(w.replace(/(.)\1/, '$1')); add(w.replace(/([aeiou])([lmnprt])([aeiou])/, '$1$2$2$3')); add(w.replace(/ä/, 'e')); add(w.replace(/e/, 'ä')); add(w.replace(/ck/, 'k')); add(w.replace(/tz/, 'z'));
  add(w.replace(/h([lmnr])/, '$1')); add(w.replace(/v/, 'f')); add(w.replace(/f/, 'v'));
  const art = w.match(/^(der|die|das) (.)/i); add(art ? w.replace(/^(der|die|das) (.)/i, (m, a, c) => a + ' ' + c.toLowerCase()) : /^[A-ZÄÖÜ]/.test(w) ? w[0].toLowerCase() + w.slice(1) : w[0].toUpperCase() + w.slice(1));

}
// Antwort-Alternativen: Zahl ohne Einheit und ohne Tausender-Trennzeichen gilt auch
function qaAlts(a){
  const v = new Set([a]), m = String(a).match(/^([\d'’ .,]+)\s*([a-zA-ZäöüÄÖÜ²³°%.]+)$/), num = x => x.replace(/['’ ]/g, '');
  if (m) { v.add(m[1].trim()); v.add(num(m[1])); v.add(num(m[1]) + ' ' + m[2]); }
  else if (/^[\d'’ .,]+$/.test(a)) v.add(num(a));
  return [...v].filter(Boolean).join('|');
}
function customUnit(L){

  if (L.kind === 'diktat') {

/* =====================================================================
   MIT KI ERSTELLEN: jede Familie nutzt ihre eigene KI
   A) Auftrag kopieren → in eigene KI-App (ChatGPT, Claude, Gemini …) mit Foto → Antwort zurück einfügen
   Die App selbst ruft keine KI auf (Gemini-API-Bedingungen: keine Nutzung in Apps für unter 18-Jährige).
   ===================================================================== */
function aiRules(s, g){
  const kinds = listKindsFor(s.id);
  const rule = s.id === 'en' || s.id === 'fr'
    ? `Enthält das Blatt eine Wörterliste, nimm kind "vok" und übernimm ALLE Wörter genau wie auf dem Blatt: a = ${s.name}, b = Deutsch (Nomen mit Artikel). Sonst kind "qa".`
    : s.id === 'de'
    ? 'Sind es Lernwörter oder ein Diktat, nimm kind "diktat" und übernimm alle Wörter genau (a = Wort, b = ""). Sonst kind "qa" mit Aufgaben zu den Lernzielen (z.B. Wortart bestimmen, Mehrzahl bilden, Zeitform setzen).'
    : s.id === 'ma'
    ? 'Nimm kind "qa". Erstelle konkrete Rechenaufgaben zu jedem Lernziel (z.B. «4.5 km = ? m»). Die Antwort ist nur das Ergebnis, mit Einheit wenn nötig.'
    : 'Nimm kind "qa". Erstelle Wissensfragen zu jedem Lernziel und zu den Fakten auf dem Blatt.';
  return `Du hilfst bei einer Lern-App für die Primarschule im Kanton St.Gallen (Schweiz, Lehrplan 21). Fach: ${s.name}, ${g}. Klasse.
Auf dem Foto ist ein Lernziel-Blatt, ein Arbeitsblatt oder eine Wörterliste. Erstelle daraus Übungsmaterial für ein Kind.
${rule}
Erlaubte Werte für kind: ${kinds.map(k => '"' + k + '"').join(', ')}.
Bei kind "qa": 15 bis 25 Fragen, die genau die Lernziele des Blatts abdecken. Jede Antwort ist kurz und eindeutig (höchstens 4 Wörter oder eine Zahl). Gib zu jeder Frage in "wrong" 3 plausible, aber eindeutig falsche Antworten im gleichen Format.
"goals": die Lernziele vom Blatt als kurze Sätze für das Kind (falls vorhanden). "title": kurzer Titel (Thema oder Unit).
Schreibe Schweizer Hochdeutsch: immer «ss», nie «ß». Zahlen wie in der Schweizer Schule: Tausender mit Apostroph (4'500), Dezimalpunkt (4.5).
Erfinde nichts, was nicht zum Blatt passt. Ignoriere Namen, Noten und Unterschriften.`;
}
function aiPromptCopy(s, g){
  return aiRules(s, g) + `

Antworte NUR mit einem JSON-Codeblock in genau diesem Format, ohne weiteren Text:
\`\`\`json
{"lernsprung":1,"title":"…","kind":"${listKindsFor(s.id)[0]}","goals":["…"],"items":[{"a":"…","b":"…","wrong":["…","…","…"]}]}
\`\`\`
Ich habe das Foto angehängt.`;
}
// Antwort einer KI einlesen: JSON (auch mit ```-Block oder Text drumherum) oder Zeilen «a = b»
function parseAiAnswer(text, sid){
  const t = String(text || '').trim(), kinds = listKindsFor(sid);
  let j = null; const cands = [];
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) cands.push(fence[1]);
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) cands.push(t.slice(a, b + 1));
  for (const c of cands) { try { j = JSON.parse(c.replace(/[“”]/g, '"')); break; } catch (e) {} }
  if (!j) { const k = kinds.includes('vok') ? 'vok' : 'qa', r = parseList(k, t); return r.items.length >= 2 ? { kind:k, title:'', items:r.items, goals:[] } : null; }
  const kind = kinds.includes(j.kind) ? j.kind : kinds[kinds.length - 1];
  const items = (Array.isArray(j.items) ? j.items : []).map(x => Array.isArray(x) ? x : [x.a, x.b, ...(x.wrong || [])])

let LG = null;

function blitzPool(u){
  const f = [];
  if (u.words.length >= 4) f.push(() => B.vocab(pick(u.words), u));
  if (u.gen) f.push(() => B.blitz(u));
  if (u.quiz) f.push(() => qItem(pick(u.quiz)));
  if (u.grammar) f.push(() => qItem(pick(u.grammar.quiz)));
  return f.length ? () => pick(f)() : null;
}
function memoryPairs(u){
  const P = [], seen = new Set();
  const add = (a, b) => { a = String(a).trim(); b = String(b).trim();
    if (!a || !b || a.toLowerCase() === b.replace(/^(der|die|das)\s+/i, '').toLowerCase() || a.length > 22 || b.length > 22 || seen.has(a) || seen.has(b)) return; seen.add(a); seen.add(b); P.push([a, b]); };
  if (u.words.length) shuffle(u.words.filter(w => !w.en.includes('…') && !w.de.includes('…'))).forEach(w => add(w.en, w.de.split(/\s*,\s*/)[0]));
  else if (u.custom && u.write) shuffle(u.write.filter(x => !x[2])).forEach(([q, a]) => add(q, a));
  else if (u.gen) for (let i = 0; i < 300 && P.length < 6; i++) {
    const g = GEN[u.gen](); if (g.html || g.options || !g.q || g.q.length > 18) continue;
    add(g.q.replace(/\?\s*$/, '…'), typeof g.answer === 'number' ? fmt(g.answer) + (g.unit ? ' ' + g.unit : '') : g.answer);
  }
  return P.length >= 6 ? shuffle(P).slice(0, 6) : null;
}
function sortData(u){
  if (u.sort) { const items = shuffle(u.sort.items).slice(0, 12).map(([x, b]) => ({ html:esc(x), bin:b })); return { bins:u.sort.bins, items }; }
  if (u.words.length) {
    const g = {}; u.words.filter(w => w.cat && !w.en.includes('…')).forEach(w => (g[w.cat] = g[w.cat] || []).push(w));
    const cats = shuffle(Object.keys(g).filter(c => g[c].length >= 3)).slice(0, 3);
    if (cats.length < 2) return null;
    const per = Math.floor(12 / cats.length), items = shuffle(cats.flatMap(c => shuffle(g[c]).slice(0, per).map(w => ({ html:esc(w.en), bin:c }))));
    return { bins:cats, items };
  }
  if (u.gen) {
    const grp = {};
    for (let i = 0; i < 400; i++) { const x = GEN[u.gen](); if (!x.fixed || !x.options || x.options.length < 2 || x.options.length > 4 || (x.q || '').length > 60) continue;
      const k = x.options.join('|'), m = grp[k] = grp[k] || new Map(); if (!m.has(x.q)) m.set(x.q, { html:x.html || esc(x.q), bin:x.answer }); }
    const best = Object.entries(grp).sort((a, b) => b[1].size - a[1].size)[0];
    if (!best || best[1].size < 10) return null;
    return { bins:best[0].split('|'), items:shuffle([...best[1].values()]).slice(0, 12) };
  }
  return null;
}
