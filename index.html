function numOptions(ans){
  const mag = Math.max(1, Math.pow(10, Math.floor(Math.log10(Math.max(ans, 1))) - 1));
  const d = [1,-1,2,-2,10,-10,100,-100,1000,-1000,mag,-mag,2*mag,-2*mag].filter(x => Math.abs(x) <= Math.max(ans, 10));
  const s = new Set([ans]); let guard = 0;
  while (s.size < 4 && guard++ < 200) { const v = ans + pick(d); if (v >= 0) s.add(v); }
  return shuffle([...s]);
}
function fromGen(g, asChoice){
  const sol = g.sol || g.q.replace('?', typeof g.answer === 'number' ? fmt(g.answer) : g.answer);
  const text = g.html || esc(g.q);
  if (g.options || (asChoice && g.choices)) {
    const options = g.choices && !g.options
      ? shuffle([g.answer, ...g.choices]).map(o => ({ label:o, ok: o === g.answer }))
      : g.options
      ? (g.fixed ? g.options : shuffle(g.options)).map(o => ({ label:o, ok: o === g.answer }))
      : numOptions(g.answer).map(v => ({ label:fmt(v) + (g.unit ? ' ' + g.unit : ''), ok: v === g.answer }));
    return { kind:'choice', prompt: g.prompt || 'Welche Zahl stimmt?', text, plain:g.q, options, solution:sol };
  }
  if (asChoice) return { kind:'choice', prompt: g.prompt || 'Welche Zahl stimmt?', text, plain:g.q, solution:sol,
    options: numOptions(g.answer).map(v => ({ label:fmt(v) + (g.unit ? ' ' + g.unit : ''), ok: v === g.answer })) };
  if (typeof g.answer === 'string') return { kind:'input', numeric:false, uml:!!g.uml, dec:!!g.dec, cs: g.dec ? false : undefined, prompt: g.prompt || 'Schreib:', text, plain:g.q, answer:g.answer, alts:g.alts, im:g.im, unit:g.unit, solution:sol };
  return { kind:'input', numeric:true, prompt: g.prompt || 'Rechne:', text, plain:g.q, answer:String(g.answer), solution:sol, unit:g.unit };
}
function qItem(it){ const [q, a, ...w] = it;
  return { kind:'choice', prompt:'Wähle die richtige Antwort.', text:esc(q), plain:q, options:shuffle([a, ...w]).map(o => ({ label:o, ok: o === a })), solution:a }; }
function wItem(it){ const alts = String(it[1]).split('|');
  if (it[2]) { const sp = canSpeak(); // Diktat: Wort wird vorgelesen
    return { kind:'input', numeric:false, uml:true, prompt: sp ? 'Hör gut zu und schreib das Wort.' : 'Schreib das Wort ab und merk es dir.', text: sp ? '🎧' : esc(it[2]), plain:'Diktat', say: sp ? it[2] : null, autoSay:true, answer:alts[0], alts, solution:alts[0] }; }
  return { kind:'input', numeric:false, uml:true, prompt:'Schreib die Antwort.', text:esc(it[0]), plain:it[0], answer:alts[0], alts, solution:alts[0] }; }
const B = {
  vocab: (w,u) => {
    const toDe = Math.random() < .5;
    const others = u.words.filter(x => x !== w && x.de !== w.de && x.en !== w.en);
    const same = others.filter(x => w.cat && x.cat === w.cat);
    const pool = shuffle(same.length >= 3 ? same : others).slice(0,3);
    return { kind:'choice', prompt: toDe ? 'Was heisst das auf Deutsch?' : 'Wie heisst das auf ' + NAV.s.name + '?',
      text:esc(toDe ? w.en : w.de), say: toDe ? w.en : null,
      options: shuffle([w, ...pool]).map(x => ({ label: toDe ? x.de : x.en, ok: x === w })),
      solution: toDe ? w.de : w.en, after:w.en, word:w };
  },
  listen: (w,u) => {
    const L = u.words.filter(x => !x.nl);
    const pool = shuffle(L.filter(x => x !== w && x.pic !== w.pic)).slice(0,3);
    return { kind:'choice', prompt:'Hör gut zu! Welches Bild passt?', say:w.en, autoSay:true, grid:'pics',
      options: shuffle([w, ...pool]).map(x => ({ label:x.pic, big:true, ok: x === w })),
      solution:`${w.pic} ${w.en} = ${w.de}`, word:w };
  },
  write: w => ({ kind:'input', prompt:'Schreib das Wort auf ' + NAV.s.name + ':', text:esc(w.de), answer:w.en, solution:w.en, after:w.en, word:w }),
  writeDe: w => { const a = deAlts(w); return { kind:'input', prompt:'Schreib das Wort auf Deutsch. Achte auf Gross- und Kleinschreibung:', text:esc(w.en), say:w.en,
    answer:a[0], alts:a, solution:a.join(' / '), cs:true, deart:true, uml:true, word:w }; },
  spell: w => ({ kind:'spell', prompt:'Hör zu: Das Wort wird buchstabiert. Setz es zusammen!', hint:'Auf Deutsch: ' + w.de, word:w, answer:w.en, solution:w.en, after:w.en }),
  gap: s => ({ kind:'choice', prompt:'Welches Wort passt in die Lücke?',
    text: esc(s.s).replace('___', '<span class="gap">___</span>'),
    options: shuffle(s.o).map(o => ({ label:o, ok: o === s.a })), solution: s.s.replace('___', s.a), note:s.de, after: s.s.replace('___', s.a) }),
  letter: () => {
    const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), c = pick(L);
    const tricky = { A:'EIR', E:'IAY', I:'EAY', G:'JQ', J:'GYK', Y:'IWJ', R:'AHE', H:'RAK', V:'WBF', W:'VUY', U:'WYQ', Q:'KUG', K:'QCJ', C:'SKZ', Z:'CSX', S:'CZX', B:'PVD', P:'BDT' };
    const cand = [...(tricky[c] || '').split(''), ...shuffle(L)].filter((x,i,a) => x !== c && a.indexOf(x) === i).slice(0,3);
    return { kind:'choice', prompt:'Welchen Buchstaben hörst du?', say:letterName(c), autoSay:true, grid:'pics',
      options: shuffle([c, ...cand]).map(x => ({ label:x, big:true, ok: x === c })), solution:c };
  },
  calc: u => fromGen(GEN[u.gen](), false),
  blitz: u => fromGen(GEN[u.gen](), true)

function practiceTypes(u){
  const t = [];
  if (u.words.length) {
    t.push({ k:'vocab', icon:'🔤', name:'Wörter-Quiz', desc: NAV.s.name + ' und Deutsch' });
    if (canSpeak() && u.words.filter(w => !w.nl).length >= 4) t.push({ k:'listen', icon:'🎧', name:'Hörübung', desc:'Hör zu und wähle das Bild' });
    if (canSpeak() && u.words.some(canSpell)) t.push({ k:'spell', icon:'🧩', name:'Buchstabieren', desc:'Hör die Buchstaben und bau das Wort' });
    t.push({ k:'write', icon:'⌨️', name:'Schreiben ' + NAV.s.name, desc:'Deutsch → ' + NAV.s.name });
    if (u.words.some(canWriteDe)) t.push({ k:'writede', icon:'✍️', name:'Schreiben Deutsch', desc: NAV.s.name + ' → Deutsch, mit Gross- und Kleinschreibung' });
  }
  if (u.sentences.length) t.push({ k:'gaps', icon:'✏️', name:'Lückensätze', desc:'Welches Wort passt in den Satz?' });
  if (u.grammar) t.push({ k:'gram', icon:'🧠', name:'Grammatik', desc:u.grammar.title });
  if (u.abc && canSpeak()) t.push({ k:'letters', icon:'🅰️', name:'Buchstaben hören', desc:'Welchen Buchstaben hörst du?' });
  const LB = u.labels || {};
  if (u.quiz && u.quiz.length) t.push({ k:'quiz', icon:(LB.quiz || [])[0] || '💬', name:(LB.quiz || [])[1] || 'Quiz', desc:(LB.quiz || [])[2] || (u.quiz.length + ' Fragen zum Thema') });
  if (u.write && u.write.length) t.push({ k:'qwrite', icon:(LB.qwrite || [])[0] || '✏️', name:(LB.qwrite || [])[1] || 'Schreiben', desc:(LB.qwrite || [])[2] || 'Schreib die Antwort selbst' });
  if (u.gen && u.choiceOnly) { const c = (u.labels && u.labels.calc) || ['💬','Quiz','Wähle die richtige Antwort']; t.push({ k:'calc', icon:c[0], name:c[1], desc:c[2] }); }
  else if (u.gen) {
    const L = u.labels || {}, c = L.calc || ['✏️','Rechnen','Tippe das Ergebnis ein'], b = L.blitz || ['⚡','Blitzrechnen','Wähle die richtige Zahl'];
    t.push({ k:'calc', icon:c[0], name:c[1], desc:c[2] });
    t.push({ k:'blitz', icon:b[0], name:b[1], desc:b[2] });
  }
  const h = u.words.length ? hardWords(u) : [];
  if (h.length) t.push({ k:'hard', icon:'💪', name:'Schwierige Wörter', desc: h.length + ' Wörter zum Wiederholen' });
  return t;
}
function buildPractice(k,u,n = 10){
  const W = u.words;
  switch (k) {
    case 'vocab':   return shuffle(W).slice(0,n).map(w => B.vocab(w,u));
    case 'listen':  return shuffle(W.filter(w => !w.nl)).slice(0,n).map(w => B.listen(w,u));
    case 'spell':   return shuffle(W.filter(canSpell)).slice(0,n).map(B.spell);
    case 'write':   return shuffle(W.filter(canWrite)).slice(0,n).map(B.write);
    case 'writede': return shuffle(W.filter(canWriteDe)).slice(0,n).map(B.writeDe);
    case 'gaps':    return shuffle(u.sentences).slice(0,n).map(B.gap);
    case 'letters': return Array.from({ length:n }, B.letter);
    case 'gram':    return grammarTasks(u, n - 3, 3);
    case 'quiz':    return shuffle(u.quiz).slice(0,n).map(qItem);
    case 'qwrite':  return shuffle(u.write).slice(0,n).map(wItem);
    case 'calc':    return Array.from({ length:n }, () => B.calc(u));
    case 'blitz':   return Array.from({ length:n }, () => B.blitz(u));
    case 'hard':    return shuffle(hardWords(u)).slice(0,n).map(w => { const r = Math.random(); return canWrite(w) && r < .4 ? B.write(w) : canWriteDe(w) && r < .7 ? B.writeDe(w) : B.vocab(w,u); });
  }
  return [];
}

  app.querySelectorAll('.mitem').forEach(b => b.onclick = () => b.dataset.k.startsWith('g-') ? startLearnGame(b.dataset.k) : startPractice(b.dataset.k));
}
function startPractice(k){
  const tasks = buildPractice(k, NAV.u);

}

/* =====================================================================
   EIGENE LERNLISTEN (von Eltern im Eltern-Bereich erfasst, pro Familie synchronisiert)
   DB.custom = { id: { id, t, s, g, title, kind:'vok'|'qa'|'diktat', items:[[a, b]], del } }

const LIST_KINDS = {
  vok:    { name:'Vokabeln', hint:'Pro Zeile: Fremdwort = Deutsch', ex:'the bakery = die Bäckerei\nthe library = die Bibliothek\nturn left = links abbiegen' },
  diktat: { name:'Lernwörter (Rechtschreibung)', hint:'Pro Zeile ein Wort', ex:'Strasse\nfahren\nder Fuss\nvielleicht' },
  qa:     { name:'Fragen und Antworten', hint:'Pro Zeile: Frage = Antwort', ex:'Hauptort des Kantons St.Gallen = St.Gallen\n7 · 8 = 56\nLängster Fluss der Schweiz = Aare' }
};
const listKindsFor = sid => sid === 'en' || sid === 'fr' ? ['vok', 'qa'] : sid === 'de' ? ['diktat', 'qa'] : ['qa'];
const SEPS = ['\t', ' = ', '=', ';', ' – ', ' — ', ' - '];
const cleanEntry = x => String(x).replace(/ß/g, 'ss').replace(/[’‘`´]/g, "'").replace(/\s*\*+\s*$/, '').replace(/\s+/g, ' ').trim();
function parseList(kind, text){
  let lines = String(text).split(/\r?\n/).map(l => l.replace(/^\s*[-•*\d]+[.)]\s+/, '').replace(/ß/g, 'ss').replace(/[’‘`´]/g, "'").trimEnd().replace(/^\s+/, ''))
    .filter(l => l.trim() && !/^(terms in this set|begriffe in diesem set|karteikarten|flashcards)\b/i.test(l.trim()));
  const items = [], bad = [];
  // Quizlet-Set-Seite kopiert: Begriff und Bedeutung abwechselnd auf eigenen Zeilen, ohne Trennzeichen
  if (kind !== 'diktat' && lines.length >= 4 && lines.length % 2 === 0 && !lines.some(l => SEPS.some(x => l.includes(x)))) {
    for (let i = 0; i < lines.length; i += 2) items.push([cleanEntry(lines[i]), cleanEntry(lines[i + 1])]);
    return { items, bad, alt:true };
  }
  for (const l0 of lines) { const l = l0.trim();
    if (kind === 'diktat') { l.split(/\s*[,;]\s*/).filter(Boolean).forEach(w => items.push([w, ''])); continue; }
    const sep = SEPS.find(x => l0.includes(x)), src = sep === '\t' ? l0 : l;
    if (!sep) { bad.push(l); continue; }
    const i = sep === '\t' ? src.indexOf(sep) : src.lastIndexOf(sep), a = cleanEntry(src.slice(0, i)), b = cleanEntry(src.slice(i + sep.length));
    if (a && b) items.push([a, b]); else bad.push(l);
  }
  return { items, bad };
}
function misspell(w){ // plausible Schreibfehler für Lernwörter
  const v = new Set(), add = x => { if (x && x !== w) v.add(x); };
  add(w.replace(/ie/, 'i')); add(w.replace(/([^i])i([^e])/, '$1ie$2')); add(w.replace(/ss/, 's')); add(w.replace(/([aeiouäöü])s([aeiou])/, '$1ss$2'));
  add(w.replace(/(.)\1/, '$1')); add(w.replace(/([aeiou])([lmnprt])([aeiou])/, '$1$2$2$3')); add(w.replace(/ä/, 'e')); add(w.replace(/e/, 'ä')); add(w.replace(/ck/, 'k')); add(w.replace(/tz/, 'z'));
  add(w.replace(/h([lmnr])/, '$1')); add(w.replace(/v/, 'f')); add(w.replace(/f/, 'v'));
  const art = w.match(/^(der|die|das) (.)/i); add(art ? w.replace(/^(der|die|das) (.)/i, (m, a, c) => a + ' ' + c.toLowerCase()) : /^[A-ZÄÖÜ]/.test(w) ? w[0].toLowerCase() + w.slice(1) : w[0].toUpperCase() + w.slice(1));
  return shuffle([...v]).slice(0, 3);
}
// Antwort-Alternativen: Zahl ohne Einheit und ohne Tausender-Trennzeichen gilt auch
function qaAlts(a){
  const v = new Set([a]), m = String(a).match(/^([\d'’ .,]+)\s*([a-zA-ZäöüÄÖÜ²³°%.]+)$/), num = x => x.replace(/['’ ]/g, '');
  if (m) { v.add(m[1].trim()); v.add(num(m[1])); v.add(num(m[1]) + ' ' + m[2]); }
  else if (/^[\d'’ .,]+$/.test(a)) v.add(num(a));
  return [...v].filter(Boolean).join('|');
}
function customUnit(L){
  const n = L.items.length, base = { id:'c_' + L.id, no:'Eigene Liste', title:L.title || 'Meine Lernliste', icon:'📝', custom:L.id, sentences:[], words:[] };

function defGrade(){ const G = [...new Set(CATALOG.flatMap(s => s.grades.filter(g => g.books.length && !g.customOnly).map(g => g.grade)))], ok = n => G.includes(+n) ? +n : 0, A = DB.profiles && DB.profiles[ACTIVE] || {};

   A) Auftrag kopieren → in eigene KI-App (ChatGPT, Claude, Gemini …) mit Foto → Antwort zurück einfügen
   Die App selbst ruft keine KI auf (Gemini-API-Bedingungen: keine Nutzung in Apps für unter 18-Jährige).
   ===================================================================== */
function aiRules(s, g){
  const kinds = listKindsFor(s.id);
  const rule = s.id === 'en' || s.id === 'fr'
    ? `Enthält das Blatt eine Wörterliste, nimm kind "vok" und übernimm ALLE Wörter genau wie auf dem Blatt: a = ${s.name}, b = Deutsch (Nomen mit Artikel). Sonst kind "qa".`
    : s.id === 'de'
    ? 'Sind es Lernwörter oder ein Diktat, nimm kind "diktat" und übernimm alle Wörter genau (a = Wort, b = ""). Sonst kind "qa" mit Aufgaben zu den Lernzielen (z.B. Wortart bestimmen, Mehrzahl bilden, Zeitform setzen).'
    : s.id === 'ma'
    ? 'Nimm kind "qa". Erstelle konkrete Rechenaufgaben zu jedem Lernziel (z.B. «4.5 km = ? m»). Die Antwort ist nur das Ergebnis, mit Einheit wenn nötig.'
    : 'Nimm kind "qa". Erstelle Wissensfragen zu jedem Lernziel und zu den Fakten auf dem Blatt.';
  return `Du hilfst bei einer Lern-App für die Primarschule im Kanton St.Gallen (Schweiz, Lehrplan 21). Fach: ${s.name}, ${g}. Klasse.
Auf dem Foto ist ein Lernziel-Blatt, ein Arbeitsblatt oder eine Wörterliste. Erstelle daraus Übungsmaterial für ein Kind.
${rule}
Erlaubte Werte für kind: ${kinds.map(k => '"' + k + '"').join(', ')}.
Bei kind "qa": 15 bis 25 Fragen, die genau die Lernziele des Blatts abdecken. Jede Antwort ist kurz und eindeutig (höchstens 4 Wörter oder eine Zahl). Gib zu jeder Frage in "wrong" 3 plausible, aber eindeutig falsche Antworten im gleichen Format.
"goals": die Lernziele vom Blatt als kurze Sätze für das Kind (falls vorhanden). "title": kurzer Titel (Thema oder Unit).
Schreibe Schweizer Hochdeutsch: immer «ss», nie «ß». Zahlen wie in der Schweizer Schule: Tausender mit Apostroph (4'500), Dezimalpunkt (4.5).
Erfinde nichts, was nicht zum Blatt passt. Ignoriere Namen, Noten und Unterschriften.`;
}
function aiPromptCopy(s, g){
  return aiRules(s, g) + `

Antworte NUR mit einem JSON-Codeblock in genau diesem Format, ohne weiteren Text:
\`\`\`json
{"lernsprung":1,"title":"…","kind":"${listKindsFor(s.id)[0]}","goals":["…"],"items":[{"a":"…","b":"…","wrong":["…","…","…"]}]}
\`\`\`
Ich habe das Foto angehängt.`;
}
// Antwort einer KI einlesen: JSON (auch mit ```-Block oder Text drumherum) oder Zeilen «a = b»
function parseAiAnswer(text, sid){
  const t = String(text || '').trim(), kinds = listKindsFor(sid);
  let j = null; const cands = [];
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) cands.push(fence[1]);
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) cands.push(t.slice(a, b + 1));
  for (const c of cands) { try { j = JSON.parse(c.replace(/[“”]/g, '"')); break; } catch (e) {} }
  if (!j) { const k = kinds.includes('vok') ? 'vok' : 'qa', r = parseList(k, t); return r.items.length >= 2 ? { kind:k, title:'', items:r.items, goals:[] } : null; }
  const kind = kinds.includes(j.kind) ? j.kind : kinds[kinds.length - 1];
  const items = (Array.isArray(j.items) ? j.items : []).map(x => Array.isArray(x) ? x : [x.a, x.b, ...(x.wrong || [])])
    .map(x => x.map(v => String(v == null ? '' : v).trim())).map(([q, ans, ...w]) => [q, ans, ...w.filter(v => v && v !== ans).slice(0, 3)])
    .filter(x => x[0] && (kind === 'diktat' || x[1])).map(x => kind === 'diktat' ? [x[0], ''] : x).slice(0, 200);
  return items.length >= 2 ? { kind, title:String(j.title || '').slice(0, 60), items, goals:(j.goals || []).map(String).filter(Boolean).slice(0, 12) } : null;
}

function blitzPool(u){
  const f = [];
  if (u.words.length >= 4) f.push(() => B.vocab(pick(u.words), u));
  if (u.gen) f.push(() => B.blitz(u));
  if (u.quiz) f.push(() => qItem(pick(u.quiz)));
  if (u.grammar) f.push(() => qItem(pick(u.grammar.quiz)));
  return f.length ? () => pick(f)() : null;
}
function memoryPairs(u){
  const P = [], seen = new Set();
  const add = (a, b) => { a = String(a).trim(); b = String(b).trim();
    if (!a || !b || a.toLowerCase() === b.replace(/^(der|die|das)\s+/i, '').toLowerCase() || a.length > 22 || b.length > 22 || seen.has(a) || seen.has(b)) return; seen.add(a); seen.add(b); P.push([a, b]); };
  if (u.words.length) shuffle(u.words.filter(w => !w.en.includes('…') && !w.de.includes('…'))).forEach(w => add(w.en, w.de.split(/\s*,\s*/)[0]));
  else if (u.custom && u.write) shuffle(u.write.filter(x => !x[2])).forEach(([q, a]) => add(q, a));
  else if (u.gen) for (let i = 0; i < 300 && P.length < 6; i++) {
    const g = GEN[u.gen](); if (g.html || g.options || !g.q || g.q.length > 18) continue;
    add(g.q.replace(/\?\s*$/, '…'), typeof g.answer === 'number' ? fmt(g.answer) + (g.unit ? ' ' + g.unit : '') : g.answer);
  }
  return P.length >= 6 ? shuffle(P).slice(0, 6) : null;
}

    const cats = shuffle(Object.keys(g).filter(c => g[c].length >= 3)).slice(0, 3);
    if (cats.length < 2) return null;
    const per = Math.floor(12 / cats.length), items = shuffle(cats.flatMap(c => shuffle(g[c]).slice(0, per).map(w => ({ html:esc(w.en), bin:c }))));

    for (let i = 0; i < 400; i++) { const x = GEN[u.gen](); if (!x.fixed || !x.options || x.options.length < 2 || x.options.length > 4 || (x.q || '').length > 60) continue;
      const k = x.options.join('|'), m = grp[k] = grp[k] || new Map(); if (!m.has(x.q)) m.set(x.q, { html:x.html || esc(x.q), bin:x.answer }); }
    const best = Object.entries(grp).sort((a, b) => b[1].size - a[1].size)[0];

}

/* ---- Blitz-Sprung ---- */
function showBlitz(){
  stop(); crumbs();
  const make = blitzPool(NAV.u), tk = TOKEN, T = 60;
  LG = { score:0, right:0, n:0, end:Date.now() + T * 1000 };
  app.innerHTML = `<div id="lg" class="blitz"><div class="bhead"><b id="btime">${T}</b><span>Sekunden</span><span class="bsc">🦘 <b id="bsc">0</b> Sprünge</span></div>
    <div class="btrack"><div class="bbar" id="bbar"></div><span id="broo">🦘</span></div><div class="card" id="bq"></div></div>`;
  const draw = () => {
    const t = make(); LG.t = t; const t0 = Date.now();
    $('#bq').innerHTML = `<div class="q">${esc(t.prompt)}</div>${t.text ? `<div class="word ${t.plain && t.plain.length > 45 ? 'long' : ''}">${t.text}</div>` : ''}
      <div class="opts ${t.grid || ''}">${t.options.map((o, i) => `<button class="btn opt gopt ${o.big ? 'bigopt' : ''}" data-i="${i}">${esc(o.label)}</button>`).join('')}</div><div id="bfb" class="small center"></div>`;
    $('#bq').querySelectorAll('.gopt').forEach(b => b.onclick = () => {
      if (LG.lock) return; const o = t.options[+b.dataset.i]; LG.n++;
      try { track(o.ok, Date.now() - t0, { q:t.plain || t.text || t.prompt, a:o.label, c:t.solution }); } catch (e) {}
      if (o.ok) { LG.right++; LG.score++; $('#bsc').textContent = LG.score; const r = $('#broo'); r.classList.remove('hop'); void r.offsetWidth; r.classList.add('hop');
        r.style.left = (6 + (LG.score % 10) * 9) + '%'; draw(); }
      else { LG.lock = true; LG.end -= 3000; b.classList.add('no'); $('#bfb').innerHTML = `−3 Sekunden · Richtig: <b>${esc(t.solution)}</b>`;
        setTimeout(() => { if (tk === TOKEN && LG) { LG.lock = false; draw(); } }, 900); }
    });
  };
  LG.finish = () => {
    if (!LG) return; const L = LG, note = noteOf(L.right, L.n), rec = saveGame(gkey('blitz'), L.score);
    const er = L.n < 10 ? { add:0, why:'few' } : earnNote(note, MIN_PRACTICE, 'g:blitz:' + ukey());
    lgEnd(['⚡', `${L.score} Sprünge!`], `<p class="word">${L.right} von ${L.n} richtig</p>${L.n ? `<p style="margin:-6px 0 0;font-weight:800">Note ${fmtNote(note)}</p>` : ''}
      <p>${rec && L.score ? '🏆 Neuer Rekord!' : 'Rekord: ' + (DB.games[gkey('blitz')] || 0) + ' Sprünge'}</p>${er.why === 'few' ? '<p class="earn off">Beantworte mindestens 10 Aufgaben, dann gibt es Spielminuten.</p>' : ''}`,
      er.why === 'few' ? null : er, showBlitz);
  };
  const tick = setInterval(() => {
    if (tk !== TOKEN || !LG) return clearInterval(tick);
    const left = Math.max(0, (LG.end - Date.now()) / 1000); $('#btime').textContent = Math.ceil(left);
    $('#bbar').style.width = (left / T * 100) + '%';
    if (left <= 0) { clearInterval(tick); LG.finish(); }
  }, 100);
  draw();
}

/* ---- Memory ---- */
/* Mathe: offene Karten statt verdeckt. Rechnen und Merken gleichzeitig ist für Kinder zu viel.
   Links die Aufgaben, rechts die Ergebnisse; Aufgabe antippen, dann das passende Ergebnis. «Verdeckt» bleibt als Herausforderung. */
function showPairs(){
  stop(); crumbs();
  const pairs = memoryPairs(NAV.u), tk = TOKEN, L = shuffle(pairs.map((p, i) => ({ t:p[0], p:i }))), R = shuffle(pairs.map((p, i) => ({ t:p[1], p:i })));
  LG = { sel:null, found:0, err:0, t0:Date.now() };
  app.innerHTML = `<div id="lg"><h1 class="h1">Paare finden</h1><p class="lead">Tippe eine Aufgabe und dann das richtige Ergebnis. Fehler: <span id="merr">0</span></p>
    <div class="pairgrid"><div class="pcol">${L.map((c, i) => `<button class="pc pt" data-s="L" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>
      <div class="pcol">${R.map((c, i) => `<button class="pc pr" data-s="R" data-i="${i}">${esc(c.t)}</button>`).join('')}</div></div>
    <div class="row"><button class="linkbtn" id="mhard">🙈 Schwieriger: verdeckt spielen (Memory)</button></div></div>`;
  $('#mhard').onclick = () => showMemory(true);
  LG.finish = () => {
    const sec = Math.round((Date.now() - LG.t0) / 1000), rec = saveGame(gkey('pair'), LG.err * 1000 + sec, true), best = DB.games[gkey('pair')];
    lgEnd(['🧩', 'Alle Paare gefunden!'], `<p class="word">${LG.err} Fehler · ${sec} s</p><p>${rec ? '🏆 Neuer Rekord!' : 'Rekord: ' + Math.floor(best / 1000) + ' Fehler · ' + best % 1000 + ' s'}</p><p class="earn off">Spielminuten gibt es beim Üben und im Probetest.</p>`, null, showPairs);
  };
  app.querySelectorAll('.pc').forEach(b => b.onclick = () => {
    if (LG.lock || b.classList.contains('done')) return;
    const side = b.dataset.s, c = (side === 'L' ? L : R)[+b.dataset.i];
    if (!LG.sel || LG.sel.side === side) { if (LG.sel) LG.sel.b.classList.remove('sel'); LG.sel = { b, c, side }; b.classList.add('sel'); return; }
    const a = LG.sel; LG.sel = null; a.b.classList.remove('sel');
    if (a.c.p === c.p) { a.b.classList.add('done'); b.classList.add('done'); LG.found++; if (LG.found === pairs.length) setTimeout(() => { if (tk === TOKEN) LG.finish(); }, 500); }
    else { LG.err++; $('#merr').textContent = LG.err; LG.lock = true; a.b.classList.add('no'); b.classList.add('no');
      setTimeout(() => { if (tk !== TOKEN) return; a.b.classList.remove('no'); b.classList.remove('no'); LG.lock = false; }, 700); }
  });
}
function showMemory(hard){

  };
  app.querySelectorAll('.mcard').forEach(b => b.onclick = () => {

    if (c1.p === c2.p) { b1.classList.add('done'); b2.classList.add('done'); LG.found++; if (LG.found === pairs.length) setTimeout(() => { if (tk === TOKEN) LG.finish(); }, 600); }
    else { LG.lock = true; setTimeout(() => { if (tk !== TOKEN) return; b1.classList.remove('open'); b2.classList.remove('open'); LG.lock = false; }, 1000); }
  });
}

  });

}

const HN = h => ((h - 1) % 12 + 12) % 12 + 1;
function clockPhrase(h, m){
  const n = HN(h + 1);
  if (m === 0) return `${HN(h)} Uhr`;
  if (m === 15) return `Viertel nach ${HN(h)}`;
  if (m === 30) return `halb ${n}`;
  if (m === 45) return `Viertel vor ${n}`;
  if (m === 25) return `5 vor halb ${n}`;
  if (m === 35) return `5 nach halb ${n}`;
  return m < 30 ? `${m} nach ${HN(h)}` : `${60 - m} vor ${n}`;
}

  let s = '<svg id="sclock" class="clock" viewBox="0 0 140 140" role="img" aria-label="Uhr zum Stellen"><circle cx="70" cy="70" r="64" fill="#fff" stroke="#1b2238" stroke-width="3"/>';
  const p = (r, a) => [(70 + r * Math.sin(a)).toFixed(1), (70 - r * Math.cos(a)).toFixed(1)];
  for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, big = i % 5 === 0, [x1,y1] = p(big ? 54 : 59, a), [x2,y2] = p(62, a);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1b2238" stroke-width="${big ? 2.2 : 1}"/>`; }
  for (let n = 1; n <= 12; n++) { const [x,y] = p(44, n * Math.PI / 6); s += `<text x="${x}" y="${(+y + 5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2238" font-family="sans-serif">${n}</text>`; }
  return s + '<line id="hh" x1="70" y1="70" x2="70" y2="40" stroke="#1b2238" stroke-width="7" stroke-linecap="round"/><line id="mh" x1="70" y1="70" x2="70" y2="18" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="70" r="5" fill="#1b2238"/></svg>';
}
function showClock(){
  stop(); crumbs();
  const tk = TOKEN, N = 10, tasks = Array.from({ length:N }, () => { const h = rnd(1, 12), m = rnd(0, 11) * 5, dig = Math.random() < .4;
    return { h, m, txt: dig ? `${Math.random() < .5 && h < 12 ? h + 12 : h}:${String(m).padStart(2, '0')}` : clockPhrase(h, m) }; });
  LG = { i:0, right:0, h:12, m:0, drag:null };
  app.innerHTML = `<div id="lg"><div class="progress"><div id="cbar" style="width:0%"></div></div><p class="small center" id="cno"></p>
    <div class="card center"><div class="q">Stell die Uhr auf:</div><div class="word" id="ctarget"></div>
      <div class="clockwrap">${setClockSVG()}</div>
      <p class="small">Zieh die Zeiger mit dem Finger. Kurzer Zeiger = Stunden, langer roter Zeiger = Minuten.</p>
      <div class="row"><button class="btn" id="hm">− Std</button><button class="btn" id="hp">+ Std</button><button class="btn" id="mm">− 5 Min</button><button class="btn" id="mp">+ 5 Min</button></div>
      <div id="cfb"></div><div class="row"><button class="btn primary" id="ccheck">Prüfen</button></div></div></div>`;
  const svg = $('#sclock');
  const drawHands = (bad) => {
    const ha = ((LG.h % 12) * 30 + LG.m * .5) * Math.PI / 180, ma = LG.m * 6 * Math.PI / 180;
    $('#hh').setAttribute('x2', (70 + 30 * Math.sin(ha)).toFixed(1)); $('#hh').setAttribute('y2', (70 - 30 * Math.cos(ha)).toFixed(1));
    $('#mh').setAttribute('x2', (70 + 52 * Math.sin(ma)).toFixed(1)); $('#mh').setAttribute('y2', (70 - 52 * Math.cos(ma)).toFixed(1));
  };
  const show = () => { const t = tasks[LG.i]; $('#ctarget').textContent = t.txt; $('#cno').textContent = `Aufgabe ${LG.i + 1} von ${N}`;
    $('#cbar').style.width = (LG.i / N * 100) + '%'; $('#cfb').innerHTML = ''; LG.lock = false; LG.shown = Date.now(); drawHands(); };
  const ang = e => { const r = svg.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2; return (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360; };
  const setFrom = a => { if (LG.drag === 'm') LG.m = Math.round(a / 30) % 12 * 5; else LG.h = HN(Math.round((a - LG.m * .5) / 30) || 12); drawHands(); };
  svg.addEventListener('pointerdown', e => { if (LG.lock) return; e.preventDefault(); const a = ang(e), ha = (LG.h % 12) * 30 + LG.m * .5, ma = LG.m * 6;
    const d = x => Math.min(Math.abs(a - x), 360 - Math.abs(a - x)); LG.drag = d(ma) <= d(ha) ? 'm' : 'h'; try { svg.setPointerCapture(e.pointerId); } catch (x) {} setFrom(a); });
  svg.addEventListener('pointermove', e => { if (LG.drag && !LG.lock) setFrom(ang(e)); });
  const up = () => { LG && (LG.drag = null); }; svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  const nudge = (dh, dm) => { if (LG.lock) return; LG.m += dm; if (LG.m >= 60) { LG.m -= 60; dh++; } if (LG.m < 0) { LG.m += 60; dh--; } LG.h = HN(LG.h + dh); drawHands(); };
  $('#hm').onclick = () => nudge(-1, 0); $('#hp').onclick = () => nudge(1, 0); $('#mm').onclick = () => nudge(0, -5); $('#mp').onclick = () => nudge(0, 5);
  LG.finish = () => { const note = noteOf(LG.right, N);
    lgEnd(['🕒', 'Alle Uhren gestellt!'], `<p class="word">${LG.right} von ${N} richtig</p><p style="margin:-6px 0 0;font-weight:800">Note ${fmtNote(note)}</p>`, earnNote(note, MIN_PRACTICE, 'g:clock:' + ukey()), showClock); };
  $('#ccheck').onclick = () => {
    if (LG.lock) { LG.i++; if (LG.i >= N) LG.finish(); else { $('#ccheck').textContent = 'Prüfen'; show(); } return; }
    const t = tasks[LG.i], ok = HN(LG.h) === HN(t.h) && LG.m === t.m; LG.lock = true;
    if (ok) { LG.right++; DB.stars++; save(); updateStars(); $('#cfb').innerHTML = `<div class="fb good">${pick(PRAISE)} ⭐</div>`; setTimeout(() => { if (tk === TOKEN && LG && LG.lock) $('#ccheck').click(); }, 1200); }
    else { LG.h = t.h; LG.m = t.m; drawHands(); $('#cfb').innerHTML = `<div class="fb wrong">So ist es richtig: ${HN(t.h)}:${String(t.m).padStart(2, '0')} Uhr</div>`; }
    $('#ccheck').textContent = 'Weiter';
  };
  show();
}

function testPlan(u){
  const label = pl => pl.map((p,i) => Object.assign(p, { label:`Teil ${i+1}: ${p.name}` }));
  if (u.gen || u.quiz) {
    const pl = [], gc = u.quiz ? 6 : 12;
    if (u.gen && u.choiceOnly) pl.push({ name:(u.labels && u.labels.calc || [,'Fragen'])[1], n:gc, make: () => Array.from({ length:gc }, () => B.calc(u)) });
    else if (u.gen) {
      pl.push({ name:(u.labels && u.labels.test || ['Rechnen'])[0], n:gc, make: () => Array.from({ length:gc }, () => B.calc(u)) });
      pl.push({ name:(u.labels && u.labels.test || [,'Auswählen'])[1], n:6, make: () => Array.from({ length:6 }, () => B.blitz(u)) });
    }
    if (u.quiz) { const n = Math.min(u.gen ? 8 : 12, u.quiz.length); pl.push({ name:'Fragen', n, make: () => shuffle(u.quiz).slice(0,n).map(qItem) }); }
    if (u.write) { const n = Math.min(4, u.write.length); pl.push({ name:'Schreiben', n, make: () => shuffle(u.write).slice(0,n).map(wItem) }); }
    return label(pl);
  }
  const plan = [], L = u.words.filter(w => !w.nl), wr = u.words.filter(canWrite);
  plan.push({ name:'Wörter', n:6, make: () => shuffle(u.words).slice(0,6).map(w => B.vocab(w,u)) });
  if (canSpeak() && L.length >= 4) plan.push({ name:'Hören', n:4, make: () => shuffle(L).slice(0,4).map(w => B.listen(w,u)) });
  if (u.abc && canSpeak()) plan.push({ name:'Buchstaben', n:3, make: () => Array.from({ length:3 }, B.letter) });
  if (wr.length) plan.push({ name:'Schreiben ' + NAV.s.name, n:Math.min(5, wr.length), make: () => shuffle(wr).slice(0,5).map(B.write) });
  const wd = u.words.filter(canWriteDe);
  if (wd.length) plan.push({ name:'Schreiben Deutsch', n:Math.min(3, wd.length), make: () => shuffle(wd).slice(0,3).map(B.writeDe) });
  if (u.sentences.length) plan.push({ name:'Sätze', n:Math.min(5, u.sentences.length), make: () => shuffle(u.sentences).slice(0,5).map(B.gap) });
  if (u.grammar) plan.push({ name:'Grammatik', n:5, make: () => grammarTasks(u, 3, 2) });
  return label(plan);
}
function reviewPool(n, exclude){
  const idx = NAV.b.units.indexOf(NAV.u), items = [];
  NAV.b.units.slice(0, idx + 1).filter(u => u.no !== 'Special').forEach(u => u.words.forEach(w => {
    if (!exclude.includes(w.en) && canWrite(w)) items.push({ w, u, k:keyOf(NAV.b, u) });
  }));
  const hard = shuffle(items.filter(x => (DB.known[x.k] || {})[x.w.en] === 0)).slice(0, 3);
  return shuffle([...hard, ...shuffle(items.filter(x => !hard.includes(x))).slice(0, n - hard.length)]);
}
function buildCustomTest(t){
  const W = t.words.map(en => NAV.u.words.find(w => w.en === en)).filter(Boolean), set = { words:W };
  const parts = [];
  if (canSpeak()) parts.push(['Hören', shuffle(W).slice(0,4).map(w => B.listen(w, set))]);
  parts.push(['Schreiben', shuffle(W).map(B.write)]);
  parts.push(['Sätze', shuffle(t.sentences).slice(0,5).map(([s,a]) => B.gap({ s, a, o:[a, ...shuffle(t.words.filter(x => x !== a)).slice(0,2)], de:'' }))]);
  parts.push(['Wiederholung', reviewPool(t.review, t.words).map(x => Object.assign(B.vocab(x.w, x.u), { wkey:x.k }))]);
  return parts.map(([name, tasks], i) => ({ label:`Teil ${i+1}: ${name}`, tasks: tasks.map(tk => Object.assign(tk, { part:`Teil ${i+1}: ${name}` })) }));
}

/* =====================================================================
   7b) PAPIERTEST: Probetest als A4-Blatt drucken oder als PDF speichern
   (Druckdialog des Browsers; die App erzeugt das Blatt selbst, keine KI, kein Server)
   ===================================================================== */
const PAPER_STORE = 'lernsprung-druck';
const PAPERMEM = (() => { try { return JSON.parse(localStorage.getItem(PAPER_STORE) || '{}'); } catch (e) { return {}; } })();
function paperRemember(k, n){ PAPERMEM[ACTIVE + '|' + k] = { n, d:Date.now() }; const lim = Date.now() - 90 * 864e5; Object.keys(PAPERMEM).forEach(x => { if (PAPERMEM[x].d < lim) delete PAPERMEM[x]; });
  try { localStorage.setItem(PAPER_STORE, JSON.stringify(PAPERMEM)); } catch (e) {} }
const paperLast = k => PAPERMEM[ACTIVE + '|' + k];
/* Aufgaben einer Unit fürs Papier. cap = höchstens so viele Aufgaben (bei Prüfungen mit mehreren Themen). */
function paperTasks(f, cap){
  const keep = { s:NAV.s, g:NAV.g, b:NAV.b, u:NAV.u, n:NAV.n };
  NAV.s = f.s; NAV.g = f.g; NAV.b = f.b; NAV.u = f.u; NAV.n = f.g.grade;
  try {
    const wu = !f.u.gen && !f.u.quiz && (f.u.words || []).length >= 4;
    const plan = testPlan(f.u).filter(p => !wu || /^(Sätze|Grammatik)/.test(p.name)), wp = wu ? paperWordPlan(f.u) : [];
    const total = wp.concat(plan).reduce((a, p) => a + p.n, 0), r = cap && total > cap ? cap / total : 1;
    const seen = new Set();
    return wp.map(p => p.make(Math.max(p.min || 1, Math.round(p.n * r)))).concat(plan.map(p => { const want = Math.max(1, Math.round(p.n * r)), out = [];
      for (let i = 0; i < 8 && out.length < want; i++) p.make().forEach(t => { const id = t.kind + '|' + (t.text || '') + '|' + (t.say || ''); if (out.length < want && (t.kind === 'choice' || t.kind === 'input') && !seen.has(id)) { seen.add(id); out.push(t); } });
      return { label:p.name, tasks:out }; })).filter(p => p.tasks.length);
  } finally { Object.assign(NAV, keep); }
}
/* Wort-Units auf Papier wie ein Schul-Wörtchentest: Zuordnen, Deutsch → Fremdsprache, Fremdsprache → Deutsch, Buchstabensalat */
function paperWordPlan(u){
  const first = x => String(x).split('|')[0].trim(), W = shuffle(u.words.filter(w => w.en && w.de)), lang = NAV.s.name, N = W.length;
  const nM = Math.min(8, N), nA = Math.min(8, Math.ceil(N / 2)), nB = Math.min(6, N - nA) || Math.min(4, N);
  const inp = (q, a, pr) => ({ kind:'input', prompt:pr, text:esc(q), answer:first(a), solution:first(a) });
  const mix = w => { const c = [...w]; for (let i = 0; i < 20; i++) { const m = shuffle(c).join(''); if (m !== w) return m; } return c.reverse().join(''); };
  const scr = W.filter(w => /^[a-zA-Zéèêàâçîôûëïü]{4,10}$/.test(first(w.en)));
  return [
    { name:'Zuordnen', n:nM, min:3, make:k => { const P = shuffle(W).slice(0, k); return { label:'Zuordnen', match:P.map(w => [first(w.en), first(w.de)]), tasks:P }; } },
    { name:'Deutsch → ' + lang, n:nA, make:k => ({ label:'Deutsch → ' + lang, tasks:W.slice(0, k).map(w => inp(first(w.de), w.en, 'Schreib das Wort auf ' + lang + '.')) }) },
    { name:lang + ' → Deutsch', n:nB, make:k => ({ label:lang + ' → Deutsch', tasks:W.slice(N - k).map(w => inp(first(w.en), w.de, 'Schreib das Wort auf Deutsch.')) }) },
    ...(scr.length >= 2 ? [{ name:'Buchstabensalat', n:Math.min(4, scr.length), min:2, make:k => ({ label:'Buchstabensalat', tasks:shuffle(scr).slice(0, k).map(w => { const e = first(w.en);
      return { kind:'input', prompt:'Ordne die Buchstaben zum richtigen Wort.', text:`<span class="pscr">${esc(mix(e.toLowerCase()).split('').join(' '))}</span> <span class="psmall">(${esc(first(w.de))})</span>`, plain:e, answer:e, solution:e }; }) }) }] : [])
  ];
}
function paperScale(n){
  const rows = []; for (let p = n; p >= 0; p--) { const no = noteOf(p, n), r = rows[rows.length - 1]; if (r && r.no === no) r.lo = p; else rows.push({ no, hi:p, lo:p }); }
  return `<table class="pscale"><tr><th>Note</th>${rows.map(r => `<td><b>${fmtNote(r.no)}</b></td>`).join('')}</tr><tr><th>Punkte</th>${rows.map(r => `<td>${r.hi === r.lo ? r.hi : r.lo + '–' + r.hi}</td>`).join('')}</tr></table>`;
}
/* sel = { title, sub, lp, groups:[{ k, f }], cap, back } */
function showPaper(sel){
  stop(); crumbs();
  const solOn = (() => { try { return localStorage.getItem('lernsprung-druck-lsg') !== '0'; } catch (e) { return true; } })();
  const G = sel.groups.map(g => ({ k:g.k, f:g.f, parts:paperTasks(g.f, sel.cap) }));
  let no = 0; const read = [], sol = [];
  const opt = (t, o) => `<span class="popt ${t.grid === 'pics' ? 'big' : ''}"><i class="pbox"></i>${esc(String(o.label))}</span>`;
  const prmOf = t => t.say && t.autoSay ? (t.kind === 'input' ? 'Hör zu und schreib das Wort.' : 'Hör zu und kreuze an.') : t.prompt;
  const small = t => (/monospace|<svg/.test(t.text || '') || String(t.plain || t.text || '').length <= 42) && (t.kind === 'input' || t.options.reduce((a, o) => a + String(o.label).length, 0) <= 34);
  const part = p => { if (p.match) { const L = 'ABCDEFGHIJ', R = shuffle(p.match.map((m, i) => i)), start = no;
      p.match.forEach((m, i) => { no++; sol.push(`<li><b>${no}.</b> ${L[R.indexOf(i)]} (${esc(m[1])})</li>`); });
      return `<h3 class="ppart">${esc(p.label)} <small>(${p.match.length} P.)</small></h3><p class="pprm">Schreib den passenden Buchstaben ins Kästchen.</p>
        <div class="pmatch">${p.match.map((m, i) => `<div class="ptask"><span class="pno">${start + i + 1}</span><i class="pbox big"></i><b>${esc(m[0])}</b></div><div class="ptask"><span class="pno">${L[i]}</span><span>${esc(p.match[R[i]][1])}</span></div>`).join('')}</div>`; }
    const same = p.tasks.every(t => prmOf(t) === prmOf(p.tasks[0])), grid = p.tasks.every(small);
    return `<h3 class="ppart">${esc(p.label)} <small>(${p.tasks.length} P.)</small></h3>${same && prmOf(p.tasks[0]) ? `<p class="pprm">${esc(prmOf(p.tasks[0]))}</p>` : ''}<div class="${grid ? 'pgrid' : ''}">${p.tasks.map(t => task(t, same)).join('')}</div>`; };
  const task = (t, same) => { no++;
    const rd = t.say && t.autoSay, prm = same ? '' : prmOf(t);
    if (rd) read.push(`<li><b>${no}.</b> ${esc(t.say)}</li>`);
    const ans = t.kind === 'choice' ? (t.options.find(o => o.ok) || {}).label : t.answer != null ? String(t.answer).replace(/\B(?=(\d{3})+(?!\d))/g, /^\d{5,}$/.test(t.answer) ? "'" : '') + (t.unit ? ' ' + t.unit : '') : t.solution;
    sol.push(`<li><b>${no}.</b> ${esc(String(ans == null ? t.solution : ans))}</li>`);
    const txt = rd ? (t.kind === 'input' ? '' : '') : (t.text || '');
    return `<div class="ptask"><span class="pno">${no}</span><div class="pbody">${prm ? `<div class="pprm">${esc(prm)}</div>` : ''}${txt && txt !== '🎧' ? `<div class="ptxt">${txt}</div>` : ''}
      ${t.kind === 'choice' ? `<div class="popts ${t.grid === 'pics' ? 'pics' : ''}">${t.options.map(o => opt(t, o)).join('')}</div>` : `<div class="pline"><span></span>${t.unit ? `<em>${esc(t.unit)}</em>` : ''}</div>`}</div><span class="ppt">/1</span></div>`; };
  const body = G.map(g => `${G.length > 1 ? `<h2 class="punit">${esc(g.f.u.icon || '')} ${esc(g.f.u.no)}: ${esc(g.f.u.title)}</h2>` : ''}${g.parts.map(part).join('')}`).join('');
  const n = no, today = new Date().toLocaleDateString('de-CH'), S = sel.groups[0].f.s;
  G.forEach(g => paperRemember(g.k, g.parts.reduce((a, p) => a + p.tasks.length, 0)));
  app.innerHTML = `<div class="noprint"><h1 class="h1">🖨️ Papiertest</h1>
    <p class="lead">Wie ein Test in der Schule: ausdrucken oder als PDF speichern. Jedes Mal neue Aufgaben.</p>
    <div class="card"><div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:8px">
      <button class="btn primary" id="pprint">🖨️ Drucken / PDF</button><button class="btn" id="pnew">🔄 Neue Aufgaben</button><button class="btn" id="pres">✅ Ergebnis eintragen</button></div>
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="psol" ${solOn ? 'checked' : ''}> Lösungsblatt mitdrucken (eigene Seite)</label>
      <p class="small" style="margin:8px 0 0">Im Druckfenster «Als PDF speichern» wählen, um eine PDF-Datei zu erhalten.</p></div></div>
  <div class="paper">
    <div class="phead"><div><b>${esc(S.icon)} ${esc(S.name)} · ${sel.groups[0].f.g.grade}. Klasse</b><h1>${esc(sel.title)}</h1>${sel.sub ? `<div class="psub">${esc(sel.sub)}</div>` : ''}</div>
      <div class="pmeta"><div>Name: <span class="pfill"></span></div><div>Datum: <span class="pfill"></span></div><div>Punkte: <span class="pfill s"></span> von ${n}</div><div>Note: <span class="pfill s"></span></div></div></div>
    ${sel.lp ? `<p class="plp">Lehrplan 21 St. Gallen: ${esc(sel.lp)}</p>` : ''}
    ${(() => { const gl = sel.groups.flatMap(g => g.f.u.custom && DB.custom[g.f.u.custom] && DB.custom[g.f.u.custom].goals || []); return gl.length ? `<div class="pgoals"><b>Lernziele</b><ul>${gl.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''; })()}
    ${body}
    <p class="pfoot">Viel Erfolg! 🍀 · Lernsprung · ${today}</p>
    <div class="psol ${solOn ? '' : 'off'}"><h2>Lösungen (für die Eltern)</h2><p class="psub">${esc(sel.title)} · ${n} Punkte</p>
      ${read.length ? `<h3 class="ppart">Zum Vorlesen</h3><ul class="plist2">${read.join('')}</ul>` : ''}
      <h3 class="ppart">Lösungen</h3><ol class="plist2">${sol.join('')}</ol>
      <h3 class="ppart">Notenskala</h3>${paperScale(n)}</div>
  </div>`;
  $('#psol').onchange = e => { $('.psol').classList.toggle('off', !e.target.checked); try { localStorage.setItem('lernsprung-druck-lsg', e.target.checked ? '1' : '0'); } catch (x) {} };
  $('#pnew').onclick = () => showPaper(sel);
  $('#pres').onclick = () => showPaperResult(sel);
  $('#pprint').onclick = () => { const t0 = document.title; document.title = `${S.name} ${sel.title} ${today}`.replace(/[\\/:*?"<>|]/g, ' ');
    const back = () => { document.title = t0; removeEventListener('afterprint', back); }; addEventListener('afterprint', back); try { print(); } catch (e) { toast('Drucken geht auf diesem Gerät nicht.'); } };
}
/* Ergebnis eines Papiertests: Eltern tragen die Punkte ein, es zählt wie ein Probetest (Bestnote, Bereitschaft), aber ohne Spielminuten. */
function showPaperResult(sel){
  stop(); crumbs();
  app.innerHTML = `<h1 class="h1">✅ Ergebnis Papiertest</h1><p class="lead">Die Note zählt für den Lernstand und die Prüfungs-Bereitschaft. Spielminuten gibt es dafür keine.</p>
    <div class="card">${sel.groups.map((g, i) => { const l = paperLast(g.k); return `<div style="margin-bottom:12px"><b>${esc(g.f.u.icon || '')} ${esc(g.f.u.title)}</b>
      <div class="row" style="justify-content:flex-start;gap:8px;margin-top:6px"><input class="inp" style="width:5.5em" type="text" inputmode="numeric" maxlength="3" placeholder="Punkte" id="pp${i}">
      <span>von</span><input class="inp" style="width:5.5em" type="text" inputmode="numeric" maxlength="3" id="pn${i}" value="${l ? l.n : ''}"></div></div>`; }).join('')}
      ${PARENT_OK ? '' : `<label for="ppin" style="display:block;margin-top:6px"><b>Eltern-PIN</b></label><input class="inp" id="ppin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">`}
      <button class="btn primary wide" id="psave" style="margin-top:12px">Speichern</button><button class="btn wide" id="pback" style="margin-top:8px">Zurück</button></div>`;
  $('#pback').onclick = () => sel.back();
  $('#psave').onclick = () => {
    if (!PARENT_OK && !anyParentPin($('#ppin').value)) return toast('Falscher Eltern-PIN');
    const rec = []; for (let i = 0; i < sel.groups.length; i++) { const ps = $('#pp' + i).value.trim(); if (ps === '') continue; const pts = +ps, n = +$('#pn' + i).value;
      if (!(n >= 1 && pts >= 0 && pts <= n && Number.isInteger(pts) && Number.isInteger(n))) return toast('Punkte zwischen 0 und der Anzahl Aufgaben eingeben.'); rec.push([sel.groups[i].k, pts, n]); }
    if (!rec.length) return toast('Bitte Punkte eintragen.');
    let last = 0; rec.forEach(([k, pts, n]) => { last = noteOf(pts, n); DB.tests[k] = (DB.tests[k] || []).concat({ d:Date.now(), note:last, pts, n, paper:1 }).slice(-10); });
    save(); toast(rec.length === 1 ? 'Gespeichert: Note ' + fmtNote(last) : 'Ergebnisse gespeichert'); sel.back();
  };
}
function paperUnit(){ const u = NAV.u, k = ukey(), f = { s:NAV.s, g:NAV.g, b:NAV.b, u };
  return { title:u.custom ? u.title : 'Probetest ' + u.no + ': ' + u.title, sub:u.custom ? 'Übungstest' : u.de, lp:u.lp, groups:[{ k, f }], back:showTestIntro }; }
function paperExam(e, back){ const R = e.units.map(k => ({ k, f:findUnit(k) })).filter(x => x.f); if (!R.length) return toast('Diese Prüfung hat keine Themen.');
  const S = R[0].f.s; showPaper({ title:e.title || S.name + '-Prüfung', sub:'Übungsprüfung für ' + new Date(e.d + 'T12:00').toLocaleDateString('de-CH'), groups:R, cap:R.length > 1 ? Math.max(8, Math.round(30 / R.length)) : 0, back }); }

/* =====================================================================
   8) ABLAUF EINER RUNDE (Üben und Test)
   ===================================================================== */
let SES = null;
/* Eigene Bildschirm-Tastatur: keine Wortvorschläge, keine Autokorrektur, kein Wörterbuch der Handy-Tastatur.
   Profil-Einstellung kbd: 'auto' (Standard: nur Handy/Tablet), 'on', 'off'. */
const kbdMode = () => (activeProfile() || {}).kbd || 'auto';
function useKbd(){ const m = kbdMode(); if (m === 'on') return true; if (m === 'off') return false;
  try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } }
let KBD = null;
function detachKbd(){ if (KBD) { document.removeEventListener('keydown', KBD.key); const el = document.getElementById('kbd'); if (el) el.remove(); KBD = null; } }
function attachKbd(inp, form, t){
  detachKbd(); if (!useKbd() || !inp) return;
  inp.readOnly = true; inp.setAttribute('inputmode', 'none'); inp.classList.add('kbdin');
  const fr = NAV.s && NAV.s.id === 'fr', num = !!(t && (t.dec || /\d/.test(String(t.answer || ''))));
  const st = KBD = { inp, form, shift:false, num, key:null };
  const L = [['q','w','e','r','t','z','u','i','o','p','ü'], ['a','s','d','f','g','h','j','k','l','ö','ä'], ['⇧','y','x','c','v','b','n','m','⌫']];
  const N = [['1','2','3','4','5','6','7','8','9','0'], ['+','−','·',':','=','/','(',')','%','°'], ['.',',',"'",'-','?','!','⌫']];
  const ACC = ['é','è','ê','à','â','ç','î','ô','û','ë','œ'];
  const el = document.createElement('div'); el.id = 'kbd'; el.className = 'kbd'; el.setAttribute('aria-label', 'Tastatur');
  form.insertAdjacentElement('afterend', el);
  const k = (c, cls) => `<button type="button" class="kk ${cls || ''}" data-c="${esc(c)}">${esc(c === ' ' ? 'Leerschlag' : c)}</button>`;
  const draw = () => {
    const rows = st.num ? N : L, up = c => st.shift && c.length === 1 ? c.toUpperCase() : c;
    el.innerHTML = (fr && !st.num ? `<div class="kr">${ACC.map(c => k(up(c))).join('')}</div>` : '')
      + rows.map(r => `<div class="kr">${r.map(c => k(c === '⇧' || c === '⌫' ? c : up(c), c === '⇧' ? 'kw' + (st.shift ? ' on' : '') : c === '⌫' ? 'kw' : '')).join('')}</div>`).join('')
      + `<div class="kr">${k(st.num ? 'ABC' : '123', 'kw')}${st.num ? '' : k("'") + k('-')}${k(' ', 'ksp')}${st.num ? '' : k('.')}${k('OK', 'kok')}</div>`;
  };
  const type = c => {
    if (inp.disabled || (SES && SES.locked && inp.id === 'inp')) return;
    if (c === '⌫') inp.value = inp.value.slice(0, -1);
    else if (c === '⇧') { st.shift = !st.shift; return draw(); }
    else if (c === '123' || c === 'ABC') { st.num = !st.num; return draw(); }
    else if (c === 'OK') { form.dispatchEvent(new Event('submit', { cancelable:true, bubbles:true })); return; }
    else { inp.value += c === '−' ? '-' : c; if (st.shift) { st.shift = false; draw(); } }
    inp.dispatchEvent(new Event('input', { bubbles:true }));
  };
  el.addEventListener('pointerdown', e => { if (e.target.closest('.kk')) e.preventDefault(); });
  el.addEventListener('click', e => { const b = e.target.closest('.kk'); if (b) type(b.dataset.c); });
  st.key = e => { if (KBD !== st || !document.body.contains(inp) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Backspace') { e.preventDefault(); type('⌫'); } else if (e.key === 'Enter') { e.preventDefault(); type('OK'); }
    else if (e.key.length === 1) { e.preventDefault(); inp.value += e.key; } };
  document.addEventListener('keydown', st.key);
  draw();
}
/* Angefangene Tests (Probetest, Übungstest) pro Profil und Test speichern, um später weiterzumachen. Nur auf diesem Gerät. */
const PAUSE_STORE = 'lernsprung-pause', PAUSE_DAYS = 14;
let PAUSEMEM = (() => { try { return JSON.parse(localStorage.getItem(PAUSE_STORE) || '{}'); } catch (e) { return {}; } })();
const pauseKey = k => ACTIVE + '|' + k;
function pauseWrite(){ const lim = Date.now() - PAUSE_DAYS * 864e5; Object.keys(PAUSEMEM).forEach(k => { if (PAUSEMEM[k].d < lim) delete PAUSEMEM[k]; });
  try { localStorage.setItem(PAUSE_STORE, JSON.stringify(PAUSEMEM)); } catch (e) {} }
const pauseGet = k => { const p = PAUSEMEM[pauseKey(k)]; return p && p.d > Date.now() - PAUSE_DAYS * 864e5 && p.i < p.tasks.length ? p : null; };
function pauseClear(k){ delete PAUSEMEM[pauseKey(k)]; pauseWrite(); }
function pauseSave(){
  if (!SES || !SES.test || SES.fix) return; const k = SES.histKey || ukey();
  PAUSEMEM[pauseKey(k)] = { d:Date.now(), i:SES.i, right:SES.right, think:SES.think || 0, tasks:SES.tasks, res:SES.results.map(r => [r.given == null ? null : r.given, r.ok ? 1 : 0]) };
  pauseWrite();
}
function resume(k, restart){
  const p = pauseGet(k); if (!p) return restart();
  const tasks = JSON.parse(JSON.stringify(p.tasks));
  run(tasks, { test:true, histKey:k === ukey() ? undefined : k, restart, i:p.i, right:p.right, think:p.think, results:p.res.map((r, j) => ({ t:tasks[j], given:r[0], ok:!!r[1] })) });
}
function pauseBox(k){
  const p = pauseGet(k); if (!p) return '';
  return `<div class="card pausebox"><b>⏸️ Angefangen am ${new Date(p.d).toLocaleDateString('de-CH', { weekday:'short', day:'numeric', month:'numeric' })}</b>
    <p class="small" style="margin:4px 0 10px">${p.i} von ${p.tasks.length} Aufgaben gemacht. Du kannst dort weitermachen, wo du aufgehört hast.</p>
    <button class="btn primary wide" id="resume">▶️ Weitermachen bei Aufgabe ${p.i + 1}</button></div>`;
}
function run(tasks, opt){ stop(); SES = Object.assign({ tasks, i:0, right:0, streak:0, results:[], test:false, locked:false }, opt); showTask(); }

function showTask(){
  SES.locked = false; SES.shown = Date.now(); SES.caseHint = false;
  const t = SES.tasks[SES.i], n = SES.tasks.length;
  if (t.kind === 'input' && !t.numeric && t.cs === undefined) t.cs = !!(NAV.s && NAV.s.id === 'de');
  let h = '';
  if (t.part) h += `<span class="part">${esc(t.part)}</span>`;
  if (t.prompt) h += `<div class="q">${esc(t.prompt)}</div>`;
  if (t.pic) h += `<div class="pic">${t.pic}</div>`;
  if (t.text) h += `<div class="word ${t.plain && t.plain.length > 45 ? 'long' : ''}">${t.text}</div>`;
  if (t.hint) h += `<div class="small">${esc(t.hint)}</div>`;
  if (t.say && canSpeak()) h += `<div class="row"><button class="btn" id="say">🔊 Anhören</button></div>`;
  if (t.kind === 'choice') h += `<div class="opts ${t.grid || ''}">${t.options.map((o,k) => `<button class="btn opt ${o.big ? 'bigopt' : ''}" data-k="${k}">${esc(o.label)}</button>`).join('')}</div>`;
  if (t.kind === 'input') h += `<form class="inrow" id="inf" autocomplete="off"><input id="inp" class="inp" ${t.im ? `inputmode="${t.im}"` : t.numeric ? 'inputmode="numeric"' : ''} autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort">${t.unit ? `<span class="ulbl">${esc(t.unit)}</span>` : ''}<button class="btn primary" type="submit">Prüfen</button></form>`;
  if (t.kind === 'spell') {
    const letters = t.word.en.split('');
    const extra = shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !letters.includes(c))).slice(0,2);
    t.tiles = shuffle(letters.concat(extra)).map((c,id) => ({ c, id, used:false })); t.ans = [];
    h += `<div class="row"><button class="btn" id="sp1">🔊 Buchstabieren</button><button class="btn" id="sp2">🐢 Langsam</button></div>
      <div class="slots" id="slots"></div><div class="ltiles" id="ltiles"></div>
      <div class="row"><button class="btn" id="del">⌫ Löschen</button></div>`;
  }
  h += `<div class="fb" id="fb" aria-live="polite"></div>`;
  app.innerHTML = bar(SES.i, n, (SES.test ? 'Test: ' : '') + `Aufgabe ${SES.i + 1} von ${n}`) + `<div class="card center">${h}</div>`
    + (SES.test && !SES.fix ? '<div class="row"><button class="linkbtn" id="tpause">⏸️ Pause: später weitermachen</button></div>' : '');
  if (SES.test && !SES.fix) { pauseSave(); $('#tpause').onclick = () => { pauseSave(); toast('Test gespeichert. Du kannst später weitermachen.'); showUnit(); }; }

  const tk = TOKEN;
  if ($('#say')) $('#say').onclick = () => speak(t.say, .85);
  if (t.autoSay && canSpeak()) setTimeout(() => { if (tk === TOKEN) speak(t.say, .85); }, 350);

  if (t.kind === 'choice') app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (SES.locked) return;
    const k = +b.dataset.k, ok = t.options[k].ok;
    if (SES.test) b.classList.add('picked');
    else {
      app.querySelectorAll('.opt').forEach((x,j) => { x.disabled = true; if (t.options[j].ok) x.classList.add('ok'); });
      if (!ok) b.classList.add('no');
    }
    answer(ok, t.options[k].label);
  });
  detachKbd();
  if (t.kind === 'input') {
    const inp = $('#inp');
    if (!t.numeric) attachKbd(inp, $('#inf'), t);
    if (!KBD) inp.focus();
    $('#inf').onsubmit = e => {
      e.preventDefault();
      if (SES.locked) return;
      if (!inp.value.trim()) { inp.focus(); return; }
      const c = inputCheck(t, inp.value), ok = c.ok; SES.caseHint = !!c.caseOnly; SES.accentHint = !!c.accent;
      if (!SES.test) { inp.classList.add(ok ? 'ok' : 'no'); inp.disabled = true; if (ok) detachKbd(); }
      answer(ok, inp.value.trim());
    };
  }
  if (t.kind === 'spell') {
    $('#sp1').onclick = () => spellOut(t.word.en, .8);
    $('#sp2').onclick = () => spellOut(t.word.en, .5);
    $('#del').onclick = () => { if (SES.locked || !t.ans.length) return; t.ans.pop().used = false; drawSpell(t); };
    drawSpell(t);
    setTimeout(() => { if (tk === TOKEN) spellOut(t.word.en, .8); }, 400);
  }
}

function drawSpell(t){
  $('#slots').innerHTML = t.word.en.split('').map((_,k) => `<div class="slot ${t.ans[k] ? 'f' : ''}" data-k="${k}">${t.ans[k] ? t.ans[k].c : ''}</div>`).join('');
  $('#ltiles').innerHTML = t.tiles.map(x => `<button class="btn ltile ${x.used ? 'used' : ''}" data-id="${x.id}" aria-label="Buchstabe ${x.c}">${x.c}</button>`).join('');
  app.querySelectorAll('.ltile').forEach(b => b.onclick = () => pickTile(t, +b.dataset.id));
  app.querySelectorAll('.slot.f').forEach(s => s.onclick = () => { if (SES.locked) return; t.ans.splice(+s.dataset.k, 1)[0].used = false; drawSpell(t); });
}
function pickTile(t, id){
  if (SES.locked) return;
  const x = t.tiles.find(y => y.id === id); if (!x || x.used) return;
  x.used = true; t.ans.push(x); speak(letterName(x.c), .9);
  drawSpell(t);
  if (t.ans.length === t.word.en.length) {
    const given = t.ans.map(y => y.c).join(''), ok = given === t.word.en;
    $('#slots').classList.add(ok ? 'ok' : 'no');
    answer(ok, given);
  }
}
document.addEventListener('keydown', e => {
  if (!SES || SES.locked || !app.contains($('#ltiles'))) return;
  const t = SES.tasks[SES.i]; if (!t || t.kind !== 'spell') return;
  if (e.key === 'Backspace') { e.preventDefault(); $('#del').click(); return; }
  const k = e.key.toLowerCase();
  if (/^[a-z]$/.test(k)) { const x = t.tiles.find(y => !y.used && y.c === k); if (x) pickTile(t, x.id); }
});

function answer(ok, given){
  if (SES.locked) return; SES.locked = true;
  const t = SES.tasks[SES.i];
  SES.results.push({ t, given, ok });
  const dt = Date.now() - (SES.shown || Date.now());
  SES.think = (SES.think || 0) + Math.min(60000, dt);
  try { track(ok, dt, { q:t.plain || t.text || t.prompt, a:given, c:t.solution }); } catch (e) {}
  if (ok) SES.right++;
  if (t.word && !ok) markWord(t.word, 0, t.wkey);
  const tk = ++TOKEN;

const MIN_PRACTICE = { 6:4, 5.5:3 };

const tooFast = () => SES && SES.results.length >= 3 && (SES.think || 0) / SES.results.length < 2000;
function earnNote(note, table, key, extra){
  const base = table[note] || 0;
  const r = base > 0 ? earn(base + (extra || 0), key) : { add:0, why:'low' };
  const pts = base > 0 && !['repeat', 'unapproved', 'fast'].includes(r.why) ? (table === MIN_TEST ? (note >= 6 ? 3 : 2) : 1) : 0;
  if (pts) { addPoints(pts); r.pts = pts; save(); }
  if (note >= 5.5) setTimeout(() => { try { celebrate(); } catch (e) {} }, 250);
  const next = Object.keys(table).map(Number).sort((a,b) => a - b).find(x => x > note);
  if (next) r.hint = `Mit Note ${fmtNote(next)} ${base > 0 ? 'hättest du' : 'gibt es'} ${table[next]} Minute${table[next] > 1 ? 'n' : ''}${base > 0 ? ' bekommen' : ''}.`;
  return r;
}
function earn(min, key){
  if (NAV.u && NAV.u.custom && !listApproved(NAV.u.custom)) return { add:0, why:'unapproved' };
  const P = playState(), max = maxMin();
  if (P.earned >= max) return { add:0, why:'max' };
  if (key) { const c = P.cnt[key] || 0; if (c >= 2) return { add:0, why:'repeat' }; P.cnt[key] = c + 1; }
  const before = P.earned; P.earned = Math.min(max, P.earned + min);
  save(); updatePlay();
  return { add:Math.round(P.earned - before), why: P.earned >= max ? 'max' : '' };
}

function startGame(){

  GAME = { y:GROUND, vy:0, obs:[], stars:[], t:0, speed:7, score:0, last:0, acc:0, tk:TOKEN, lastRun:false, extra:0, nextObs:70, nextStar:120, saved:0 };

function gameJump(){ if (GAME && GAME.y >= GROUND - 1) GAME.vy = -15.5; }
document.addEventListener('keydown', e => { if (GAME && (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp')) { e.preventDefault(); gameJump(); } });
function gameLoop(ts){
  const G = GAME; if (!G || G.tk !== TOKEN || !$('#cv')) return;
  if (!G.last) G.last = ts;
  const dt = Math.min(50, ts - G.last), f = dt / 16.67; G.last = ts;
  G.acc += dt;
  if (G.acc >= 1000) {
    G.acc -= 1000;
    if (!G.lastRun) { const P = playState(); P.used = Math.min(P.used + 1 / 60, Math.min(P.earned, maxMin()) + (P.bonus || 0)); if (remaining() <= 0) G.lastRun = true; }
    else G.extra++;
    const el = $('#gRest'); if (el) el.textContent = fmtRest(); updatePlay();
    if (++G.saved % 10 === 0) save();
  }
  G.t += f; G.speed = 7 + G.t / 500;
  G.vy += 0.85 * f; G.y += G.vy * f; if (G.y > GROUND) { G.y = GROUND; G.vy = 0; }
  G.nextObs -= f; if (G.nextObs <= 0) { G.obs.push({ x:760, e:pick(['🪨','🌵','🪵']) }); G.nextObs = rnd(55,105) * Math.max(.6, 7 / G.speed); }
  G.nextStar -= f; if (G.nextStar <= 0) { G.stars.push({ x:760, y:GROUND - rnd(70,150) }); G.nextStar = rnd(80,160); }
  G.obs.forEach(o => o.x -= G.speed * f); G.stars.forEach(s => s.x -= G.speed * f);
  G.obs = G.obs.filter(o => o.x > -60); G.stars = G.stars.filter(s => s.x > -60 && !s.got);
  G.score += G.speed * f / 20;
  G.stars.forEach(s => { if (Math.abs(s.x + 15 - 90) < 30 && Math.abs(s.y - 12 - (G.y - 24)) < 36) { s.got = true; G.score += 10; } });
  const hit = G.obs.some(o => o.x < 104 && o.x + 34 > 76 && G.y > GROUND - 32);
  scene($('#cv').getContext('2d'), G);
  if (hit || (G.lastRun && G.extra >= 60)) return gameOver();

}
function scene(ctx, G){
  const W = 720, H = 320, sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#8fd3ff'); sky.addColorStop(1, '#e9f7ff'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#b7e4a1'; ctx.beginPath(); ctx.moveTo(0, GROUND + 4);
  for (let x = 0; x <= W; x += 30) ctx.lineTo(x, GROUND - 34 - 18 * Math.sin((x + G.t * 2) / 90));
  ctx.lineTo(W, GROUND + 4); ctx.fill();
  ctx.fillStyle = '#6fbf5c'; ctx.fillRect(0, GROUND + 2, W, H - GROUND);
  ctx.textBaseline = 'alphabetic';
  ctx.font = '40px serif'; G.obs.forEach(o => ctx.fillText(o.e, o.x, GROUND + 6));
  ctx.font = '30px serif'; G.stars.forEach(s => ctx.fillText('⭐', s.x, s.y));
  ctx.save(); ctx.translate(112, G.y + 4); ctx.scale(-1, 1); ctx.font = '46px serif'; ctx.fillText('🦘', 0, 0); ctx.restore();
  ctx.fillStyle = '#1b2238'; ctx.font = 'bold 22px Nunito, sans-serif'; ctx.fillText('⭐ ' + Math.floor(G.score), 16, 34);
  if (G.lastRun) { ctx.fillStyle = '#ef4444'; ctx.fillText('Letzte Runde!', W - 170, 34); }
}

/* Biometrie (Fingerabdruck, Gesicht, Bildschirmsperre) über WebAuthn – nur auf diesem Gerät, ergänzt den Eltern-PIN.

const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

}
async function bioRegister(){
  const cred = await navigator.credentials.create({ publicKey:{ challenge:rnd32(), rp:{ name:'Lernsprung', id:location.hostname },
    user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:'eltern', displayName:'Eltern-Bereich Lernsprung' },
    pubKeyCredParams:[{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
    authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' }, timeout:60000, attestation:'none' } });
  if (!cred) throw new Error('abgebrochen');
  DEV.bio = b64u(cred.rawId); saveDev();
}
async function bioVerify(){
  const a = await navigator.credentials.get({ publicKey:{ challenge:rnd32(), rpId:location.hostname, allowCredentials:[{ type:'public-key', id:unb64u(DEV.bio) }], userVerification:'required', timeout:60000 } });
  const ad = new Uint8Array(a.response.authenticatorData);

const dayStr = dt => { const z = n => String(n).padStart(2, '0'); return dt.getFullYear() + '-' + z(dt.getMonth() + 1) + '-' + z(dt.getDate()); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const subjOf = k => CATALOG.find(s => k.startsWith(s.id + '-'));
const fmtDur = sec => sec >= 3600 ? Math.floor(sec / 3600) + ' h ' + Math.round(sec % 3600 / 60) + ' Min' : Math.round(sec / 60) + ' Min';
const pct = (a, n) => n ? Math.round(100 * a / n) : 0;
function weekSum(log, from){ const o = { s:0, n:0, ok:0, days:0 }; for (let i = 0; i < 7; i++) { const e = log[dayStr(addDays(from, i))]; if (e && e.n) { o.s += e.s || 0; o.n += e.n; o.ok += e.ok || 0; o.days++; } } return o; }
function statsOf(id){
  const D = profPD(id), log = D.log || {}, now = new Date(), w0 = weekStart(now), names = unitNames();
  const cur = weekSum(log, w0), prev = weekSum(log, addDays(w0, -7));
  const days = []; for (let i = 13; i >= 0; i--) { const k = dayStr(addDays(now, -i)), e = log[k] || {}; days.push({ k, s:e.s || 0, n:e.n || 0, ok:e.ok || 0 }); }
  const units = {}; Object.values(log).forEach(e => Object.entries(e.u || {}).forEach(([k, v]) => { const u = units[k] = units[k] || [0, 0]; u[0] += v[0]; u[1] += v[1]; }));
  const subj = {}; Object.entries(units).forEach(([k, v]) => { const S = subjOf(k); if (!S) return; const o = subj[S.id] = subj[S.id] || { S, n:0, ok:0, best:0, units:0 }; o.n += v[0]; o.ok += v[1]; });
  Object.entries(D.tests || {}).forEach(([k, arr]) => { const S = subjOf(k); if (!S) return; const o = subj[S.id] = subj[S.id] || { S, n:0, ok:0, best:0, units:0 }; o.best = Math.max(o.best, ...arr.map(t => t.note || 0)); if (arr.some(t => t.note >= 5.5)) o.units++; });
  const ranked = Object.entries(units).filter(([, v]) => v[0] >= 10).map(([k, v]) => ({ k, name:names[k] || k, n:v[0], p:pct(v[1], v[0]) })).sort((a, b) => b.p - a.p);
  const notes = Object.entries(D.tests || {}).flatMap(([k, arr]) => arr.map(t => ({ d:t.d, note:t.note, name:names[k] || k }))).sort((a, b) => a.d - b.d).slice(-20);
  const errs = {}; (D.err || []).forEach(e => { const x = errs[e.k + '|' + e.q] = errs[e.k + '|' + e.q] || Object.assign({ cnt:0 }, e); x.cnt++; x.a = e.a; });
  return { D, cur, prev, days, subj:Object.values(subj).sort((a, b) => b.n - a.n), top:ranked.slice(0, 3), low:ranked.slice(Math.max(3, ranked.length - 3)).reverse(), notes,
    errs:Object.values(errs).sort((a, b) => b.cnt - a.cnt || b.d - a.d), names };
}
function trend(a, b, unit){ if (!b) return ''; const d = a - b; return d === 0 ? ' <span class="small">= Vorwoche</span>' : ` <span class="small" style="color:var(${d > 0 ? '--ok' : '--bad'})">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit || ''}</span>`; }
function barsSVG(days){
  const mx = Math.max(10, ...days.map(d => d.s / 60)), W = 14 * 22;
  return `<svg viewBox="0 0 ${W} 96" class="dbars" role="img" aria-label="Lernminuten der letzten 14 Tage">${days.map((d, i) => { const h = Math.round(68 * (d.s / 60) / mx), x = i * 22 + 3, wd = new Date(d.k + 'T12:00').getDay();
    return `<rect x="${x}" y="${74 - h}" width="16" height="${Math.max(h, d.n ? 2 : 0)}" rx="3" fill="var(--c)" opacity="${i >= 7 ? 1 : .45}"><title>${new Date(d.k + 'T12:00').toLocaleDateString('de-CH', { weekday:'short', day:'numeric', month:'numeric' })}: ${Math.round(d.s / 60)} Min, ${d.n} Aufgaben</title></rect>
      <text x="${x + 8}" y="90" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">${'SMDMDFS'[wd]}</text>`; }).join('')}<line x1="0" y1="74.5" x2="${W}" y2="74.5" stroke="currentColor" opacity=".2"/></svg>`;
}
function notesSVG(notes){

    <polyline fill="none" stroke="var(--c)" stroke-width="2.5" points="${notes.map((t, i) => x(i) + ',' + y(t.note)).join(' ')}"/>

function weekReport(P, st){
  const c = st.cur, lines = [`Lernsprung – Wochenbericht für ${P.name}`, `Woche ab ${weekStart(new Date()).toLocaleDateString('de-CH')}`, '',

  const wk = weekStart(new Date()).getTime(), tests = st.notes.filter(t => t.d >= wk);
  if (tests.length) lines.push('Probetests: ' + tests.map(t => `${t.name} (Note ${fmtNote(t.note)})`).join(', '));
  if (st.top.length) lines.push('Stark: ' + st.top.map(t => t.name).join(', '));

  liveExams(P.id).filter(e => daysTo(e.d) >= 0 && daysTo(e.d) <= 14).forEach(e => { const S = CATALOG.find(x => x.id === e.s); lines.push(`Prüfung ${whenTxt(daysTo(e.d))}: ${e.title || (S ? S.name : '')} (${e.units.map(k => { const f = findUnit(k); return f ? f.u.title : ''; }).filter(Boolean).join(', ')})`); });

const GOAL_BONUS = 5;
const goalOf = id => (profCfg(id) || {}).goal || null;
function goalState(id){
  const g = goalOf(id); if (!g || (!g.min && !g.days)) return null;
  const w = weekSum(profPD(id).log || {}, weekStart(new Date())), min = Math.floor(w.s / 60);
  const okMin = !g.min || min >= g.min, okDays = !g.days || w.days >= g.days;
  return { g, min, days:w.days, done:okMin && okDays, p:Math.min(100, Math.round(100 * ((g.min ? Math.min(1, min / g.min) : 1) + (g.days ? Math.min(1, w.days / g.days) : 1)) / 2)) };
}
function checkGoal(){
  const st = goalState(ACTIVE); if (!st || !st.done) return;
  const k = 'W' + dayStr(weekStart(new Date())); DB.pt = DB.pt || {}; if (DB.pt[k]) return;
  DB.pt[k] = GOAL_BONUS; toast(`🎯 Wochenziel geschafft! +${GOAL_BONUS} Lernpunkte`);
}
function goalHTML(id, kid){
  const st = goalState(id); if (!st) return '';
  const parts = []; if (st.g.min) parts.push(`${st.min} von ${st.g.min} Min`); if (st.g.days) parts.push(`${st.days} von ${st.g.days} Tagen`);
  return `<div class="card goal"><b>🎯 Wochenziel${st.done ? ' geschafft! 🎉' : ''}</b><span class="small">${parts.join(' · ')}${kid && !st.done ? ` · dann +${GOAL_BONUS} 🏅` : ''}</span><span class="dbar"><i style="width:${st.p}%"></i></span></div>`;
}
/* Prüfungen: DB.exams[id] = { id, p:Profil, d:'YYYY-MM-DD', s:Fach, g:Klasse, units:[unitKey], title, note?, by, t, del } */
const liveExams = pid => Object.values(DB.exams || {}).filter(e => e && !e.del && (!pid || e.p === pid)).sort((a, b) => a.d < b.d ? -1 : 1);
const daysTo = d => Math.round((new Date(d + 'T12:00') - new Date(dayStr(new Date()) + 'T12:00')) / 864e5);
function findUnit(k){
  for (const s of CATALOG) for (const g of s.grades) for (const b of g.books) for (const u of b.units) if ([s.id, g.grade, b.id, u.id].join('-') === k) return { s, g, b, u };
  return null;
}
function openUnit(k){ const f = findUnit(k); if (!f) return toast('Dieses Thema gibt es nicht mehr.'); NAV.n = f.g.grade; NAV.s = f.s; NAV.g = f.g; NAV.b = f.b; NAV.u = f.u; setColor(); showUnit(); }
/* Notenfarben: 5,5–6 dunkelgrün, 5–5,4 hellgrün, 4–4,9 gelb, unter 4 rot, ohne Probetest grau */
const noteColor = n => !n ? '#c3c9d6' : n >= 5.5 ? '#0b7a4b' : n >= 5 ? '#7fd08f' : n >= 4 ? '#f5b800' : '#ef4444';
const ndot = n => `<i class="ndot" style="background:${noteColor(n)}"></i>`;
function readiness(pid, k){
  const D = profPD(pid), best = (D.tests[k] || []).reduce((m, t) => Math.max(m, t.note || 0), 0);
  let n = 0, ok = 0; Object.values(D.log || {}).forEach(e => { const v = (e.u || {})[k]; if (v) { n += v[0]; ok += v[1]; } });
  const score = best ? best : n ? 1 + 4 * ok / n : 0;
  return { best, n, p:pct(ok, n), score, sym:ndot(best) };
}
function examPlan(e){
  const L = daysTo(e.d), R = e.units.map(k => ({ k, f:findUnit(k), r:readiness(e.p, k) })).filter(x => x.f);
  const weak = R.slice().sort((a, b) => a.r.score - b.r.score)[0];
  let tip;
  if (L < 0) tip = 'Vorbei';
  else if (L === 0) tip = 'Heute ist die Prüfung. Viel Glück! 🍀';
  else if (L === 1) tip = 'Morgen ist die Prüfung: Mach heute nochmals den Probetest' + (R.length > 1 ? 's' : '') + ' und schlaf gut.';
  else if (!weak) tip = 'Wähle ein Thema und übe.';
  else if (R.every(x => x.r.best >= 5.5)) tip = 'Alles im grünen Bereich! Wiederhole kurz und mach einen Probetest.';
  else tip = `Heute üben: ${weak.f.u.title}` + (weak.r.n >= 20 && !weak.r.best ? ' (jetzt den Probetest probieren)' : '');
  return { L, R, weak, tip };
}

/* Update-Prüfung: lädt eine neue Version, sobald sie online ist */
const APP_VERSION = '2026-11-08-1';
async function checkUpdate(){
  if (!isHosted()) return;
  try {
    const r = await fetch(new URL('index.html', document.baseURI).pathname + '?v=' + Date.now(), { cache:'no-store' }); if (!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION || $('#upd')) return;
    const bar = document.createElement('button'); bar.id = 'upd'; bar.className = 'toast'; bar.style.border = 'none'; bar.style.cursor = 'pointer';
    bar.textContent = '✨ Neue Version da – tippen zum Laden'; bar.onclick = () => location.reload();
    document.body.appendChild(bar);
  } catch (e) {}
}
setTimeout(checkUpdate, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
