const HN = h => ((h - 1) % 12 + 12) % 12 + 1;
function clockPhrase(h, m){
  const n = HN(h + 1);
  if (m === 0) return `${HN(h)} Uhr`;
  if (m === 15) return `Viertel nach ${HN(h)}`;
  if (m === 30) return `halb ${n}`;
  if (m === 45) return `Viertel vor ${n}`;
  if (m === 25) return `5 vor halb ${n}`;
  if (m === 35) return `5 nach halb ${n}`;
  return m < 30 ? `${m} nach ${HN(h)}` : `${60 - m} vor ${n}`;
}
function setClockSVG(){
  let s = '<svg id="sclock" class="clock" viewBox="0 0 140 140" role="img" aria-label="Uhr zum Stellen"><circle cx="70" cy="70" r="64" fill="#fff" stroke="#1b2238" stroke-width="3"/>';
  const p = (r, a) => [(70 + r * Math.sin(a)).toFixed(1), (70 - r * Math.cos(a)).toFixed(1)];
  for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, big = i % 5 === 0, [x1,y1] = p(big ? 54 : 59, a), [x2,y2] = p(62, a);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1b2238" stroke-width="${big ? 2.2 : 1}"/>`; }
  for (let n = 1; n <= 12; n++) { const [x,y] = p(44, n * Math.PI / 6); s += `<text x="${x}" y="${(+y + 5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2238" font-family="sans-serif">${n}</text>`; }
  return s + '<line id="hh" x1="70" y1="70" x2="70" y2="40" stroke="#1b2238" stroke-width="7" stroke-linecap="round"/><line id="mh" x1="70" y1="70" x2="70" y2="18" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="70" r="5" fill="#1b2238"/></svg>';
}
function showClock(){
  stop(); crumbs();
  const tk = TOKEN, N = 10, tasks = Array.from({ length:N }, () => { const h = rnd(1, 12), m = rnd(0, 11) * 5, dig = Math.random() < .4;
    return { h, m, txt: dig ? `${Math.random() < .5 && h < 12 ? h + 12 : h}:${String(m).padStart(2, '0')}` : clockPhrase(h, m) }; });
  LG = { i:0, right:0, h:12, m:0, drag:null };
  app.innerHTML = `<div id="lg"><div class="progress"><div id="cbar" style="width:0%"></div></div><p class="small center" id="cno"></p>
    <div class="card center"><div class="q">Stell die Uhr auf:</div><div class="word" id="ctarget"></div>
      <div class="clockwrap">${setClockSVG()}</div>
      <p class="small">Zieh die Zeiger mit dem Finger. Kurzer Zeiger = Stunden, langer roter Zeiger = Minuten.</p>
      <div class="row"><button class="btn" id="hm">− Std</button><button class="btn" id="hp">+ Std</button><button class="btn" id="mm">− 5 Min</button><button class="btn" id="mp">+ 5 Min</button></div>
      <div id="cfb"></div><div class="row"><button class="btn primary" id="ccheck">Prüfen</button></div></div></div>`;
  const svg = $('#sclock');
  const drawHands = (bad) => {
    const ha = ((LG.h % 12) * 30 + LG.m * .5) * Math.PI / 180, ma = LG.m * 6 * Math.PI / 180;
    $('#hh').setAttribute('x2', (70 + 30 * Math.sin(ha)).toFixed(1)); $('#hh').setAttribute('y2', (70 - 30 * Math.cos(ha)).toFixed(1));
    $('#mh').setAttribute('x2', (70 + 52 * Math.sin(ma)).toFixed(1)); $('#mh').setAttribute('y2', (70 - 52 * Math.cos(ma)).toFixed(1));
  };
  const show = () => { const t = tasks[LG.i]; $('#ctarget').textContent = t.txt; $('#cno').textContent = `Aufgabe ${LG.i + 1} von ${N}`;
    $('#cbar').style.width = (LG.i / N * 100) + '%'; $('#cfb').innerHTML = ''; LG.lock = false; LG.shown = Date.now(); drawHands(); };
  const ang = e => { const r = svg.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2; return (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360; };
  const setFrom = a => { if (LG.drag === 'm') LG.m = Math.round(a / 30) % 12 * 5; else LG.h = HN(Math.round((a - LG.m * .5) / 30) || 12); drawHands(); };
  svg.addEventListener('pointerdown', e => { if (LG.lock) return; e.preventDefault(); const a = ang(e), ha = (LG.h % 12) * 30 + LG.m * .5, ma = LG.m * 6;
    const d = x => Math.min(Math.abs(a - x), 360 - Math.abs(a - x)); LG.drag = d(ma) <= d(ha) ? 'm' : 'h'; try { svg.setPointerCapture(e.pointerId); } catch (x) {} setFrom(a); });
  svg.addEventListener('pointermove', e => { if (LG.drag && !LG.lock) setFrom(ang(e)); });
  const up = () => { LG && (LG.drag = null); }; svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  const nudge = (dh, dm) => { if (LG.lock) return; LG.m += dm; if (LG.m >= 60) { LG.m -= 60; dh++; } if (LG.m < 0) { LG.m += 60; dh--; } LG.h = HN(LG.h + dh); drawHands(); };
  $('#hm').onclick = () => nudge(-1, 0); $('#hp').onclick = () => nudge(1, 0); $('#mm').onclick = () => nudge(0, -5); $('#mp').onclick = () => nudge(0, 5);
  LG.finish = () => { const note = noteOf(LG.right, N);
    lgEnd(['🕒', 'Alle Uhren gestellt!'], `<p class="word">${LG.right} von ${N} richtig</p><p style="margin:-6px 0 0;font-weight:800">Note ${fmtNote(note)}</p>`, earnNote(note, MIN_PRACTICE, 'g:clock:' + ukey()), showClock); };
  $('#ccheck').onclick = () => {
    if (LG.lock) { LG.i++; if (LG.i >= N) LG.finish(); else { $('#ccheck').textContent = 'Prüfen'; show(); } return; }
    const t = tasks[LG.i], ok = HN(LG.h) === HN(t.h) && LG.m === t.m; LG.lock = true;
    if (ok) { LG.right++; DB.stars++; save(); updateStars(); $('#cfb').innerHTML = `<div class="fb good">${pick(PRAISE)} ⭐</div>`; setTimeout(() => { if (tk === TOKEN && LG && LG.lock) $('#ccheck').click(); }, 1200); }
    else { LG.h = t.h; LG.m = t.m; drawHands(); $('#cfb').innerHTML = `<div class="fb wrong">So ist es richtig: ${HN(t.h)}:${String(t.m).padStart(2, '0')} Uhr</div>`; }
    $('#ccheck').textContent = 'Weiter';
  };
  show();
}

    ? [...M.cantons.filter(c => c.n !== 'Basel-Stadt').map(c => ({ t:'c', n:c.n, q:`Tippe auf den Kanton ${c.n}.` })), ...M.places.map(p => ({ t:'p', n:p.n, q:`Wo liegt ${p.n}? Tippe auf den Punkt.` })), ...M.lakes.filter(l => !['Zugersee','Brienzersee','Bielersee'].includes(l.n)).map(l => ({ t:'l', n:l.n, q:`Wo ist der ${l.n}?` }))]
    : mode === 'sg1'
    ? [...M.cantons.map(c => ({ t:'c', n:c.n, q:`Tippe auf den Kanton ${c.n}.` })), ...M.lakes.map(l => ({ t:'l', n:l.n, q:`Wo ist der ${l.n}?` })), { t:'p', n:'St. Gallen', q:'Wo liegt der Hauptort St. Gallen?' }]

      ${M.labels.map(l => `<text class="klab" x="${l.x}" y="${l.y}" text-anchor="middle">${esc(l.n)}</text>`).join('')}
      ${M.places.map(p => `<g class="kp" data-t="p" data-n="${esc(p.n)}"><circle class="kphit" cx="${p.x}" cy="${p.y}" r="${M.hit || 11}"/><circle class="kpdot" cx="${p.x}" cy="${p.y}" r="${M.dot || 4}"/></g>`).join('')}
      <text id="kname" class="kname" x="${M.w / 2}" y="${M.h - 6}" text-anchor="middle" style="font-size:${M.fs || 11}px"></text>
    </svg>${mode === 'ch' ? '<p class="small center">Tipp: Mit zwei Fingern kannst du die Karte vergrössern.</p>' : ''}<div id="kfb" class="center"></div></div></div>`;
  const svg = $('#kmap');
  const show = () => { const q = qs[LG.i]; $('#kq').textContent = q.q; $('#kbar').style.width = (LG.i / N * 100) + '%';
    svg.dataset.mode = q.t; svg.querySelectorAll('.hit-ok,.hit-no,.hit-show').forEach(x => x.classList.remove('hit-ok', 'hit-no', 'hit-show')); $('#kname').textContent = ''; $('#kfb').innerHTML = ''; LG.lock = false; };
  LG.finish = () => { const note = noteOf(LG.right, N);
    lgEnd(['🗺️', 'Karte geschafft!'], `<p class="word">${LG.right} von ${N} richtig</p><p style="margin:-6px 0 0;font-weight:800">Note ${fmtNote(note)}</p><p class="earn off">Die Karte trainiert dein Wissen über den Kanton. Spielminuten gibt es beim Üben und im Probetest.</p>`, null, showMap); };
  svg.addEventListener('click', e => {
    if (LG.lock) return; const el = e.target.closest('[data-t]'), q = qs[LG.i]; if (!el || el.dataset.t !== q.t) return;
    LG.lock = true; const ok = el.dataset.n === q.n, target = [...svg.querySelectorAll(`[data-t="${q.t}"]`)].find(x => x.dataset.n === q.n);
    el.classList.add(ok ? 'hit-ok' : 'hit-no'); if (!ok) target.classList.add('hit-show');

function testPlan(u){
  const label = pl => pl.map((p,i) => Object.assign(p, { label:`Teil ${i+1}: ${p.name}` }));
  if (u.gen || u.quiz) {
    const pl = [], gc = u.quiz ? 6 : 12;
    if (u.gen && u.choiceOnly) pl.push({ name:(u.labels && u.labels.calc || [,'Fragen'])[1], n:gc, make: () => Array.from({ length:gc }, () => B.calc(u)) });
    else if (u.gen) {
      pl.push({ name:(u.labels && u.labels.test || ['Rechnen'])[0], n:gc, make: () => Array.from({ length:gc }, () => B.calc(u)) });
      pl.push({ name:(u.labels && u.labels.test || [,'Auswählen'])[1], n:6, make: () => Array.from({ length:6 }, () => B.blitz(u)) });
    }
    if (u.quiz) { const n = Math.min(u.gen ? 8 : 12, u.quiz.length); pl.push({ name:'Fragen', n, make: () => shuffle(u.quiz).slice(0,n).map(qItem) }); }
    if (u.write) { const n = Math.min(4, u.write.length); pl.push({ name:'Schreiben', n, make: () => shuffle(u.write).slice(0,n).map(wItem) }); }
    return label(pl);
  }
  const plan = [], L = u.words.filter(w => !w.nl), wr = u.words.filter(canWrite);
  plan.push({ name:'Wörter', n:6, make: () => shuffle(u.words).slice(0,6).map(w => B.vocab(w,u)) });
  if (canSpeak() && L.length >= 4) plan.push({ name:'Hören', n:4, make: () => shuffle(L).slice(0,4).map(w => B.listen(w,u)) });
  if (u.abc && canSpeak()) plan.push({ name:'Buchstaben', n:3, make: () => Array.from({ length:3 }, B.letter) });
  if (wr.length) plan.push({ name:'Schreiben ' + NAV.s.name, n:Math.min(5, wr.length), make: () => shuffle(wr).slice(0,5).map(B.write) });
  const wd = u.words.filter(canWriteDe);
  if (wd.length) plan.push({ name:'Schreiben Deutsch', n:Math.min(3, wd.length), make: () => shuffle(wd).slice(0,3).map(B.writeDe) });
  if (u.sentences.length) plan.push({ name:'Sätze', n:Math.min(5, u.sentences.length), make: () => shuffle(u.sentences).slice(0,5).map(B.gap) });
  if (u.grammar) plan.push({ name:'Grammatik', n:5, make: () => grammarTasks(u, 3, 2) });
  return label(plan);
}
function reviewPool(n, exclude){
  const idx = NAV.b.units.indexOf(NAV.u), items = [];
  NAV.b.units.slice(0, idx + 1).filter(u => u.no !== 'Special').forEach(u => u.words.forEach(w => {
    if (!exclude.includes(w.en) && canWrite(w)) items.push({ w, u, k:keyOf(NAV.b, u) });
  }));
  const hard = shuffle(items.filter(x => (DB.known[x.k] || {})[x.w.en] === 0)).slice(0, 3);
  return shuffle([...hard, ...shuffle(items.filter(x => !hard.includes(x))).slice(0, n - hard.length)]);
}
function buildCustomTest(t){
  const W = t.words.map(en => NAV.u.words.find(w => w.en === en)).filter(Boolean), set = { words:W };
  const parts = [];
  if (canSpeak()) parts.push(['Hören', shuffle(W).slice(0,4).map(w => B.listen(w, set))]);
  parts.push(['Schreiben', shuffle(W).map(B.write)]);
  parts.push(['Sätze', shuffle(t.sentences).slice(0,5).map(([s,a]) => B.gap({ s, a, o:[a, ...shuffle(t.words.filter(x => x !== a)).slice(0,2)], de:'' }))]);
  parts.push(['Wiederholung', reviewPool(t.review, t.words).map(x => Object.assign(B.vocab(x.w, x.u), { wkey:x.k }))]);
  return parts.map(([name, tasks], i) => ({ label:`Teil ${i+1}: ${name}`, tasks: tasks.map(tk => Object.assign(tk, { part:`Teil ${i+1}: ${name}` })) }));
}
function showCustomTest(t){
  stop(); crumbs();
  const hk = ukey() + '-' + t.id, parts = buildCustomTest(t), total = parts.reduce((a,p) => a + p.tasks.length, 0);
  const hist = (DB.tests[hk] || []).slice(-5).reverse();
  app.innerHTML = `<h1 class="h1">Übungstest: ${esc(t.title)}</h1>
  <div class="card"><p>${esc(t.de)}. Alle ${t.words.length} Wörter kommen vor, dazu Wörter aus früheren Units zur Wiederholung. ${total} Aufgaben:</p>
    <ul class="plist">${parts.map(p => `<li>${esc(p.label)} (${p.tasks.length} Aufgaben)</li>`).join('')}</ul>
    <p>Du siehst erst am Schluss, was richtig war. Dann bekommst du eine Note.</p>
    <button class="btn primary wide" id="go">Test starten</button></div>
  ${hist.length ? `<h2 class="h2">Deine letzten Tests</h2><div class="hist">${hist.map(h => `<div><span>${new Date(h.d).toLocaleDateString('de-CH')}</span><span>${h.pts} von ${h.n}</span><b>Note ${fmtNote(h.note)}</b></div>`).join('')}</div>` : ''}`;
  $('#go').onclick = () => run(parts.flatMap(p => p.tasks), { test:true, histKey:hk, restart: () => showCustomTest(t) });
}

/* =====================================================================
   8) ABLAUF EINER RUNDE (Üben und Test)
   ===================================================================== */
let SES = null;
function run(tasks, opt){ stop(); SES = Object.assign({ tasks, i:0, right:0, streak:0, results:[], test:false, locked:false }, opt); showTask(); }

function showTask(){
  SES.locked = false; SES.shown = Date.now(); SES.caseHint = false;
  const t = SES.tasks[SES.i], n = SES.tasks.length;
  if (t.kind === 'input' && !t.numeric && t.cs === undefined) t.cs = !!(NAV.s && NAV.s.id === 'de');
  let h = '';
  if (t.part) h += `<span class="part">${esc(t.part)}</span>`;
  if (t.prompt) h += `<div class="q">${esc(t.prompt)}</div>`;
  if (t.pic) h += `<div class="pic">${t.pic}</div>`;
  if (t.text) h += `<div class="word ${t.plain && t.plain.length > 45 ? 'long' : ''}">${t.text}</div>`;
  if (t.hint) h += `<div class="small">${esc(t.hint)}</div>`;
  if (t.say && canSpeak()) h += `<div class="row"><button class="btn" id="say">🔊 Anhören</button></div>`;
  if (t.kind === 'choice') h += `<div class="opts ${t.grid || ''}">${t.options.map((o,k) => `<button class="btn opt ${o.big ? 'bigopt' : ''}" data-k="${k}">${esc(o.label)}</button>`).join('')}</div>`;
  if (t.kind === 'input') h += `<form class="inrow" id="inf" autocomplete="off"><input id="inp" class="inp" ${t.im ? `inputmode="${t.im}"` : t.numeric ? 'inputmode="numeric"' : ''} autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort">${t.unit ? `<span class="ulbl">${esc(t.unit)}</span>` : ''}<button class="btn primary" type="submit">Prüfen</button></form>`;
  if (t.kind === 'spell') {
    const letters = t.word.en.split('');
    const extra = shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !letters.includes(c))).slice(0,2);
    t.tiles = shuffle(letters.concat(extra)).map((c,id) => ({ c, id, used:false })); t.ans = [];
    h += `<div class="row"><button class="btn" id="sp1">🔊 Buchstabieren</button><button class="btn" id="sp2">🐢 Langsam</button></div>
      <div class="slots" id="slots"></div><div class="ltiles" id="ltiles"></div>
      <div class="row"><button class="btn" id="del">⌫ Löschen</button></div>`;
  }
  h += `<div class="fb" id="fb" aria-live="polite"></div>`;
  app.innerHTML = bar(SES.i, n, (SES.test ? 'Test: ' : '') + `Aufgabe ${SES.i + 1} von ${n}`) + `<div class="card center">${h}</div>`;

  const tk = TOKEN;
  if ($('#say')) $('#say').onclick = () => speak(t.say, .85);
  if (t.autoSay && canSpeak()) setTimeout(() => { if (tk === TOKEN) speak(t.say, .85); }, 350);

  if (t.kind === 'choice') app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (SES.locked) return;
    const k = +b.dataset.k, ok = t.options[k].ok;
    if (SES.test) b.classList.add('picked');
    else {
      app.querySelectorAll('.opt').forEach((x,j) => { x.disabled = true; if (t.options[j].ok) x.classList.add('ok'); });
      if (!ok) b.classList.add('no');
    }
    answer(ok, t.options[k].label);
  });
  if (t.kind === 'input') {
    const inp = $('#inp'); inp.focus();
    $('#inf').onsubmit = e => {
      e.preventDefault();
      if (SES.locked) return;
      if (!inp.value.trim()) { inp.focus(); return; }
      const c = inputCheck(t, inp.value), ok = c.ok; SES.caseHint = !!c.caseOnly; SES.accentHint = !!c.accent;
      if (!SES.test) { inp.classList.add(ok ? 'ok' : 'no'); inp.disabled = true; }
      answer(ok, inp.value.trim());
    };
  }
  if (t.kind === 'spell') {
    $('#sp1').onclick = () => spellOut(t.word.en, .8);
    $('#sp2').onclick = () => spellOut(t.word.en, .5);
    $('#del').onclick = () => { if (SES.locked || !t.ans.length) return; t.ans.pop().used = false; drawSpell(t); };
    drawSpell(t);
    setTimeout(() => { if (tk === TOKEN) spellOut(t.word.en, .8); }, 400);
  }
}

function drawSpell(t){
  $('#slots').innerHTML = t.word.en.split('').map((_,k) => `<div class="slot ${t.ans[k] ? 'f' : ''}" data-k="${k}">${t.ans[k] ? t.ans[k].c : ''}</div>`).join('');
  $('#ltiles').innerHTML = t.tiles.map(x => `<button class="btn ltile ${x.used ? 'used' : ''}" data-id="${x.id}" aria-label="Buchstabe ${x.c}">${x.c}</button>`).join('');
  app.querySelectorAll('.ltile').forEach(b => b.onclick = () => pickTile(t, +b.dataset.id));
  app.querySelectorAll('.slot.f').forEach(s => s.onclick = () => { if (SES.locked) return; t.ans.splice(+s.dataset.k, 1)[0].used = false; drawSpell(t); });
}
function pickTile(t, id){
  if (SES.locked) return;
  const x = t.tiles.find(y => y.id === id); if (!x || x.used) return;
  x.used = true; t.ans.push(x); speak(letterName(x.c), .9);
  drawSpell(t);
  if (t.ans.length === t.word.en.length) {
    const given = t.ans.map(y => y.c).join(''), ok = given === t.word.en;
    $('#slots').classList.add(ok ? 'ok' : 'no');
    answer(ok, given);
  }
}
document.addEventListener('keydown', e => {
  if (!SES || SES.locked || !app.contains($('#ltiles'))) return;
  const t = SES.tasks[SES.i]; if (!t || t.kind !== 'spell') return;
  if (e.key === 'Backspace') { e.preventDefault(); $('#del').click(); return; }
  const k = e.key.toLowerCase();

function answer(ok, given){

  try { track(ok, dt, { q:t.plain || t.text || t.prompt, a:given, c:t.solution }); } catch (e) {}
  if (ok) SES.right++;

      + (copy ? `<form class="inrow" id="cpf" autocomplete="off"><input id="cp" class="inp" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Abschreiben" aria-label="Richtig abschreiben"><button class="btn primary">OK</button></form>`

function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function playState(){ const t = today(); if (!DB.play || DB.play.day !== t) DB.play = { day:t, earned:0, used:0, bonus:0, cnt:{} }; return DB.play; }
const maxMin = () => profMax(ACTIVE);
const remaining = () => { const P = playState(); return Math.max(0, Math.min(P.earned, maxMin()) + (P.bonus || 0) - P.used); };
const fmtRest = () => { const r = remaining(); return r >= 1 ? String(Math.floor(r)) : r > 0 ? '<1' : '0'; };
function updatePlay(){ const b = $('#playBtn'); if (b) b.textContent = '🎮 ' + fmtRest() + ' Min'; }
/* Spielminuten nach Note (Schweizer Skala 1–6) */
const MIN_PRACTICE = { 6:4, 5.5:3 };
const MIN_TEST = { 6:10, 5.5:8 };
const noteOf = (right, n) => n ? Math.round((right / n * 5 + 1) * 2) / 2 : 1;
const tooFast = () => SES && SES.results.length >= 3 && (SES.think || 0) / SES.results.length < 2000;
function earnNote(note, table, key, extra){
  const base = table[note] || 0;
  const r = base > 0 ? earn(base + (extra || 0), key) : { add:0, why:'low' };
  const pts = base > 0 && !['repeat', 'unapproved', 'fast'].includes(r.why) ? (table === MIN_TEST ? (note >= 6 ? 3 : 2) : 1) : 0;
  if (pts) { addPoints(pts); r.pts = pts; save(); }
  const next = Object.keys(table).map(Number).sort((a,b) => a - b).find(x => x > note);
  if (next) r.hint = `Mit Note ${fmtNote(next)} ${base > 0 ? 'hättest du' : 'gibt es'} ${table[next]} Minute${table[next] > 1 ? 'n' : ''}${base > 0 ? ' bekommen' : ''}.`;
  return r;
}
function earn(min, key){
  if (NAV.u && NAV.u.custom && !listApproved(NAV.u.custom)) return { add:0, why:'unapproved' };
  const P = playState(), max = maxMin();
  if (P.earned >= max) return { add:0, why:'max' };
  if (key) { const c = P.cnt[key] || 0; if (c >= 2) return { add:0, why:'repeat' }; P.cnt[key] = c + 1; }
  const before = P.earned; P.earned = Math.min(max, P.earned + min);
  save(); updatePlay();
  return { add:Math.round(P.earned - before), why: P.earned >= max ? 'max' : '' };
}
const earnHTML = r => (r.pts ? `<p class="earn">🏅 +${r.pts} Lernpunkt${r.pts > 1 ? 'e' : ''} für Belohnungen</p>` : '') + earnHTML0(r);
const earnHTML0 = r => r.add > 0
  ? `<p class="earn">🎮 +${r.add} Spielminute${r.add > 1 ? 'n' : ''}${r.better ? ' (mit 2 Extra-Minuten, weil du dich verbessert hast)' : ''}${r.why === 'max' ? '. Für heute hast du jetzt alle Minuten gesammelt.' : ''}</p>${r.hint && r.why !== 'max' ? `<p class="small">${r.hint}</p>` : ''}`
  : r.why === 'fast' ? '<p class="earn off">Zu schnell! Lies die Aufgaben genau, dann gibt es Spielminuten.</p>'
  : r.why === 'low' ? `<p class="earn off">Diesmal keine Spielminuten. ${r.hint || ''}</p>`
  : r.why === 'fix' ? '<p class="earn off">Korrigiere alle Fehler, dann gibt es 1 Spielminute.</p>'
  : r.why === 'unapproved' ? '<p class="earn off">Für deine eigene Liste gibt es Spielminuten, sobald Mama oder Papa sie freigegeben hat.</p>'
  : r.why === 'repeat' ? '<p class="earn off">Für diese Übung gibt es heute keine Spielminuten mehr. Probier eine andere Übung!</p>'
  : '<p class="earn off">Für heute hast du alle Spielminuten gesammelt. Super gelernt!</p>';

const GROUND = 262;
function showGame(){
  stop(); crumbs();

  app.innerHTML = `<h1 class="h1">🦘 Känguru-Sprung</h1>
  <div class="kpi"><div><b id="gRest">${fmtRest()}</b>Minuten übrig</div><div><b>${Math.round(Math.min(P.earned, max) + (P.bonus || 0))}</b>heute verdient</div><div><b>${DB.best || 0}</b>Rekord</div></div>
  <div class="gamewrap"><canvas id="cv" width="720" height="320" aria-label="Spielfeld"></canvas><div class="gover" id="gover" hidden></div></div>
  <p class="small center">Tippe aufs Spielfeld oder drücke die Leertaste, um zu springen. Sammle Sterne und spring über die Steine.</p>

  <p class="center"><button class="linkbtn" id="gParents">👪 Eltern-Bereich</button></p>`;
  $('#gParents').onclick = () => showParents();

function overlay(html, btns){ const o = $('#gover'); if (!o) return; o.hidden = false; o.innerHTML = html + `<div class="row">${btns}</div>`; }
function gameIdle(){
  scene($('#cv').getContext('2d'), { y:GROUND, obs:[], stars:[], t:0, score:0 });
  if (remaining() > 0) {
    overlay(`<div class="gbig">Bereit?</div><div>Du hast ${fmtRest()} Minuten Spielzeit.</div>`, '<button class="btn primary" id="gGo">Spielen</button>');
    $('#gGo').onclick = startGame;
  } else {
    overlay('<div class="gbig">Noch keine Spielzeit</div><div>Löse Übungen, dann bekommst du Spielminuten.</div>', '<button class="btn primary" id="gLearn">Zum Lernen</button>');
    $('#gLearn').onclick = showHome;
  }
}
function startGame(){
  if (remaining() <= 0) return gameIdle();
  $('#gover').hidden = true;
  try { const w = $('.gamewrap').getBoundingClientRect(); if (w.top < 0 || w.bottom > innerHeight) $('.gamewrap').scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){}
  GAME = { y:GROUND, vy:0, obs:[], stars:[], t:0, speed:7, score:0, last:0, acc:0, tk:TOKEN, lastRun:false, extra:0, nextObs:70, nextStar:120, saved:0 };
  requestAnimationFrame(gameLoop);
}
function gameJump(){ if (GAME && GAME.y >= GROUND - 1) GAME.vy = -15.5; }
document.addEventListener('keydown', e => { if (GAME && (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp')) { e.preventDefault(); gameJump(); } });
function gameLoop(ts){
  const G = GAME; if (!G || G.tk !== TOKEN || !$('#cv')) return;
  if (!G.last) G.last = ts;
  const dt = Math.min(50, ts - G.last), f = dt / 16.67; G.last = ts;
  G.acc += dt;
  if (G.acc >= 1000) {
    G.acc -= 1000;
    if (!G.lastRun) { const P = playState(); P.used = Math.min(P.used + 1 / 60, Math.min(P.earned, maxMin()) + (P.bonus || 0)); if (remaining() <= 0) G.lastRun = true; }
    else G.extra++;
    const el = $('#gRest'); if (el) el.textContent = fmtRest(); updatePlay();
    if (++G.saved % 10 === 0) save();
  }
  G.t += f; G.speed = 7 + G.t / 500;
  G.vy += 0.85 * f; G.y += G.vy * f; if (G.y > GROUND) { G.y = GROUND; G.vy = 0; }
  G.nextObs -= f; if (G.nextObs <= 0) { G.obs.push({ x:760, e:pick(['🪨','🌵','🪵']) }); G.nextObs = rnd(55,105) * Math.max(.6, 7 / G.speed); }
  G.nextStar -= f; if (G.nextStar <= 0) { G.stars.push({ x:760, y:GROUND - rnd(70,150) }); G.nextStar = rnd(80,160); }
  G.obs.forEach(o => o.x -= G.speed * f); G.stars.forEach(s => s.x -= G.speed * f);
  G.obs = G.obs.filter(o => o.x > -60); G.stars = G.stars.filter(s => s.x > -60 && !s.got);
  G.score += G.speed * f / 20;
  G.stars.forEach(s => { if (Math.abs(s.x + 15 - 90) < 30 && Math.abs(s.y - 12 - (G.y - 24)) < 36) { s.got = true; G.score += 10; } });
  const hit = G.obs.some(o => o.x < 104 && o.x + 34 > 76 && G.y > GROUND - 32);
  scene($('#cv').getContext('2d'), G);
  if (hit || (G.lastRun && G.extra >= 60)) return gameOver();
  requestAnimationFrame(gameLoop);
}
function scene(ctx, G){
  const W = 720, H = 320, sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#8fd3ff'); sky.addColorStop(1, '#e9f7ff'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#b7e4a1'; ctx.beginPath(); ctx.moveTo(0, GROUND + 4);
  for (let x = 0; x <= W; x += 30) ctx.lineTo(x, GROUND - 34 - 18 * Math.sin((x + G.t * 2) / 90));
  ctx.lineTo(W, GROUND + 4); ctx.fill();
  ctx.fillStyle = '#6fbf5c'; ctx.fillRect(0, GROUND + 2, W, H - GROUND);
  ctx.textBaseline = 'alphabetic';
  ctx.font = '40px serif'; G.obs.forEach(o => ctx.fillText(o.e, o.x, GROUND + 6));
  ctx.font = '30px serif'; G.stars.forEach(s => ctx.fillText('⭐', s.x, s.y));
  ctx.save(); ctx.translate(112, G.y + 4); ctx.scale(-1, 1); ctx.font = '46px serif'; ctx.fillText('🦘', 0, 0); ctx.restore();
  ctx.fillStyle = '#1b2238'; ctx.font = 'bold 22px Nunito, sans-serif'; ctx.fillText('⭐ ' + Math.floor(G.score), 16, 34);
  if (G.lastRun) { ctx.fillStyle = '#ef4444'; ctx.fillText('Letzte Runde!', W - 170, 34); }
}
function gameOver(){

const DEV_STORE = 'lernsprung-geraet';

const saveDev = () => { try { localStorage.setItem(DEV_STORE, JSON.stringify(DEV)); } catch (e) {} };

/* Biometrie (Fingerabdruck, Gesicht, Bildschirmsperre) über WebAuthn – nur auf diesem Gerät, ergänzt den Eltern-PIN.
   Die App prüft lokal, dass das Gerät die Person bestätigt hat (UV-Bit). Biometrische Daten verlassen das Gerät nie. */
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const rnd32 = () => crypto.getRandomValues(new Uint8Array(32));
async function bioAvailable(){
  try { return !!(window.PublicKeyCredential && isSecureContext && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
}
async function bioRegister(){
  const cred = await navigator.credentials.create({ publicKey:{ challenge:rnd32(), rp:{ name:'Lernsprung', id:location.hostname },
    user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:'eltern', displayName:'Eltern-Bereich Lernsprung' },
    pubKeyCredParams:[{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
    authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' }, timeout:60000, attestation:'none' } });
  if (!cred) throw new Error('abgebrochen');
  DEV.bio = b64u(cred.rawId); saveDev();
}
async function bioVerify(){
  const a = await navigator.credentials.get({ publicKey:{ challenge:rnd32(), rpId:location.hostname, allowCredentials:[{ type:'public-key', id:unb64u(DEV.bio) }], userVerification:'required', timeout:60000 } });
  const ad = new Uint8Array(a.response.authenticatorData);
  return !!(a && ad.length > 32 && (ad[32] & 0x04)); // Flag «User Verified»
}

const dayStr = dt => { const z = n => String(n).padStart(2, '0'); return dt.getFullYear() + '-' + z(dt.getMonth() + 1) + '-' + z(dt.getDate()); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const subjOf = k => CATALOG.find(s => k.startsWith(s.id + '-'));
const fmtDur = sec => sec >= 3600 ? Math.floor(sec / 3600) + ' h ' + Math.round(sec % 3600 / 60) + ' Min' : Math.round(sec / 60) + ' Min';
const pct = (a, n) => n ? Math.round(100 * a / n) : 0;
function weekSum(log, from){ const o = { s:0, n:0, ok:0, days:0 }; for (let i = 0; i < 7; i++) { const e = log[dayStr(addDays(from, i))]; if (e && e.n) { o.s += e.s || 0; o.n += e.n; o.ok += e.ok || 0; o.days++; } } return o; }
function statsOf(id){
  const D = profPD(id), log = D.log || {}, now = new Date(), w0 = weekStart(now), names = unitNames();
  const cur = weekSum(log, w0), prev = weekSum(log, addDays(w0, -7));
  const days = []; for (let i = 13; i >= 0; i--) { const k = dayStr(addDays(now, -i)), e = log[k] || {}; days.push({ k, s:e.s || 0, n:e.n || 0, ok:e.ok || 0 }); }
  const units = {}; Object.values(log).forEach(e => Object.entries(e.u || {}).forEach(([k, v]) => { const u = units[k] = units[k] || [0, 0]; u[0] += v[0]; u[1] += v[1]; }));
  const subj = {}; Object.entries(units).forEach(([k, v]) => { const S = subjOf(k); if (!S) return; const o = subj[S.id] = subj[S.id] || { S, n:0, ok:0, best:0, units:0 }; o.n += v[0]; o.ok += v[1]; });
  Object.entries(D.tests || {}).forEach(([k, arr]) => { const S = subjOf(k); if (!S) return; const o = subj[S.id] = subj[S.id] || { S, n:0, ok:0, best:0, units:0 }; o.best = Math.max(o.best, ...arr.map(t => t.note || 0)); if (arr.some(t => t.note >= 5.5)) o.units++; });
  const ranked = Object.entries(units).filter(([, v]) => v[0] >= 10).map(([k, v]) => ({ k, name:names[k] || k, n:v[0], p:pct(v[1], v[0]) })).sort((a, b) => b.p - a.p);
  const notes = Object.entries(D.tests || {}).flatMap(([k, arr]) => arr.map(t => ({ d:t.d, note:t.note, name:names[k] || k }))).sort((a, b) => a.d - b.d).slice(-20);
  const errs = {}; (D.err || []).forEach(e => { const x = errs[e.k + '|' + e.q] = errs[e.k + '|' + e.q] || Object.assign({ cnt:0 }, e); x.cnt++; x.a = e.a; });
  return { D, cur, prev, days, subj:Object.values(subj).sort((a, b) => b.n - a.n), top:ranked.slice(0, 3), low:ranked.slice(Math.max(3, ranked.length - 3)).reverse(), notes,
    errs:Object.values(errs).sort((a, b) => b.cnt - a.cnt || b.d - a.d), names };
}
function trend(a, b, unit){ if (!b) return ''; const d = a - b; return d === 0 ? ' <span class="small">= Vorwoche</span>' : ` <span class="small" style="color:var(${d > 0 ? '--ok' : '--bad'})">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit || ''}</span>`; }
function barsSVG(days){
  const mx = Math.max(10, ...days.map(d => d.s / 60)), W = 14 * 22;
  return `<svg viewBox="0 0 ${W} 96" class="dbars" role="img" aria-label="Lernminuten der letzten 14 Tage">${days.map((d, i) => { const h = Math.round(68 * (d.s / 60) / mx), x = i * 22 + 3, wd = new Date(d.k + 'T12:00').getDay();
    return `<rect x="${x}" y="${74 - h}" width="16" height="${Math.max(h, d.n ? 2 : 0)}" rx="3" fill="var(--c)" opacity="${i >= 7 ? 1 : .45}"><title>${new Date(d.k + 'T12:00').toLocaleDateString('de-CH', { weekday:'short', day:'numeric', month:'numeric' })}: ${Math.round(d.s / 60)} Min, ${d.n} Aufgaben</title></rect>
      <text x="${x + 8}" y="90" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">${'SMDMDFS'[wd]}</text>`; }).join('')}<line x1="0" y1="74.5" x2="${W}" y2="74.5" stroke="currentColor" opacity=".2"/></svg>`;

/* =====================================================================
   Wochenziel und Prüfungsplaner
   ===================================================================== */
const GOAL_BONUS = 5;
const goalOf = id => ((DB.profiles || {})[id] || {}).goal || null;
function goalState(id){
  const g = goalOf(id); if (!g || (!g.min && !g.days)) return null;
  const w = weekSum(profPD(id).log || {}, weekStart(new Date())), min = Math.floor(w.s / 60);
  const okMin = !g.min || min >= g.min, okDays = !g.days || w.days >= g.days;
  return { g, min, days:w.days, done:okMin && okDays, p:Math.min(100, Math.round(100 * ((g.min ? Math.min(1, min / g.min) : 1) + (g.days ? Math.min(1, w.days / g.days) : 1)) / 2)) };
}
function checkGoal(){
  const st = goalState(ACTIVE); if (!st || !st.done) return;
  const k = 'W' + dayStr(weekStart(new Date())); DB.pt = DB.pt || {}; if (DB.pt[k]) return;
  DB.pt[k] = GOAL_BONUS; toast(`🎯 Wochenziel geschafft! +${GOAL_BONUS} Lernpunkte`);
}
function goalHTML(id, kid){
  const st = goalState(id); if (!st) return '';
  const parts = []; if (st.g.min) parts.push(`${st.min} von ${st.g.min} Min`); if (st.g.days) parts.push(`${st.days} von ${st.g.days} Tagen`);
  return `<div class="card goal"><b>🎯 Wochenziel${st.done ? ' geschafft! 🎉' : ''}</b><span class="small">${parts.join(' · ')}${kid && !st.done ? ` · dann +${GOAL_BONUS} 🏅` : ''}</span><span class="dbar"><i style="width:${st.p}%"></i></span></div>`;
}
/* Prüfungen: DB.exams[id] = { id, p:Profil, d:'YYYY-MM-DD', s:Fach, g:Klasse, units:[unitKey], title, note?, by, t, del } */
const liveExams = pid => Object.values(DB.exams || {}).filter(e => e && !e.del && (!pid || e.p === pid)).sort((a, b) => a.d < b.d ? -1 : 1);
const daysTo = d => Math.round((new Date(d + 'T12:00') - new Date(dayStr(new Date()) + 'T12:00')) / 864e5);
function findUnit(k){
  for (const s of CATALOG) for (const g of s.grades) for (const b of g.books) for (const u of b.units) if ([s.id, g.grade, b.id, u.id].join('-') === k) return { s, g, b, u };
  return null;
}
function openUnit(k){ const f = findUnit(k); if (!f) return toast('Dieses Thema gibt es nicht mehr.'); NAV.n = f.g.grade; NAV.s = f.s; NAV.g = f.g; NAV.b = f.b; NAV.u = f.u; setColor(); showUnit(); }
/* Notenfarben: 5,5–6 dunkelgrün, 5–5,4 hellgrün, 4–4,9 gelb, unter 4 rot, ohne Probetest grau */
const noteColor = n => !n ? '#c3c9d6' : n >= 5.5 ? '#0b7a4b' : n >= 5 ? '#7fd08f' : n >= 4 ? '#f5b800' : '#ef4444';
const ndot = n => `<i class="ndot" style="background:${noteColor(n)}"></i>`;
function readiness(pid, k){
  const D = profPD(pid), best = (D.tests[k] || []).reduce((m, t) => Math.max(m, t.note || 0), 0);
  let n = 0, ok = 0; Object.values(D.log || {}).forEach(e => { const v = (e.u || {})[k]; if (v) { n += v[0]; ok += v[1]; } });
  const score = best ? best : n ? 1 + 4 * ok / n : 0;
  return { best, n, p:pct(ok, n), score, sym:ndot(best) };
}
function examPlan(e){
  const L = daysTo(e.d), R = e.units.map(k => ({ k, f:findUnit(k), r:readiness(e.p, k) })).filter(x => x.f);
  const weak = R.slice().sort((a, b) => a.r.score - b.r.score)[0];
  let tip;
  if (L < 0) tip = 'Vorbei';
  else if (L === 0) tip = 'Heute ist die Prüfung. Viel Glück! 🍀';
  else if (L === 1) tip = 'Morgen ist die Prüfung: Mach heute nochmals den Probetest' + (R.length > 1 ? 's' : '') + ' und schlaf gut.';
  else if (!weak) tip = 'Wähle ein Thema und übe.';
  else if (R.every(x => x.r.best >= 5.5)) tip = 'Alles im grünen Bereich! Wiederhole kurz und mach einen Probetest.';
  else tip = `Heute üben: ${weak.f.u.title}` + (weak.r.n >= 20 && !weak.r.best ? ' (jetzt den Probetest probieren)' : '');
  return { L, R, weak, tip };
}
const whenTxt = L => L === 0 ? 'heute' : L === 1 ? 'morgen' : L < 0 ? 'vorbei' : 'in ' + L + ' Tagen';
function examCard(e, kid){
  const P = DB.profiles[e.p] || {}, S = CATALOG.find(x => x.id === e.s) || { icon:'📅', name:e.s }, pl = examPlan(e);

    ${pl.R.length ? `<div class="eunits">${pl.R.map(x => `<button class="btn sm" data-ou="${esc(x.k)}">${x.r.sym} ${esc(x.f.u.title)}${x.r.best ? ' · ' + fmtNote(x.r.best) : x.r.n ? ' · geübt' : ''}</button>`).join('')}</div>
      <p class="small nleg">${ndot(6)}5,5–6 ${ndot(5)}5–5,4 ${ndot(4.5)}4–4,9 ${ndot(3)}unter 4 ${ndot(0)}noch kein Probetest</p>` : ''}
    ${pl.L >= 0 ? `<p class="small" style="margin:8px 0 0">💡 ${esc(pl.tip)}</p>` : ''}
    ${pl.weak && pl.L >= 1 && kid ? `<div class="row" style="justify-content:flex-start"><button class="btn primary" data-ou="${esc(pl.weak.k)}">Jetzt üben</button></div>` : ''}
    ${!kid ? `<div class="row" style="justify-content:flex-start">${pl.L < 0 && !e.note ? `<input class="inp" style="width:5em" type="text" inputmode="decimal" maxlength="4" placeholder="Note" data-enote="${e.id}"><button class="btn sm" data-enotes="${e.id}">Note speichern</button>` : ''}<button class="btn sm" data-edel="${e.id}">Löschen</button></div>` : ''}</div>`;

/* Zurück-Taste (Android, Browser): eine Ebene zurück statt App schliessen */
const SCREENS = { showHome:'home', showSubjects:'subjects', showUnits:'units', showUnit:'unit', showLearn:'learn', showLearnGen:'learnGen',
  flash:'sub', wordList:'sub', abcBoard:'sub', showGrammar:'sub', showPractice:'practice', showCustomTest:'testIntro', showTestIntro:'testIntro',
  run:'run', showProfiles:'sub0', showBlitz:'lgame', showMemory:'lgame', showSort:'lgame', showClock:'lgame', showMap:'lgame', showGame:'game', showParents:'parents', showRewards:'sub0', showExamForm:'sub0' };
let CUR = 'home', RET = null, ARMED = false, SKIP = false, BACKWARN = 0;
const hist = (fn, ...a) => { try { history[fn](...a); } catch (e) {} };
Object.entries(SCREENS).forEach(([n, id]) => {
  const f = window[n];
  window[n] = function(...args){
    if ((id === 'game' || id === 'parents') && CUR !== 'game' && CUR !== 'parents') RET = CUR;
    CUR = id; const r = f.apply(this, args);
    if (id === 'home') { if (ARMED) { ARMED = false; SKIP = true; hist('back'); } }
    else if (!ARMED) { ARMED = true; hist('pushState', { ls:1 }, ''); }
    return r;
  };
});
const PARENT = { subjects:'showHome', units:'showSubjects', unit:'showUnits', learn:'showUnit', learnGen:'showUnit', sub:'showLearn',
  practice:'showUnit', testIntro:'showUnit', lgame:'showPractice', sub0:'showHome' };
function appBack(){
  if (CUR === 'run') {
    const done = $('.bigstars') || $('.note');
    if (!done && Date.now() - BACKWARN > 2500) { BACKWARN = Date.now(); toast('Nochmals zurück drücken, um aufzuhören.'); return false; }
    return (SES && SES.test ? showUnit : showPractice)(), true;
  }
  if (CUR === 'game' || CUR === 'parents') {
    const to = { home:'showHome', subjects:'showSubjects', units:'showUnits', unit:'showUnit', learn:'showUnit', learnGen:'showUnit', sub:'showLearn', practice:'showPractice', testIntro:'showUnit', run:'showUnit', lgame:'showPractice' }[RET] || 'showHome';
    if (to !== 'showHome' && !NAV.s) return showHome(), true;
    return window[to](), true;
  }
  window[PARENT[CUR] || 'showHome'](); return true;
}
window.addEventListener('popstate', () => {
  if (SKIP) { SKIP = false; return; }
  if (!document.getElementById('drawer').hidden) { closeMenu(); ARMED = false; if (CUR !== 'home') { ARMED = true; hist('pushState', { ls:1 }, ''); } return; }
  ARMED = false;
  if (CUR === 'home') { hist('back'); return; }
  appBack();
  if (CUR !== 'home' && !ARMED) { ARMED = true; hist('pushState', { ls:1 }, ''); }
});

/* Update-Prüfung: lädt eine neue Version, sobald sie online ist */
const APP_VERSION = '2026-11-06-12';
async function checkUpdate(){
  if (!isHosted()) return;
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' }); if (!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION || $('#upd')) return;
    const bar = document.createElement('button'); bar.id = 'upd'; bar.className = 'toast'; bar.style.border = 'none'; bar.style.cursor = 'pointer';
    bar.textContent = '✨ Neue Version da – tippen zum Laden'; bar.onclick = () => location.reload();
    document.body.appendChild(bar);
  } catch (e) {}
}
setTimeout(checkUpdate, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
