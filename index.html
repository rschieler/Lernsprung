<style>
:root{
  --bg:#f7f9fd;--card:#ffffff;--ink:#141b2d;--muted:#667085;--line:#e4e8f1;--soft:#eef1f8;
  --star:#ffb020;--ok:#12a36b;--bad:#ef4444;--okbg:#e6f7ef;--badbg:#fdeaea;--pen:#ef4444;--c:#3b6ef5;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.07);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1322;--card:#181f33;--ink:#eef2ff;--muted:#9aa4bf;--line:#2a3350;--soft:#1f2740;--okbg:#10301f;--badbg:#3a1618;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1322;--card:#181f33;--ink:#eef2ff;--muted:#9aa4bf;--line:#2a3350;--soft:#1f2740;--okbg:#10301f;--badbg:#3a1618;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 55%,transparent);outline-offset:2px}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;background:none;border:none;cursor:pointer;padding:2px;white-space:nowrap;letter-spacing:-.01em}
.crumbs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{font-size:.88rem;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.sep{color:var(--muted)}
.sync{font-size:.8rem;font-weight:800;white-space:nowrap;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.sync.off{color:var(--bad)}
.stars{font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#ffd166,#ffb020);color:#3d2a00;border-radius:999px;padding:5px 12px;box-shadow:0 2px 8px rgba(255,176,32,.35)}
@media(max-width:300px){.brand .bt{display:none}}
@media(max-width:560px){.top{flex-wrap:wrap;row-gap:8px;padding:8px 12px}.brand{margin-right:auto}.crumbs{order:5;flex:1 1 100%}
  .crumbs:empty{display:none}.crumb{font-size:.82rem;padding:4px 10px}.stars,.playchip,.sync{padding:5px 10px}}

/* Seite */
.sheet{max-width:780px;margin:0 auto;padding:22px 18px 64px;min-height:calc(100vh - 60px)}
.h1{font-weight:900;font-size:clamp(1.6rem,5.2vw,2.2rem);line-height:1.12;letter-spacing:-.02em;margin:.1em 0 .35em}
.h2{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:1.6em 0 .7em;color:var(--muted)}

      learn:{ tips:['Der Wortstamm ist das Verb ohne die Endung -en: lach-en, fahr-en, sortier-en.',

let CLOUD = null, cloudBusy = false, cloudDirty = false, cloudTimer = null, VIEW = null;

function setSync(state, err){
  SYNC = { state, err: err || '' }; if ($('#syncInfo')) $('#syncInfo').innerHTML = syncInfo();

  el.hidden = false; el.className = 'sync' + (state === 'off' ? ' off' : '');

function mergeDB(local, remote, remoteWins){
  // Zurücksetzen: Wer einen älteren Stand als das letzte Zurücksetzen hat, verliert seinen Lernstand (Einstellungen bleiben)
  const R = Math.max(local.reset || 0, remote.reset || 0), blank = d => ({ known:{}, tests:{}, stars:0, best:0, play:null, settings:d.settings, reset:R });
  if ((local.reset || 0) < R) local = blank(local);
  if ((remote.reset || 0) < R) remote = blank(remote);
  const out = { reset:R, known:{}, tests:{}, stars: Math.max(local.stars || 0, remote.stars || 0), best: Math.max(local.best || 0, remote.best || 0) };
  const ls = local.settings || {}, rs = remote.settings || {};
  out.settings = Object.assign({ max:30, pin:'' }, (rs.t || 0) >= (ls.t || 0) && remote.settings ? rs : ls);
  const lp = local.play, rp = remote.play;
  if (!lp || !rp) out.play = lp || rp || null;
  else if (lp.day !== rp.day) out.play = lp.day > rp.day ? lp : rp;
  else { const cnt = Object.assign({}, lp.cnt || {}); for (const c in (rp.cnt || {})) cnt[c] = Math.max(cnt[c] || 0, rp.cnt[c]);
    out.play = { day:lp.day, earned:Math.max(lp.earned || 0, rp.earned || 0), used:Math.max(lp.used || 0, rp.used || 0), bonus:Math.max(lp.bonus || 0, rp.bonus || 0), cnt }; }
  const order = remoteWins ? [local.known || {}, remote.known || {}] : [remote.known || {}, local.known || {}];
  order.forEach(src => { for (const u in src) out.known[u] = Object.assign({}, out.known[u] || {}, src[u]); });
  const lt = local.tests || {}, rt = remote.tests || {};
  new Set([...Object.keys(lt), ...Object.keys(rt)]).forEach(k => {
    const m = new Map(); [...(lt[k] || []), ...(rt[k] || [])].forEach(t => m.set(t.d, t));
    out.tests[k] = [...m.values()].sort((a,b) => a.d - b.d).slice(-10);
  });
  return out;
}

const remoteOf = r => ({ known:r.known || {}, tests:r.tests || {}, stars:r.stars || 0, play:r.play || null, settings:r.settings || null, best:r.best || 0, reset:r.reset || 0 });

async function pushCloud(){
  if (!CLOUD || cloudBusy || !cloudDirty) return;
  cloudBusy = true; cloudDirty = false; setSync('saving');
  try { await CLOUD.set({ known:DB.known, tests:DB.tests, stars:DB.stars, play:DB.play || null, settings:DB.settings || null, best:DB.best || 0, reset:DB.reset || 0, updated:Date.now() }); setSync('ok'); }

  finally { cloudBusy = false; if (cloudDirty && CLOUD) { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 4000 + Math.random() * 2000); } }
}

function flash(dir, onlyHard){
  stop();
  const u = NAV.u;
  const deck = shuffle(onlyHard ? hardWords(u) : u.words);
  let queue = deck.slice(), done = 0;
  const total = deck.length;
  const draw = () => {
    if (!queue.length) return flashDone(dir, onlyHard, total);
    const w = queue[0], front = dir === 'fwd' ? w.en : w.de, back = dir === 'fwd' ? w.de : w.en;
    app.innerHTML = bar(done, total, `${done} von ${total} Karten geschafft`) + `<div class="card center flash">
      <div class="word">${esc(front)}</div>
      <div id="back" hidden><div class="line"></div><div class="word2">${esc(back)}</div><div class="pic">${w.pic}</div></div>
      <div class="row">${canSpeak() && dir === 'fwd' ? '<button class="btn" id="say">🔊 Anhören</button>' : ''}<button class="btn primary" id="flip">Umdrehen</button></div>
      <div class="row" id="rate" hidden>${canSpeak() && dir === 'rev' ? '<button class="btn" id="say2">🔊 Anhören</button>' : ''}<button class="btn again" id="again">↺ Nochmal</button><button class="btn good" id="know">✓ Kann ich</button></div>
    </div>`;
    if (dir === 'fwd') speak(w.en, .85);
    if ($('#say')) $('#say').onclick = () => speak(w.en, .85);
    $('#flip').onclick = () => {
      $('#back').hidden = false; $('#rate').hidden = false; $('#flip').hidden = true;
      if (dir === 'rev') { speak(w.en, .85); $('#say2') && ($('#say2').onclick = () => speak(w.en, .85)); }
      $('#know').focus();
    };
    $('#know').onclick = () => { markWord(w, 1); queue.shift(); done++; draw(); };
    $('#again').onclick = () => { markWord(w, 0); queue.push(queue.shift()); draw(); };
  };
  draw();
}

function numOptions(ans){
  const mag = Math.max(1, Math.pow(10, Math.floor(Math.log10(Math.max(ans, 1))) - 1));
  const d = [1,-1,2,-2,10,-10,100,-100,1000,-1000,mag,-mag,2*mag,-2*mag].filter(x => Math.abs(x) <= Math.max(ans, 10));
  const s = new Set([ans]); let guard = 0;
  while (s.size < 4 && guard++ < 200) { const v = ans + pick(d); if (v >= 0) s.add(v); }
  return shuffle([...s]);
}
function fromGen(g, asChoice){
  const sol = g.sol || g.q.replace('?', typeof g.answer === 'number' ? fmt(g.answer) : g.answer);
  const text = g.html || esc(g.q);
  if (g.options || (asChoice && g.choices)) {
    const options = g.choices && !g.options
      ? shuffle([g.answer, ...g.choices]).map(o => ({ label:o, ok: o === g.answer }))
      : g.options
      ? (g.fixed ? g.options : shuffle(g.options)).map(o => ({ label:o, ok: o === g.answer }))
      : numOptions(g.answer).map(v => ({ label:fmt(v) + (g.unit ? ' ' + g.unit : ''), ok: v === g.answer }));
    return { kind:'choice', prompt: g.prompt || 'Welche Zahl stimmt?', text, plain:g.q, options, solution:sol };
  }
  if (asChoice) return { kind:'choice', prompt: g.prompt || 'Welche Zahl stimmt?', text, plain:g.q, solution:sol,
    options: numOptions(g.answer).map(v => ({ label:fmt(v) + (g.unit ? ' ' + g.unit : ''), ok: v === g.answer })) };
  if (typeof g.answer === 'string') return { kind:'input', numeric:false, uml:!!g.uml, prompt: g.prompt || 'Schreib:', text, plain:g.q, answer:g.answer, alts:g.alts, im:g.im, solution:sol };
  return { kind:'input', numeric:true, prompt: g.prompt || 'Rechne:', text, plain:g.q, answer:String(g.answer), solution:sol, unit:g.unit };
}
function qItem(it){ const [q, a, ...w] = it;
  return { kind:'choice', prompt:'Wähle die richtige Antwort.', text:esc(q), plain:q, options:shuffle([a, ...w]).map(o => ({ label:o, ok: o === a })), solution:a }; }
function wItem(it){ const alts = String(it[1]).split('|');
  return { kind:'input', numeric:false, uml:true, prompt:'Schreib die Antwort.', text:esc(it[0]), plain:it[0], answer:alts[0], alts, solution:alts[0] }; }
const B = {
  vocab: (w,u) => {
    const toDe = Math.random() < .5;
    const others = u.words.filter(x => x !== w && x.de !== w.de && x.en !== w.en);
    const same = others.filter(x => w.cat && x.cat === w.cat);
    const pool = shuffle(same.length >= 3 ? same : others).slice(0,3);
    return { kind:'choice', prompt: toDe ? 'Was heisst das auf Deutsch?' : 'Wie heisst das auf ' + NAV.s.name + '?',
      text:esc(toDe ? w.en : w.de), say: toDe ? w.en : null,
      options: shuffle([w, ...pool]).map(x => ({ label: toDe ? x.de : x.en, ok: x === w })),
      solution: toDe ? w.de : w.en, after:w.en, word:w };
  },
  listen: (w,u) => {
    const L = u.words.filter(x => !x.nl);
    const pool = shuffle(L.filter(x => x !== w && x.pic !== w.pic)).slice(0,3);
    return { kind:'choice', prompt:'Hör gut zu! Welches Bild passt?', say:w.en, autoSay:true, grid:'pics',
      options: shuffle([w, ...pool]).map(x => ({ label:x.pic, big:true, ok: x === w })),
      solution:`${w.pic} ${w.en} = ${w.de}`, word:w };
  },
  write: w => ({ kind:'input', prompt:'Schreib das Wort auf ' + NAV.s.name + ':', text:esc(w.de), answer:w.en, solution:w.en, after:w.en, word:w }),
  spell: w => ({ kind:'spell', prompt:'Hör zu: Das Wort wird buchstabiert. Setz es zusammen!', hint:'Auf Deutsch: ' + w.de, word:w, answer:w.en, solution:w.en, after:w.en }),
  gap: s => ({ kind:'choice', prompt:'Welches Wort passt in die Lücke?',
    text: esc(s.s).replace('___', '<span class="gap">___</span>'),
    options: shuffle(s.o).map(o => ({ label:o, ok: o === s.a })), solution: s.s.replace('___', s.a), note:s.de, after: s.s.replace('___', s.a) }),
  letter: () => {
    const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), c = pick(L);
    const tricky = { A:'EIR', E:'IAY', I:'EAY', G:'JQ', J:'GYK', Y:'IWJ', R:'AHE', H:'RAK', V:'WBF', W:'VUY', U:'WYQ', Q:'KUG', K:'QCJ', C:'SKZ', Z:'CSX', S:'CZX', B:'PVD', P:'BDT' };
    const cand = [...(tricky[c] || '').split(''), ...shuffle(L)].filter((x,i,a) => x !== c && a.indexOf(x) === i).slice(0,3);
    return { kind:'choice', prompt:'Welchen Buchstaben hörst du?', say:letterName(c), autoSay:true, grid:'pics',
      options: shuffle([c, ...cand]).map(x => ({ label:x, big:true, ok: x === c })), solution:c };
  },
  calc: u => fromGen(GEN[u.gen](), false),
  blitz: u => fromGen(GEN[u.gen](), true)
};

function practiceTypes(u){
  const t = [];
  if (u.words.length) {
    t.push({ k:'vocab', icon:'🔤', name:'Wörter-Quiz', desc: NAV.s.name + ' und Deutsch' });
    if (canSpeak() && u.words.filter(w => !w.nl).length >= 4) t.push({ k:'listen', icon:'🎧', name:'Hörübung', desc:'Hör zu und wähle das Bild' });
    if (canSpeak() && u.words.some(canSpell)) t.push({ k:'spell', icon:'🧩', name:'Buchstabieren', desc:'Hör die Buchstaben und bau das Wort' });
    t.push({ k:'write', icon:'⌨️', name:'Schreiben', desc:'Schreib das Wort richtig' });
  }
  if (u.sentences.length) t.push({ k:'gaps', icon:'✏️', name:'Lückensätze', desc:'Welches Wort passt in den Satz?' });
  if (u.grammar) t.push({ k:'gram', icon:'🧠', name:'Grammatik', desc:u.grammar.title });
  if (u.abc && canSpeak()) t.push({ k:'letters', icon:'🅰️', name:'Buchstaben hören', desc:'Welchen Buchstaben hörst du?' });
  if (u.quiz) t.push({ k:'quiz', icon:'💬', name:'Quiz', desc: u.quiz.length + ' Fragen zum Thema' });
  if (u.write) t.push({ k:'qwrite', icon:'✏️', name:'Schreiben', desc:'Schreib die Antwort selbst' });
  if (u.gen && u.choiceOnly) { const c = (u.labels && u.labels.calc) || ['💬','Quiz','Wähle die richtige Antwort']; t.push({ k:'calc', icon:c[0], name:c[1], desc:c[2] }); }
  else if (u.gen) {
    const L = u.labels || {}, c = L.calc || ['✏️','Rechnen','Tippe das Ergebnis ein'], b = L.blitz || ['⚡','Blitzrechnen','Wähle die richtige Zahl'];
    t.push({ k:'calc', icon:c[0], name:c[1], desc:c[2] });
    t.push({ k:'blitz', icon:b[0], name:b[1], desc:b[2] });
  }
  const h = u.words.length ? hardWords(u) : [];
  if (h.length) t.push({ k:'hard', icon:'💪', name:'Schwierige Wörter', desc: h.length + ' Wörter zum Wiederholen' });
  return t;
}
function buildPractice(k,u,n = 10){
  const W = u.words;
  switch (k) {
    case 'vocab':   return shuffle(W).slice(0,n).map(w => B.vocab(w,u));
    case 'listen':  return shuffle(W.filter(w => !w.nl)).slice(0,n).map(w => B.listen(w,u));
    case 'spell':   return shuffle(W.filter(canSpell)).slice(0,n).map(B.spell);
    case 'write':   return shuffle(W.filter(canWrite)).slice(0,n).map(B.write);
    case 'gaps':    return shuffle(u.sentences).slice(0,n).map(B.gap);
    case 'letters': return Array.from({ length:n }, B.letter);
    case 'gram':    return grammarTasks(u, n - 3, 3);
    case 'quiz':    return shuffle(u.quiz).slice(0,n).map(qItem);
    case 'qwrite':  return shuffle(u.write).slice(0,n).map(wItem);
    case 'calc':    return Array.from({ length:n }, () => B.calc(u));
    case 'blitz':   return Array.from({ length:n }, () => B.blitz(u));
    case 'hard':    return shuffle(hardWords(u)).slice(0,n).map(w => canWrite(w) && Math.random() < .5 ? B.write(w) : B.vocab(w,u));
  }
  return [];
}
function showPractice(){
  stop(); crumbs();
  const types = practiceTypes(NAV.u);
  app.innerHTML = `<h1 class="h1">Üben</h1><p class="lead">Wähle ein Spiel. Eine Runde hat 10 Aufgaben.</p>
  <div class="menu">${types.map(t => mbtn(t.k, t.icon, t.name, t.desc)).join('')}</div>`;
  app.querySelectorAll('.mitem').forEach(b => b.onclick = () => startPractice(b.dataset.k));
}
function startPractice(k){
  const tasks = buildPractice(k, NAV.u);
  if (!tasks.length) { toast('Dafür gibt es in dieser Unit noch keine Aufgaben.'); return; }
  run(tasks, { restart: () => startPractice(k), ekey:'p:' + ukey() + ':' + k });
}

function testPlan(u){
  const label = pl => pl.map((p,i) => Object.assign(p, { label:`Teil ${i+1}: ${p.name}` }));
  if (u.gen || u.quiz) {
    const pl = [], gc = u.quiz ? 6 : 12;
    if (u.gen && u.choiceOnly) pl.push({ name:(u.labels && u.labels.calc || [,'Fragen'])[1], n:gc, make: () => Array.from({ length:gc }, () => B.calc(u)) });
    else if (u.gen) {
      pl.push({ name:(u.labels && u.labels.test || ['Rechnen'])[0], n:gc, make: () => Array.from({ length:gc }, () => B.calc(u)) });
      pl.push({ name:(u.labels && u.labels.test || [,'Auswählen'])[1], n:6, make: () => Array.from({ length:6 }, () => B.blitz(u)) });
    }
    if (u.quiz) { const n = Math.min(u.gen ? 8 : 12, u.quiz.length); pl.push({ name:'Fragen', n, make: () => shuffle(u.quiz).slice(0,n).map(qItem) }); }
    if (u.write) { const n = Math.min(4, u.write.length); pl.push({ name:'Schreiben', n, make: () => shuffle(u.write).slice(0,n).map(wItem) }); }
    return label(pl);
  }
  const plan = [], L = u.words.filter(w => !w.nl), wr = u.words.filter(canWrite);
  plan.push({ name:'Wörter', n:6, make: () => shuffle(u.words).slice(0,6).map(w => B.vocab(w,u)) });
  if (canSpeak() && L.length >= 4) plan.push({ name:'Hören', n:4, make: () => shuffle(L).slice(0,4).map(w => B.listen(w,u)) });
  if (u.abc && canSpeak()) plan.push({ name:'Buchstaben', n:3, make: () => Array.from({ length:3 }, B.letter) });
  if (wr.length) plan.push({ name:'Schreiben', n:Math.min(5, wr.length), make: () => shuffle(wr).slice(0,5).map(B.write) });
  if (u.sentences.length) plan.push({ name:'Sätze', n:Math.min(5, u.sentences.length), make: () => shuffle(u.sentences).slice(0,5).map(B.gap) });
  if (u.grammar) plan.push({ name:'Grammatik', n:5, make: () => grammarTasks(u, 3, 2) });
  return label(plan);
}
function reviewPool(n, exclude){
  const idx = NAV.b.units.indexOf(NAV.u), items = [];
  NAV.b.units.slice(0, idx + 1).filter(u => u.no !== 'Special').forEach(u => u.words.forEach(w => {
    if (!exclude.includes(w.en) && canWrite(w)) items.push({ w, u, k:keyOf(NAV.b, u) });
  }));
  const hard = shuffle(items.filter(x => (DB.known[x.k] || {})[x.w.en] === 0)).slice(0, 3);
  return shuffle([...hard, ...shuffle(items.filter(x => !hard.includes(x))).slice(0, n - hard.length)]);
}
function buildCustomTest(t){
  const W = t.words.map(en => NAV.u.words.find(w => w.en === en)).filter(Boolean), set = { words:W };
  const parts = [];
  if (canSpeak()) parts.push(['Hören', shuffle(W).slice(0,4).map(w => B.listen(w, set))]);
  parts.push(['Schreiben', shuffle(W).map(B.write)]);
  parts.push(['Sätze', shuffle(t.sentences).slice(0,5).map(([s,a]) => B.gap({ s, a, o:[a, ...shuffle(t.words.filter(x => x !== a)).slice(0,2)], de:'' }))]);
  parts.push(['Wiederholung', reviewPool(t.review, t.words).map(x => Object.assign(B.vocab(x.w, x.u), { wkey:x.k }))]);
  return parts.map(([name, tasks], i) => ({ label:`Teil ${i+1}: ${name}`, tasks: tasks.map(tk => Object.assign(tk, { part:`Teil ${i+1}: ${name}` })) }));
}
function showCustomTest(t){

    <ul class="plist">${parts.map(p => `<li>${esc(p.label)} (${p.tasks.length} Aufgaben)</li>`).join('')}</ul>

    <button class="btn primary wide" id="go">Test starten</button></div>
  ${hist.length ? `<h2 class="h2">Deine letzten Tests</h2><div class="hist">${hist.map(h => `<div><span>${new Date(h.d).toLocaleDateString('de-CH')}</span><span>${h.pts} von ${h.n}</span><b>Note ${fmtNote(h.note)}</b></div>`).join('')}</div>` : ''}`;
  $('#go').onclick = () => run(plan.flatMap(p => p.make().map(t => Object.assign(t, { part:p.label }))), { test:true, restart:showTestIntro });
}

/* =====================================================================
   8) ABLAUF EINER RUNDE (Üben und Test)
   ===================================================================== */
let SES = null;
function run(tasks, opt){ stop(); SES = Object.assign({ tasks, i:0, right:0, streak:0, results:[], test:false, locked:false }, opt); showTask(); }

function showTask(){
  SES.locked = false;
  const t = SES.tasks[SES.i], n = SES.tasks.length;
  let h = '';
  if (t.part) h += `<span class="part">${esc(t.part)}</span>`;
  if (t.prompt) h += `<div class="q">${esc(t.prompt)}</div>`;
  if (t.pic) h += `<div class="pic">${t.pic}</div>`;
  if (t.text) h += `<div class="word ${t.plain && t.plain.length > 45 ? 'long' : ''}">${t.text}</div>`;
  if (t.hint) h += `<div class="small">${esc(t.hint)}</div>`;
  if (t.say && canSpeak()) h += `<div class="row"><button class="btn" id="say">🔊 Anhören</button></div>`;
  if (t.kind === 'choice') h += `<div class="opts ${t.grid || ''}">${t.options.map((o,k) => `<button class="btn opt ${o.big ? 'bigopt' : ''}" data-k="${k}">${esc(o.label)}</button>`).join('')}</div>`;
  if (t.kind === 'input') h += `<form class="inrow" id="inf" autocomplete="off"><input id="inp" class="inp" ${t.im ? `inputmode="${t.im}"` : t.numeric ? 'inputmode="numeric"' : ''} autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort">${t.unit ? `<span class="ulbl">${esc(t.unit)}</span>` : ''}<button class="btn primary" type="submit">Prüfen</button></form>`;
  if (t.kind === 'spell') {
    const letters = t.word.en.split('');
    const extra = shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !letters.includes(c))).slice(0,2);
    t.tiles = shuffle(letters.concat(extra)).map((c,id) => ({ c, id, used:false })); t.ans = [];
    h += `<div class="row"><button class="btn" id="sp1">🔊 Buchstabieren</button><button class="btn" id="sp2">🐢 Langsam</button></div>
      <div class="slots" id="slots"></div><div class="ltiles" id="ltiles"></div>
      <div class="row"><button class="btn" id="del">⌫ Löschen</button></div>`;
  }
  h += `<div class="fb" id="fb" aria-live="polite"></div>`;
  app.innerHTML = bar(SES.i, n, (SES.test ? 'Test: ' : '') + `Aufgabe ${SES.i + 1} von ${n}`) + `<div class="card center">${h}</div>`;

  const tk = TOKEN;
  if ($('#say')) $('#say').onclick = () => speak(t.say, .85);
  if (t.autoSay && canSpeak()) setTimeout(() => { if (tk === TOKEN) speak(t.say, .85); }, 350);

  if (t.kind === 'choice') app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (SES.locked) return;
    const k = +b.dataset.k, ok = t.options[k].ok;
    if (SES.test) b.classList.add('picked');
    else {
      app.querySelectorAll('.opt').forEach((x,j) => { x.disabled = true; if (t.options[j].ok) x.classList.add('ok'); });
      if (!ok) b.classList.add('no');
    }
    answer(ok, t.options[k].label);
  });
  if (t.kind === 'input') {
    const inp = $('#inp'); inp.focus();
    $('#inf').onsubmit = e => {
      e.preventDefault();
      if (SES.locked) return;
      if (!inp.value.trim()) { inp.focus(); return; }
      const uml = x => t.uml ? norm(x).replace(/ae/g,'ä').replace(/oe/g,'ö').replace(/ue/g,'ü') : normWord(x);
      const ok = t.numeric ? inp.value.replace(/['’\s]/g, '') === t.answer : (t.alts || [t.answer]).some(x => uml(inp.value) === uml(x));
      if (!SES.test) { inp.classList.add(ok ? 'ok' : 'no'); inp.disabled = true; }
      answer(ok, inp.value.trim());
    };
  }
  if (t.kind === 'spell') {
    $('#sp1').onclick = () => spellOut(t.word.en, .8);
    $('#sp2').onclick = () => spellOut(t.word.en, .5);
    $('#del').onclick = () => { if (SES.locked || !t.ans.length) return; t.ans.pop().used = false; drawSpell(t); };
    drawSpell(t);
    setTimeout(() => { if (tk === TOKEN) spellOut(t.word.en, .8); }, 400);
  }
}

function drawSpell(t){
  $('#slots').innerHTML = t.word.en.split('').map((_,k) => `<div class="slot ${t.ans[k] ? 'f' : ''}" data-k="${k}">${t.ans[k] ? t.ans[k].c : ''}</div>`).join('');
  $('#ltiles').innerHTML = t.tiles.map(x => `<button class="btn ltile ${x.used ? 'used' : ''}" data-id="${x.id}" aria-label="Buchstabe ${x.c}">${x.c}</button>`).join('');
  app.querySelectorAll('.ltile').forEach(b => b.onclick = () => pickTile(t, +b.dataset.id));
  app.querySelectorAll('.slot.f').forEach(s => s.onclick = () => { if (SES.locked) return; t.ans.splice(+s.dataset.k, 1)[0].used = false; drawSpell(t); });
}
function pickTile(t, id){
  if (SES.locked) return;
  const x = t.tiles.find(y => y.id === id); if (!x || x.used) return;
  x.used = true; t.ans.push(x); speak(letterName(x.c), .9);
  drawSpell(t);
  if (t.ans.length === t.word.en.length) {
    const given = t.ans.map(y => y.c).join(''), ok = given === t.word.en;
    $('#slots').classList.add(ok ? 'ok' : 'no');
    answer(ok, given);
  }
}
document.addEventListener('keydown', e => {
  if (!SES || SES.locked || !app.contains($('#ltiles'))) return;
  const t = SES.tasks[SES.i]; if (!t || t.kind !== 'spell') return;
  if (e.key === 'Backspace') { e.preventDefault(); $('#del').click(); return; }
  const k = e.key.toLowerCase();
  if (/^[a-z]$/.test(k)) { const x = t.tiles.find(y => !y.used && y.c === k); if (x) pickTile(t, x.id); }
});

function answer(ok, given){
  if (SES.locked) return; SES.locked = true;
  const t = SES.tasks[SES.i];
  SES.results.push({ t, given, ok });
  if (ok) SES.right++;
  if (t.word && !ok) markWord(t.word, 0, t.wkey);
  const tk = ++TOKEN;
  if (SES.test) { setTimeout(() => { if (tk === TOKEN) nextTask(); }, 300); return; }
  if (t.after) speak(t.after, .9);
  const fb = $('#fb');
  if (ok) {
    SES.streak++; DB.stars++; save(); updateStars();
    fb.className = 'fb good';
    fb.innerHTML = `${pick(PRAISE)} ⭐${SES.streak >= 3 ? ` <small>${SES.streak} richtig hintereinander!</small>` : ''}${t.note ? `<small>${esc(t.note)}</small>` : ''}<button class="btn primary" id="nx">Weiter</button>`;
    $('#nx').onclick = () => { if (tk === TOKEN) nextTask(); };
    setTimeout(() => { if (tk === TOKEN) nextTask(); }, t.note ? 2300 : 1400);
  } else {
    SES.streak = 0;
    fb.className = 'fb wrong';
    fb.innerHTML = `Richtig ist: ${esc(t.solution)}${t.note ? `<small>${esc(t.note)}</small>` : ''}<button class="btn primary" id="nx">Weiter</button>`;
    $('#nx').onclick = nextTask; $('#nx').focus();
  }
}
function nextTask(){
  TOKEN++;
  SES.i++;
  if (SES.i >= SES.tasks.length) { SES.test ? endTest() : endPractice(); return; }
  try { showTask(); } catch (e) { SES.tasks.splice(SES.i, 1); SES.i--; nextTask(); return; }
  try { window.scrollTo(0,0); } catch (e) {}
}

function endPractice(){
  stop();
  const n = SES.tasks.length, p = SES.right / n, st = p >= .9 ? 3 : p >= .6 ? 2 : 1;
  const msg = st === 3 ? 'Fantastisch!' : st === 2 ? 'Sehr gut! Noch ein bisschen üben.' : 'Gut gemacht! Probier es gleich nochmals.';
  const er = earn(p >= .7 ? 3 : 2, SES.ekey || ('fix:' + ukey()));
  app.innerHTML = `<div class="card center"><div class="bigstars" aria-label="${st} von 3 Sternen">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</div>
    <h2 class="h1">${msg}</h2><p class="word">${SES.right} von ${n} richtig</p>${earnHTML(er)}
    <div class="row">${SES.restart ? '<button class="btn primary" id="again">Nochmal spielen</button>' : ''}<button class="btn" id="other">Anderes Spiel</button><button class="btn" id="unit">Zur Unit</button></div></div>`;
  if ($('#again')) $('#again').onclick = SES.restart;
  $('#other').onclick = showPractice;
  $('#unit').onclick = showUnit;
}

function endTest(){
  stop();
  const R = SES.results, n = R.length, pts = R.filter(r => r.ok).length;
  const note = Math.round((pts / n * 5 + 1) * 2) / 2;
  const k = SES.histKey || ukey(), again = SES.restart || showTestIntro;
  DB.tests[k] = (DB.tests[k] || []).concat({ d:Date.now(), note, pts, n }).slice(-10); save();
  const er = earn(5, 't:' + k);
  const wrong = R.filter(r => !r.ok);
  const msg = note >= 5.5 ? 'Super vorbereitet! Du bist bereit für den Test.'
    : note >= 4.5 ? 'Gut gemacht! Schau dir die Fehler nochmals an.'
    : note >= 4 ? 'Genügend. Übe die Fehler und mach den Test nochmals.'
    : 'Da braucht es noch Übung. Starte am besten mit «Lernen».';
  const strip = s => String(s || '').replace(/<[^>]+>/g, '');
  app.innerHTML = `<div class="card center"><div class="note" aria-label="Note ${fmtNote(note)}">${fmtNote(note)}</div>
    <p class="word">${pts} von ${n} Punkten</p><p>${msg}</p>${earnHTML(er)}
    <div class="row">${wrong.length ? '<button class="btn primary" id="fix">Fehler üben</button>' : ''}<button class="btn" id="again">Test nochmals machen</button><button class="btn" id="unit">Zur Unit</button></div></div>
    ${wrong.length ? `<h2 class="h2">Das war noch nicht richtig</h2><div class="mistakes">${wrong.map(r => `<div class="mis">
      <div>${r.t.grid === 'pics' ? '' : (r.t.pic ? r.t.pic + ' ' : '')}${esc(r.t.prompt)} ${r.t.grid === 'pics' ? '' : (r.t.plain ? esc(r.t.plain) : strip(r.t.text))}</div>
      <div class="mg">Deine Antwort: ${esc(r.given || '–')}</div>
      <div class="ma">Richtig: <b>${esc(r.t.solution)}</b></div></div>`).join('')}</div>` : ''}`;
  if ($('#fix')) $('#fix').onclick = () => run(wrong.map(r => Object.assign({}, r.t, { part:null })), { restart:null });
  $('#again').onclick = again;
  $('#unit').onclick = showUnit;
}

window.addEventListener('error', () => {
  if (!SES || !app.querySelector('.card') || document.getElementById('rescue')) return;
  const b = document.createElement('div'); b.className = 'row'; b.id = 'rescue';
  b.innerHTML = '<button class="btn primary">Weiter zur nächsten Aufgabe</button>';
  b.firstChild.onclick = () => { b.remove(); SES.locked = true; nextTask(); };
  app.appendChild(b);
});

/* =====================================================================
   9) SPIELMINUTEN, KÄNGURU-SPIEL UND ELTERN-BEREICH
   ===================================================================== */
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function playState(){ const t = today(); if (!DB.play || DB.play.day !== t) DB.play = { day:t, earned:0, used:0, bonus:0, cnt:{} }; return DB.play; }
const maxMin = () => { const m = DB.settings && DB.settings.max; return typeof m === 'number' ? m : 30; };
const remaining = () => { const P = playState(); return Math.max(0, Math.min(P.earned, maxMin()) + (P.bonus || 0) - P.used); };
const fmtRest = () => { const r = remaining(); return r >= 1 ? String(Math.floor(r)) : r > 0 ? '<1' : '0'; };
function updatePlay(){ const b = $('#playBtn'); if (b) b.textContent = '🎮 ' + fmtRest() + ' Min'; }
function earn(min, key){
  const P = playState(), max = maxMin();
  if (P.earned >= max) return { add:0, why:'max' };
  if (key) { const c = P.cnt[key] || 0; if (c >= 2) return { add:0, why:'repeat' }; P.cnt[key] = c + 1; }
  const before = P.earned; P.earned = Math.min(max, P.earned + min);
  save(); updatePlay();
  return { add:Math.round(P.earned - before), why: P.earned >= max ? 'max' : '' };
}
const earnHTML = r => r.add > 0
  ? `<p class="earn">🎮 +${r.add} Spielminuten${r.why === 'max' ? '. Für heute hast du jetzt alle Minuten gesammelt.' : ''}</p>`
  : r.why === 'repeat' ? '<p class="earn off">Für diese Übung gibt es heute keine Spielminuten mehr. Probier eine andere Übung!</p>'
  : '<p class="earn off">Für heute hast du alle Spielminuten gesammelt. Super gelernt!</p>';

const GROUND = 262;
function showGame(){
  stop(); crumbs();
  const max = maxMin(), P = playState();
  app.innerHTML = `<h1 class="h1">🦘 Känguru-Sprung</h1>
  <div class="kpi"><div><b id="gRest">${fmtRest()}</b>Minuten übrig</div><div><b>${Math.round(Math.min(P.earned, max) + (P.bonus || 0))}</b>heute verdient</div><div><b>${DB.best || 0}</b>Rekord</div></div>
  <div class="gamewrap"><canvas id="cv" width="720" height="320" aria-label="Spielfeld"></canvas><div class="gover" id="gover" hidden></div></div>
  <p class="small center">Tippe aufs Spielfeld oder drücke die Leertaste, um zu springen. Sammle Sterne und spring über die Steine.</p>
  <h2 class="h2">So verdienst du Spielminuten</h2>
  <div class="tip">🎯 Übungsrunde fertig: 2 Minuten. Mit mindestens 7 von 10 richtig: 3 Minuten.</div>
  <div class="tip">📝 Probetest: 5 Minuten · 📖 Alle Lernkarten durch: 2 Minuten</div>
  <div class="tip">🔁 Jede Übung zählt höchstens zweimal pro Tag. Heute sind höchstens ${max} Minuten möglich.</div>
  <p class="center"><button class="linkbtn" id="gParents">👪 Eltern-Bereich</button></p>`;
  $('#gParents').onclick = showParents;
  $('#cv').addEventListener('pointerdown', e => { e.preventDefault(); gameJump(); });
  gameIdle();
}
function overlay(html, btns){ const o = $('#gover'); if (!o) return; o.hidden = false; o.innerHTML = html + `<div class="row">${btns}</div>`; }
function gameIdle(){
  scene($('#cv').getContext('2d'), { y:GROUND, obs:[], stars:[], t:0, score:0 });
  if (remaining() > 0) {
    overlay(`<div class="gbig">Bereit?</div><div>Du hast ${fmtRest()} Minuten Spielzeit.</div>`, '<button class="btn primary" id="gGo">Spielen</button>');
    $('#gGo').onclick = startGame;
  } else {
    overlay('<div class="gbig">Noch keine Spielzeit</div><div>Löse Übungen, dann bekommst du Spielminuten.</div>', '<button class="btn primary" id="gLearn">Zum Lernen</button>');
    $('#gLearn').onclick = showHome;
  }
}
function startGame(){
  if (remaining() <= 0) return gameIdle();
  $('#gover').hidden = true;
  try { const w = $('.gamewrap').getBoundingClientRect(); if (w.top < 0 || w.bottom > innerHeight) $('.gamewrap').scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){}
  GAME = { y:GROUND, vy:0, obs:[], stars:[], t:0, speed:7, score:0, last:0, acc:0, tk:TOKEN, lastRun:false, extra:0, nextObs:70, nextStar:120, saved:0 };
  requestAnimationFrame(gameLoop);
}
function gameJump(){ if (GAME && GAME.y >= GROUND - 1) GAME.vy = -15.5; }
document.addEventListener('keydown', e => { if (GAME && (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp')) { e.preventDefault(); gameJump(); } });
function gameLoop(ts){
  const G = GAME; if (!G || G.tk !== TOKEN || !$('#cv')) return;
  if (!G.last) G.last = ts;
  const dt = Math.min(50, ts - G.last), f = dt / 16.67; G.last = ts;
  G.acc += dt;
  if (G.acc >= 1000) {
    G.acc -= 1000;
    if (!G.lastRun) { const P = playState(); P.used = Math.min(P.used + 1 / 60, Math.min(P.earned, maxMin()) + (P.bonus || 0)); if (remaining() <= 0) G.lastRun = true; }
    else G.extra++;
    const el = $('#gRest'); if (el) el.textContent = fmtRest(); updatePlay();
    if (++G.saved % 10 === 0) save();
  }
  G.t += f; G.speed = 7 + G.t / 500;
  G.vy += 0.85 * f; G.y += G.vy * f; if (G.y > GROUND) { G.y = GROUND; G.vy = 0; }
  G.nextObs -= f; if (G.nextObs <= 0) { G.obs.push({ x:760, e:pick(['🪨','🌵','🪵']) }); G.nextObs = rnd(55,105) * Math.max(.6, 7 / G.speed); }
  G.nextStar -= f; if (G.nextStar <= 0) { G.stars.push({ x:760, y:GROUND - rnd(70,150) }); G.nextStar = rnd(80,160); }
  G.obs.forEach(o => o.x -= G.speed * f); G.stars.forEach(s => s.x -= G.speed * f);
  G.obs = G.obs.filter(o => o.x > -60); G.stars = G.stars.filter(s => s.x > -60 && !s.got);
  G.score += G.speed * f / 20;
  G.stars.forEach(s => { if (Math.abs(s.x + 15 - 90) < 30 && Math.abs(s.y - 12 - (G.y - 24)) < 36) { s.got = true; G.score += 10; } });
  const hit = G.obs.some(o => o.x < 104 && o.x + 34 > 76 && G.y > GROUND - 32);
  scene($('#cv').getContext('2d'), G);
  if (hit || (G.lastRun && G.extra >= 60)) return gameOver();
  requestAnimationFrame(gameLoop);
}
function scene(ctx, G){
  const W = 720, H = 320, sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#8fd3ff'); sky.addColorStop(1, '#e9f7ff'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#b7e4a1'; ctx.beginPath(); ctx.moveTo(0, GROUND + 4);
  for (let x = 0; x <= W; x += 30) ctx.lineTo(x, GROUND - 34 - 18 * Math.sin((x + G.t * 2) / 90));
  ctx.lineTo(W, GROUND + 4); ctx.fill();
  ctx.fillStyle = '#6fbf5c'; ctx.fillRect(0, GROUND + 2, W, H - GROUND);
  ctx.textBaseline = 'alphabetic';
  ctx.font = '40px serif'; G.obs.forEach(o => ctx.fillText(o.e, o.x, GROUND + 6));
  ctx.font = '30px serif'; G.stars.forEach(s => ctx.fillText('⭐', s.x, s.y));
  ctx.save(); ctx.translate(112, G.y + 4); ctx.scale(-1, 1); ctx.font = '46px serif'; ctx.fillText('🦘', 0, 0); ctx.restore();
  ctx.fillStyle = '#1b2238'; ctx.font = 'bold 22px Nunito, sans-serif'; ctx.fillText('⭐ ' + Math.floor(G.score), 16, 34);
  if (G.lastRun) { ctx.fillStyle = '#ef4444'; ctx.fillText('Letzte Runde!', W - 170, 34); }
}
function gameOver(){
  const G = GAME; GAME = null;
  const sc = Math.floor(G.score), rec = sc > (DB.best || 0);
  if (rec) DB.best = sc; save(); updatePlay();
  const more = remaining() > 0;
  overlay(`<div class="gbig">${rec ? 'Neuer Rekord!' : 'Gut gespielt!'}</div><div>${sc} Punkte</div>` +
    (more ? `<div>Noch ${fmtRest()} Minuten Spielzeit.</div>` : '<div>Deine Spielzeit für heute ist aufgebraucht. Mit Lernen bekommst du neue Minuten.</div>'),
    (more ? '<button class="btn primary" id="gGo">Nochmal</button>' : '') + '<button class="btn" id="gLearn">Zum Lernen</button>');
  if ($('#gGo')) $('#gGo').onclick = startGame;
  $('#gLearn').onclick = showHome;
  const el = $('#gRest'); if (el) el.textContent = fmtRest();
}

function showParents(){

  const form = (lead, two) => `<h1 class="h1">👪 Eltern-Bereich</h1><p class="lead">${lead}</p>
    <div class="card"><form id="pf" class="inrow" autocomplete="off">

function unitNames(){
  const m = {};
  CATALOG.forEach(s => s.grades.forEach(g => g.books.forEach(b => b.units.forEach(u => {
    const k = [s.id, g.grade, b.id, u.id].join('-'); m[k] = `${s.name} · ${u.title}`;
    (u.tests || []).forEach(t => { m[k + '-' + t.id] = `${s.name} · Übungstest ${t.title}`; });
  }))));
  return m;
}
function parentPanel(){
  stop();
  const S = DB.settings, P = playState(), names = unitNames(), max = maxMin();
  const res = Object.entries(DB.tests || {}).flatMap(([k, arr]) => arr.map(t => Object.assign({ k }, t))).sort((a,b) => b.d - a.d).slice(0, 15);
  app.innerHTML = `<h1 class="h1">👪 Eltern-Bereich</h1>
  <h2 class="h2">Spielzeit heute</h2>
  <div class="kpi"><div><b>${Math.round(Math.min(P.earned, max) + (P.bonus || 0))}</b>verdient</div><div><b>${Math.round(P.used)}</b>gespielt</div><div><b>${fmtRest()}</b>übrig</div></div>
  <div class="card" style="margin-top:12px">
    <label for="pmax"><b>Maximale Spielminuten pro Tag</b></label>
    <div class="inrow"><input id="pmax" class="inp" type="number" inputmode="numeric" min="0" max="120" step="5" value="${max}"><button class="btn primary" id="psave">Speichern</button></div>
    <p class="small">Pro Juventute empfiehlt für Kinder bis 9 Jahre 30 bis 60 Minuten Bildschirmzeit pro Tag, Lernen mitgezählt.</p>
    <div class="row"><button class="btn" id="pb5">+5 Minuten heute</button><button class="btn" id="pb10">+10 Minuten heute</button></div>
  </div>
  ${isHosted() ? familyBox() : ''}
  <h2 class="h2">Letzte Probetests</h2>
  ${res.length ? `<div class="hist">${res.map(r => `<div><span>${new Date(r.d).toLocaleDateString('de-CH')}</span><span class="hn">${esc(names[r.k] || r.k)}</span><b>Note ${fmtNote(r.note)}</b></div>`).join('')}</div>` : '<p class="small">Noch keine Probetests gemacht.</p>'}
  <h2 class="h2">Lernstand zurücksetzen</h2>
  <div class="card" id="preset"><p class="small" style="margin-top:0">Löscht auf allen verbundenen Geräten: gelernte Wörter, Probetest-Noten, Sterne, Spiel-Rekord und die heute verdienten Spielminuten. PIN und Tagesmaximum bleiben.</p>
    <button class="btn" id="pr1">Lernstand zurücksetzen</button></div>
  <div class="row"><button class="btn" id="ppin">PIN ändern</button><button class="btn primary" id="pdone">Fertig</button></div>`;
  $('#pr1').onclick = () => {
    $('#preset').innerHTML = `<p style="margin-top:0"><b>Wirklich alles löschen?</b> Das kann nicht rückgängig gemacht werden.</p>
      <div class="row" style="justify-content:flex-start"><button class="btn" id="pr2" style="background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 0 #a51e1e">Ja, alles löschen</button><button class="btn" id="pr0">Abbrechen</button></div>`;
    $('#pr0').onclick = parentPanel;
    $('#pr2').onclick = () => {
      Object.assign(DB, { known:{}, tests:{}, stars:0, best:0, play:null, reset:Date.now() });
      save(); updateStars(); updatePlay(); toast('Lernstand zurückgesetzt'); parentPanel();
    };
  };
  $('#psave').onclick = () => { const v = Math.max(0, Math.min(120, Math.round(+$('#pmax').value || 0))); S.max = v; S.t = Date.now(); save(); updatePlay(); toast('Gespeichert: höchstens ' + v + ' Minuten pro Tag'); parentPanel(); };
  const bonus = n => { P.bonus = (P.bonus || 0) + n; save(); updatePlay(); toast('+' + n + ' Minuten für heute'); parentPanel(); };
  $('#pb5').onclick = () => bonus(5);
  $('#pb10').onclick = () => bonus(10);
  $('#ppin').onclick = () => { S.pin = ''; S.t = Date.now(); save(); showParents(); };
  $('#pdone').onclick = showHome;
  if ($('#fNew')) $('#fNew').onclick = () => { const c = newFamilyCode(); try { localStorage.setItem(FAM_KEY, c); } catch (e) {} location.href = familyLink(c); };
  if ($('#fJoin')) $('#fJoin').onclick = () => { const c = ($('#fCode').value || '').trim().toLowerCase().replace(/^.*[?&]f=/, '').replace(/[^a-z0-9]/g, '');
    if (c.length < 16) return toast('Der Familien-Code ist zu kurz.'); try { localStorage.setItem(FAM_KEY, c); } catch (e) {} location.href = familyLink(c); };
  if ($('#fCopy')) $('#fCopy').onclick = async () => { const l = familyLink(familyCode());
    try { if (navigator.share) await navigator.share({ title:'Lernsprung', url:l }); else { await navigator.clipboard.writeText(l); toast('Link kopiert'); } }
    catch (e) { try { await navigator.clipboard.writeText(l); toast('Link kopiert'); } catch (e2) { prompt('Link kopieren:', l); } } };
}
function syncInfo(){
  if (SYNC.state === 'ok') return '<b style="color:var(--ok)">✅ Verbunden: Lernstand und Einstellungen werden synchronisiert.</b>';
  if (SYNC.state === 'saving') return '<b>⏳ Verbinde mit der Familie …</b>';
  if (SYNC.state === 'off') return '<b style="color:var(--bad)">❌ Keine Verbindung.</b>' + (SYNC.err ? ` <span class="small">Fehler: ${esc(SYNC.err)}</span>` : '');
  return '<b>⏳ Noch nicht verbunden.</b> <span class="small">Lade die Seite neu.</span>';
}
function familyBox(){
  const c = familyCode();
  if (c) return `<h2 class="h2">Geräte verbinden</h2><div class="card">
    <p id="syncInfo">${syncInfo()}</p>
    <p>Dieses Gerät gehört zu eurer Familie. Öffne den Link auf einem anderen Handy, dann teilen beide Geräte Lernstand, Noten und Spielminuten.</p>
    <p class="small" style="word-break:break-all">${esc(familyLink(c))}</p>
    <div class="row"><button class="btn primary" id="fCopy">Link teilen</button></div>
    <p class="small">Wichtig: Füge die App erst nach dem Öffnen dieses Links zum Startbildschirm hinzu, dann bleibt die Verbindung erhalten.</p></div>`;
  return `<h2 class="h2">Geräte verbinden</h2><div class="card">
    <p>Verbinde die Handys, damit du von deinem Gerät aus steuern kannst.</p>
    <div class="row"><button class="btn primary" id="fNew">Familie einrichten</button></div>
    <p class="small">Oder Code bzw. Link von einem anderen Gerät einfügen:</p>
    <div class="inrow"><input id="fCode" class="inp" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Familien-Code oder Link" aria-label="Familien-Code"><button class="btn" id="fJoin">Verbinden</button></div></div>`;
}

/* Start */
$('#homeBtn').onclick = () => showHome();
$('#playBtn').onclick = () => showGame();
updateStars(); updatePlay();
/* Zurück-Taste (Android, Browser): eine Ebene zurück statt App schliessen */
const SCREENS = { showHome:'home', showSubjects:'subjects', showUnits:'units', showUnit:'unit', showLearn:'learn', showLearnGen:'learnGen',
  flash:'sub', wordList:'sub', abcBoard:'sub', showGrammar:'sub', showPractice:'practice', showCustomTest:'testIntro', showTestIntro:'testIntro',
  run:'run', showGame:'game', showParents:'parents' };
let CUR = 'home', RET = null, ARMED = false, SKIP = false, BACKWARN = 0;
const hist = (fn, ...a) => { try { history[fn](...a); } catch (e) {} };
Object.entries(SCREENS).forEach(([n, id]) => {
  const f = window[n];
  window[n] = function(...args){
    if ((id === 'game' || id === 'parents') && CUR !== 'game' && CUR !== 'parents') RET = CUR;
    CUR = id; const r = f.apply(this, args);
    if (id === 'home') { if (ARMED) { ARMED = false; SKIP = true; hist('back'); } }
    else if (!ARMED) { ARMED = true; hist('pushState', { ls:1 }, ''); }
    return r;
  };
});
const PARENT = { subjects:'showHome', units:'showSubjects', unit:'showUnits', learn:'showUnit', learnGen:'showUnit', sub:'showLearn',
  practice:'showUnit', testIntro:'showUnit' };
function appBack(){
  if (CUR === 'run') {
    const done = $('.bigstars') || $('.note');
    if (!done && Date.now() - BACKWARN > 2500) { BACKWARN = Date.now(); toast('Nochmals zurück drücken, um aufzuhören.'); return false; }
    return (SES && SES.test ? showUnit : showPractice)(), true;
  }
  if (CUR === 'game' || CUR === 'parents') {
    const to = { home:'showHome', subjects:'showSubjects', units:'showUnits', unit:'showUnit', learn:'showUnit', learnGen:'showUnit', sub:'showLearn', practice:'showPractice', testIntro:'showUnit', run:'showUnit' }[RET] || 'showHome';
    if (to !== 'showHome' && !NAV.s) return showHome(), true;
    return window[to](), true;
  }
  window[PARENT[CUR] || 'showHome'](); return true;
}
window.addEventListener('popstate', () => {
  if (SKIP) { SKIP = false; return; }
  ARMED = false;
  if (CUR === 'home') { hist('back'); return; }
  appBack();
  if (CUR !== 'home' && !ARMED) { ARMED = true; hist('pushState', { ls:1 }, ''); }
});

showHome();

/* Update-Prüfung: lädt eine neue Version, sobald sie online ist */
const APP_VERSION = '2026-11-05-3';
async function checkUpdate(){
  if (!isHosted()) return;
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' }); if (!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION || $('#upd')) return;
    const bar = document.createElement('button'); bar.id = 'upd'; bar.className = 'toast'; bar.style.border = 'none'; bar.style.cursor = 'pointer';
    bar.textContent = '✨ Neue Version da – tippen zum Laden'; bar.onclick = () => location.reload();
    document.body.appendChild(bar);
  } catch (e) {}
}
setTimeout(checkUpdate, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
</script>
</body>
</html>
