<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LS Betreiber</title><meta name="theme-color" content="#16181d"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LS Betreiber">
<style>body{margin:0;background:#16181d;color:#fff;font:16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}</style></head>
<body><p id="m">⏳ Betreiber-Bereich wird geladen …</p>
<script>
/* Betreiber-App: eigene installierbare Web-App (Bereich /betreiber/), lädt die Lern-App und öffnet direkt den Betreiber-Bereich. */
fetch('../index.html?v=' + Date.now(), { cache:'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(h => {
  h = h.replace('<head>', '<head><base href="../"><script>window.LS_ADMIN = 1;<\/script>')
    .replace('<link rel="manifest" href="manifest.json">', '<link rel="manifest" href="betreiber/manifest.json">')
    .replace(/<title>[^<]*<\/title>/, '<title>LS Betreiber</title>')
    .replace(/<link rel="apple-touch-icon"[^>]*>/, '<link rel="apple-touch-icon" sizes="180x180" href="betreiber/icon-180.png">')
    .replace('<meta name="apple-mobile-web-app-title" content="Lernsprung">', '<meta name="apple-mobile-web-app-title" content="LS Betreiber">')
    .replace('<meta name="application-name" content="Lernsprung">', '<meta name="application-name" content="Lernsprung Betreiber">')
    .replace('<meta name="theme-color" content="#3b6ef5">', '<meta name="theme-color" content="#16181d">');
  document.open(); document.write(h); document.close();
}).catch(e => { document.getElementById('m').textContent = 'Keine Verbindung. Bitte später nochmals öffnen.'; });
</script></body></html>
